[package]
name = "protocol"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/myne-md/myne"
description = "Myne v0.1 cryptographic protocol primitives (no_std + alloc)"

[dependencies]
hkdf = { version = "0.12", default-features = false }
# SCRAM-SHA-256-PLUS client (MYND-425): PBKDF2-HMAC-SHA256 is the RFC 5802/7677
# mandated SCRAM KDF. RustCrypto crate (closed-stack discipline — hand-rolling a
# KDF is forbidden); matches the Go server's crypto/pbkdf2. no_std + alloc.
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
# base64 for the SCRAM AuthMessage (s= salt + c= channel-binding fields, RFC
# 5802). Serialization only, not crypto; no_std + alloc; already workspace-locked.
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
# The hand-composed AEAD's cipher- and MAC-state wipe is requested HERE, at the
# site that relies on it, because a property held by accident is not held. Both
# impls are `#[cfg(feature = "zeroize")]`: `chacha20`'s `Drop`/`ZeroizeOnDrop`
# on `ChaChaCore`/`XChaChaCore`, and `poly1305`'s `Drop for State`. `chacha20`'s
# used to arrive only because `chacha20poly1305` — the line above, a test-only
# cross-check — declares it unconditionally and cargo unifies, so demoting that
# crate to a dev-dependency would have compiled the wipe out with no compile
# error, no failing test and no lockfile diff worth noticing. `poly1305`'s was
# never on: its feature is implied by an optional dependency and is absent from
# its `[features]` table, so a reader checking that table concludes there is
# nothing to enable. `default-features = false` switched neither off — neither
# crate carries `zeroize` in a default set; the defect was the absent request.
# No new crate enters the graph: `zeroize` is already a direct dependency below.
chacha20 = { version = "0.10", default-features = false, features = ["zeroize"] }
poly1305 = { version = "0.8", default-features = false, features = ["zeroize"] }
sha2 = { version = "0.10", default-features = false }
subtle = { version = "2", default-features = false }
zeroize = { version = "1.8", default-features = false, features = ["alloc", "derive"] }
getrandom = { version = "0.2", default-features = false }
bip39 = { version = "2", default-features = false, features = ["alloc"] }
unicode-normalization = { version = "0.1.25", default-features = false }
thiserror = { version = "2", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
tracing = { version = "0.1", default-features = false }
# ML-KEM (FIPS 203), the PQ KEM for the B2B person-keypair per-recipient wrap
# (myne-md/myne#698, b2b-identity-substrate task 2). RustCrypto KEMs team
# (tarcieri + `github:rustcrypto:kems`), same closed-stack discipline as the
# rows above. `default-features = false` + explicit features: `alloc` (the
# 0.3.x default), `zeroize` for key-material hygiene matching the rows above.
# The `getrandom` feature stays OFF: the crate takes `rand_core::CryptoRngCore`
# from the caller, so the wasm32 graph stays getrandom-free and the entropy
# source remains the explicit boundary decision it is today (the `custom`
# getrandom backend + `wasm-csprng-check.sh`). `pkcs8`/`pem`/`hazmat` stay off:
# no serialization or hazmat surface is used. `rand_core 0.10` is a new major
# in the shared lock - arrives transitively, reviewed in the dep-policy ledger.
# No independent audit exists for any Rust ML-KEM (README states it); the
# compensating control is NIST KAT vectors + property tests (task 2) per the
# same paragraph-6 posture that admits the rest of the stack. Ledger row:
# docs/dependency-policy.md (this change).
ml-kem = { version = "0.3.2", default-features = false, features = ["alloc", "zeroize"] }
# ML-DSA (FIPS 204), the PQ signature half of the person-keypair hybrid
# (Ed25519 + ML-DSA-65 per the roadmap commitment; myne-md/myne#698 task 2).
# RustCrypto signatures team, `signature` 3.0 trait, `MlDsa65` param set.
# `getrandom` stays OFF (a 32-byte seed is supplied from the existing CSPRNG
# path) and `pkcs8` off. `rand_core` is ON only so `sign_randomized` can accept
# the caller's `CryptoRng`; it draws nothing itself, the entropy source stays
# `crate::rng::OsRng`. 0.1.x semver, API churn risk documented in the ledger row.
# The hybrid combiner itself is Myne-side (protocol/src/person_key.rs, task 2)
# following IETF draft-ietf-lamps-pq-composite-sigs-19; composite ML-DSA is
# EUF-CMA only, so the Myne usage records that bound explicitly.
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc", "zeroize", "rand_core"] }
# Ed25519, the classical signature half of the person-keypair hybrid.
# RustCrypto/dalek (curve25519-dalek org, multi-maintainer); promoted from a
# transitive edge (tor-sidecar) to a direct one because this crate now names
# its types. `fast` (precomputed tables) + `zeroize` from the default set;
# `std` stays OFF (no_std crate) with `alloc` on for the surfaces used.
# `rand_core` stays off like every other crate in this file: seeds come from
# the caller.
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["fast", "zeroize", "alloc"] }
# rand_core 0.10: direct edge for the CryptoRng bound the person-keypair
# wrap functions take. The version unifies with ml-kem's transitive
# requirement; getrandom stays out of this crate's graph.
rand_core = { version = "0.10", default-features = false }
curve25519-dalek = { version = "4.1.3", default-features = false, features = ["alloc", "zeroize"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

# wasm32 (Phase 3 web client). getrandom 0.2 refuses to build for
# `wasm*-unknown-unknown` unless a backend is chosen, and the two choices are
# not equivalent:
#
#   - `js`     pulls in wasm-bindgen and its JS glue, adding a build-tool
#              dependency and a code-generation step to a crate that is
#              `#![no_std]` and deliberately has neither.
#   - `custom` declares an `extern "Rust"` hook the EMBEDDER registers
#              (`register_custom_getrandom!`), which for the web client is one
#              call to `crypto.getRandomValues` in the Worker host (task 81).
#
# `custom` is chosen deliberately, not by default: it keeps the primitive crate
# free of wasm-bindgen and leaves the entropy source an explicit, auditable
# decision at the boundary that actually has one. The Phase 0 spike proved this
# path derives a byte-identical key in all three browsers.
#
# The failure mode this MUST NOT have is silent: an unregistered hook links
# nothing in an rlib, so `cargo build --target wasm32-unknown-unknown` passes
# with no entropy source at all. `scripts/wasm-csprng-check.sh` is the gate for
# that — it asserts a real cdylib link FAILS while no backend is registered.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", default-features = false, features = ["custom"] }

[features]
# Bake the `myne-test-vectors` fixtures into the `vectors` test binary so it can
# run where there is no filesystem — i.e. in a browser (phase3-web-client task
# 15). OFF by default and it must stay off: the arm it enables is a table of
# `include_str!`s pointing into the companion repo, and `include_str!` of an
# absent file is a **compile error**, not a skip. A contributor without the
# companion checked out has to be able to build this crate's tests.
#
# Native runs never need it — they read the same files at run time and skip when
# they are missing.
browser-vectors = []

[dev-dependencies]
serde_json = { version = "1", default-features = false, features = ["alloc"] }

# Native-only dev-dependencies.
#
# `proptest` is gated off wasm32 rather than left unconditional because cargo
# builds every dev-dependency in the graph when it builds ANY test target — so an
# unconditional `proptest` would have to compile for `wasm32-unknown-unknown`
# before `--test vectors` could run there, and its default features reach for
# process and timeout APIs that target does not have. The property tests are
# native by nature; nothing is lost.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Property-based testing (dev-only; never enters the shipped dependency
# graph). Used by tests/crypto_properties.rs to assert universal laws
# (roundtrip, determinism, forgery-rejection) over thousands of generated
# inputs, complementing the example-based attack suite + mutation testing.
proptest = "1"

# The browser test harness (phase3-web-client task 15). Dev-only, wasm-only, and
# **never** in the shipped graph: `myne-web-wasm` is the crate that ships, and it
# does not depend on this.
#
# Same family as the `wasm-bindgen` already pinned in the shared `Cargo.lock`,
# and the same transitive→direct promotion precedent as `js-sys` in
# `web/wasm/Cargo.toml`. What it buys is the one thing this task is about:
# `wasm_bindgen_test_configure!(run_in_browser)` runs the vectors inside a real
# browser's wasm engine, driven over WebDriver — not in node, and not in a
# standalone runtime that happens to execute wasm.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[lints.rust]
# `cargo-llvm-cov` sets these cfgs when instrumenting; `coverage_nightly`
# gates the `#[coverage(off)]` opt-out on the inline `#[cfg(test)]` modules
# (see lib.rs). Register them so they are not flagged as unexpected cfgs
# under `clippy -D warnings`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)', 'cfg(coverage_nightly)'] }
