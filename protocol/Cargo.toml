[package]
name = "protocol"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/myne-md/myne"
description = "Myne v0.1 cryptographic protocol primitives (no_std + alloc)"

[dependencies]
hkdf = { version = "0.12", default-features = false }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
chacha20 = { version = "0.9", default-features = false }
poly1305 = { version = "0.8", default-features = false }
sha2 = { version = "0.10", default-features = false }
subtle = { version = "2", default-features = false }
zeroize = { version = "1.8", default-features = false, features = ["alloc", "derive"] }
getrandom = { version = "0.2", default-features = false }
bip39 = { version = "2", default-features = false, features = ["alloc"] }
unicode-normalization = { version = "0.1.25", default-features = false }
thiserror = { version = "2", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
tracing = { version = "0.1", default-features = false }

[dev-dependencies]
serde_json = { version = "1", default-features = false, features = ["alloc"] }
# Property-based testing (dev-only; never enters the shipped dependency
# graph). Used by tests/crypto_properties.rs to assert universal laws
# (roundtrip, determinism, forgery-rejection) over thousands of generated
# inputs, complementing the example-based attack suite + mutation testing.
proptest = "1"

[lints.rust]
# `cargo-llvm-cov` sets these cfgs when instrumenting; `coverage_nightly`
# gates the `#[coverage(off)]` opt-out on the inline `#[cfg(test)]` modules
# (see lib.rs). Register them so they are not flagged as unexpected cfgs
# under `clippy -D warnings`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)', 'cfg(coverage_nightly)'] }
