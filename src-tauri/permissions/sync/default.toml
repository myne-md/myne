# Permissions for the in-app `sync` Tauri plugin (MYND-424, Phase 2 client
# sync engine). Picked up under the `sync:` ACL namespace because `build.rs`
# declares this as an `InlinedPlugin`. Capability files reference these as
# `sync:default` (or `sync:allow-sync-get-endpoint` /
# `sync:allow-sync-set-endpoint`).
#
# Deny-by-default (SYNC-15): only the device-local endpoint-config pair is
# granted in task 3. The data-plane commands (push/pull/sync-now/status), added
# to this same plugin by later tasks + MYND-425/426/427, MUST each get their own
# `commands.allow` entry AND remain gated on an authenticated session. The
# endpoint-config pair is intentionally reachable pre-auth (an operator
# configures the server before unlocking/enrolling) but moves no vault bytes.
# The `default` bundle stays MAIN-WINDOW-ONLY: endpoint config, enrol/join,
# device approve/remove, tor-routing set, conflict resolution and reset are
# account/device management + settings, none of which an editor pane has UI
# for. A detached (pop-out) note window (myne#677, epic #173, sync-ledger
# SYNC-12) gets the READ-ONLY status seat `detached-status` below, so its
# per-note unsynced-edit marker shows the same state a split pane's does.
# No sync mutation, no device management, no endpoint/tor setter to a
# non-main window.

"$schema" = "../../gen/schemas/desktop-schema.json"

[default]
description = "Default permission set for the sync plugin — endpoint config (SYNC-14) + read-only status / manual-trigger affordances. No data-plane blob access."
permissions = [
    "allow-sync-get-endpoint",
    "allow-sync-set-endpoint",
    "allow-sync-status",
    "allow-sync-unsynced-edits",
    "allow-sync-materialisation-progress",
    "allow-sync-now",
    "allow-sync-published-state",
    "allow-resolve-identity",
    "allow-sync-person-create-invite",
    "allow-sync-list-vault-invites",
    "allow-sync-person-accept-invite",
    "allow-sync-member-join-vault",
    "allow-sync-member-vault-status",
    "allow-sync-person-set-member-password",
    "allow-sync-person-unlock-member-vault-with-password",
    "allow-sync-person-set-member-pin",
    "allow-sync-person-set-member-biometric",
    "allow-sync-person-unlock-member-vault-with-pin",
    "allow-sync-person-unlock-member-vault-with-biometric",
    "allow-sync-member-unlock-status",
    "allow-sync-person-clear-member-unlock",
    "allow-sync-list-roster",
    "allow-sync-person-unlock",
    "allow-sync-person-setup",
    "allow-sync-person-join-device",
    "allow-sync-person-claim-device",
    "allow-sync-person-list-vaults",
    "allow-sync-person-join-qr",
    "allow-sync-decode-join-qr",
    "allow-sync-person-status",
    # The explicit registration act (decisions/protocol/0719). It was DEFINED
    # below and absent from this bundle, so `sync:default` refused it and the
    # identity home's register button failed on every press (myne-md/myne#911
    # review).
    #
    # `allow-sync-publish-vault` is DELETED for the reason stated two paragraphs
    # down rather than re-listed: publishing moved into the sync cycle
    # (myne-md/myne#974), so the command lost its last caller and a grant for a
    # dead command is a permission nobody can audit.
    #
    # `allow-sync-person-create-identity` is deliberately NOT here: that command
    # had no caller on any client (the first run creates through `person_setup`,
    # which is what web dispatches too), so the command is deleted rather than
    # granted. A grant for a dead command is a permission nobody can audit.
    "allow-sync-person-register",
    "allow-sync-person-account-number",
    "allow-sync-person-list-invites",
    # The recipient's refusal of an invitation (myne-md/myne#911 follow-up). A
    # write against the relay, not against the vault: it releases no key and
    # touches no vault content, so it sits beside the list it acts on.
    "allow-sync-person-decline-invite",
    "allow-sync-person-lock",
    "allow-sync-start-b2b-migration",
    "allow-sync-remove-member",
    "allow-sync-list-devices",
    "allow-sync-account-status",
    "allow-sync-approve-device",
    # The two-sided admission ceremony (myne-md/myne#938 task 11). All five are granted
    # because the ceremony is ONE surface: a device can be either side, and a client that
    # had only three of the five would show a button that fails. Each gate is stated on its
    # own permission below, so the grant is not where the guarantee lives.
    "allow-sync-device-admission-start",
    "allow-sync-device-admission-confirm",
    "allow-sync-device-admission-preview",
    "allow-sync-device-admission-accept",
    "allow-sync-device-admission-cancel",
    "allow-sync-remove-device",
    "allow-sync-pending-conflicts",
    "allow-sync-awareness-stats",
    "allow-sync-take-conflict",
    "allow-sync-resolve-conflict",
    "allow-sync-mark-tombstone",
    "allow-sync-enroll",
    "allow-sync-join-account",
    "allow-sync-reset-local",
    "allow-sync-head-fingerprint",
    "allow-sync-verify-hold-begin",
    "allow-sync-verify-hold-end",
    "allow-sync-list-quarantine",
    "allow-sync-read-quarantine",
    "allow-sync-restore-quarantine",
    "allow-sync-delete-quarantine",
    "allow-sync-device-join-qr",
    "allow-sync-member-join-qr",
    "allow-sync-beta-terms-accepted",
    "allow-sync-accept-beta-terms",
    "allow-sync-get-tor-routing",
    "allow-sync-set-tor-routing",
    "allow-sync-get-tor-state",
]

# Detached (pop-out) note-window seat (myne#677, epic #173; capabilities/detached-note.json,
# windows: ["note-*"]). READ-ONLY status only, for the per-note unsynced-edit marker + first-sync
# progress readout the editor pane already shows. No mutation, no device management, no
# endpoint/tor setter, no enrol/join/conflict.
[[set]]
identifier = "detached-status"
description = "Detached note-window sync seat: read-only status + unsynced-edit marker + materialisation progress. No mutation, no device/endpoint/tor management. Granted exclusively by capabilities/detached-note.json (windows: [\"note-*\"])."
permissions = [
    "allow-sync-status",
    "allow-sync-unsynced-edits",
    "allow-sync-materialisation-progress",
]

[[permission]]
identifier = "allow-sync-get-endpoint"
description = "Allow invoking sync:sync_get_endpoint (read the device-local sync endpoint config from app_config_dir/sync-config.json; absent → unconfigured). No vault access, no native side-effect."
commands.allow = ["sync_get_endpoint"]

[[permission]]
identifier = "allow-sync-set-endpoint"
description = "Allow invoking sync:sync_set_endpoint (validate against the A4/TB5 https-or-loopback policy, then atomic-write the device-local sync endpoint config). No vault access."
commands.allow = ["sync_set_endpoint"]

[[permission]]
identifier = "allow-sync-status"
description = "Allow invoking sync:sync_status (read-only current sync status for the status indicator: disabled / idle / syncing / error / conflicts). No vault access."
commands.allow = ["sync_status"]

[[permission]]
identifier = "allow-sync-unsynced-edits"
description = "Allow invoking sync:sync_unsynced_edits (read-only list of note ids whose local bytes the server has not acknowledged, for the unsynced-edit marker). Derived from each note's MY01 header nonce and the sync-state.json baselines — no decrypt, no key material, no network."
commands.allow = ["sync_unsynced_edits"]

[[permission]]
identifier = "allow-sync-materialisation-progress"
description = "Allow invoking sync:sync_materialisation_progress (read-only {done, total, generation} counts for the first-sync progress readout). Three atomic loads; no vault access, no IO, no network, no identifiers."
commands.allow = ["sync_materialisation_progress"]

[[permission]]
identifier = "allow-sync-now"
description = "Allow invoking sync:sync_now (request an immediate sync; returns the resulting status). No new vault access beyond the engine's authed session."
commands.allow = ["sync_now"]

[[permission]]
identifier = "allow-sync-published-state"
description = "Allow invoking sync:sync_published_state (read-only durable publish state for the active vault: published or device only, the recorded namespace, and whether the vault was born under an identity). Reads device-local state plus the vault.meta generation byte: no key material, no network."
commands.allow = ["sync_published_state"]

[[permission]]
identifier = "allow-sync-person-join-device"
description = "Allow invoking sync:sync_person_join_device (myne-md/myne#911 task 9 - admit THIS device to a person's account from a scanned person QR and the 24-word phrase). The phrase crosses IPC once, exactly as the identity-unlock path does; the device lands pending until an existing device approves it. Never grants vault content: admission is an account binding, and each vault still asks for its own password."
commands.allow = ["sync_person_join_device"]

[[permission]]
identifier = "allow-sync-person-claim-device"
description = "Allow invoking sync:sync_person_claim_device (myne-md/myne#911 task 9 - finish a pending device's enrolment once an existing device approved it, using the session's cached derived SCRAM secret; no phrase re-entry, no new credential on disk beyond the device token the server issues)."
commands.allow = ["sync_person_claim_device"]

[[permission]]
identifier = "allow-sync-person-list-vaults"
description = "Allow invoking sync:sync_person_list_vaults (myne-md/myne#911 task 9 - list every vault the person account is bound to and write a local container for each one this device does not hold yet). Writes frames only: the vault.meta the server already holds plus the device-local namespace record. No key material, no password, no vault content, and no decryption; opening a listed vault still asks for that vault's own password."
commands.allow = ["sync_person_list_vaults"]

[[permission]]
identifier = "allow-sync-person-join-qr"
description = "Allow invoking sync:sync_person_join_qr (myne-md/myne#911 task 9 - render the code that admits another device to this PERSON's account). Takes no argument: the person id comes from the identity this device holds and the endpoint from its own sync config. The payload carries only the person id, which is public material; no secret, no vault content, and it cannot describe an account this device is not in."
commands.allow = ["sync_person_join_qr"]

[[permission]]
identifier = "allow-resolve-identity"
description = "Allow invoking sync:resolve_identity (map an Automerge actor to a {Device, Person, Unknown} identity for the version-history panel; reads vault.prefs device_names, no id hash crosses to the frontend)."
commands.allow = ["resolve_identity"]

[[permission]]
identifier = "allow-sync-person-unlock"
description = "Allow invoking sync:sync_person_unlock (B2B: derive-or-open the person keypair from the user's recovery phrase and hold it backend-side in VaultRuntimeState. The phrase crosses IPC once, at this unlock-equivalent moment; no private seed ever crosses again)."
commands.allow = ["sync_person_unlock"]

[[permission]]
identifier = "allow-sync-person-setup"
description = "Allow invoking sync:sync_person_setup (B2B identity-only setup: generates a recovery phrase when none is supplied, derives and seals the person keypair, derives the person SCRAM secret, reads the device-scoped endpoint, and registers the person account at that endpoint under person_id_hash. The phrase is returned ONCE when generated and never logged; the token is stored device-scoped). No vault access."
commands.allow = ["sync_person_setup"]

[[permission]]
identifier = "allow-sync-person-register"
description = "Allow invoking sync:sync_person_register (myne-md/myne#911: the explicit registration act. Opens the sealed identity under the supplied phrase, derives the person SCRAM secret, reads the device-scoped endpoint and registers the account there under person_id_hash, storing the device token when the device is approved. A failure leaves the identity reserved and unchanged: a device with no endpoint stays fully usable)."
commands.allow = ["sync_person_register"]

[[permission]]
identifier = "allow-sync-person-account-number"
description = "Allow invoking sync:sync_person_account_number (read-only: the person account number in canonical form, derived from the person id this device already holds. No phrase, no network, no key material)."
commands.allow = ["sync_person_account_number"]

[[permission]]
identifier = "allow-sync-person-status"
description = "Allow invoking sync:sync_person_status (read-only: whether this device holds a person account, and its person_id. Device-local read; no network, no vault access)."
commands.allow = ["sync_person_status"]

[[permission]]
identifier = "allow-sync-person-list-invites"
description = "Allow invoking sync:sync_person_list_invites (read-only: list the invites addressed to this person account from the sealed relay. Uses the device-scoped person token + endpoint; returns invite ids and vault ids, never a payload)."
commands.allow = ["sync_person_list_invites"]

[[permission]]
identifier = "allow-sync-person-lock"
description = "Allow invoking sync:sync_person_lock (B2B: drop the backend-held person identity; it zeroizes on drop)."
commands.allow = ["sync_person_lock"]

[[permission]]
identifier = "allow-sync-start-b2b-migration"
description = "Allow invoking sync:sync_start_b2b_migration (B2B: the one explicit owner-approved NTV5 to NTV6 migration. Runs the journaled rewrite of vault.meta + the shared singletons under a fresh group key. Requires an unlocked active vault held as owner PLUS a held person identity; holds the auth permit across the migration. An ordinary unlock never runs it)."
commands.allow = ["sync_start_b2b_migration"]


[[permission]]
identifier = "allow-sync-person-create-invite"
description = "Allow invoking sync:sync_person_create_invite (B2B invite by person identity code: decode the invitee's public halves from the pasted out-of-band code, seal the invite locally, bind the owner person to the vault once, and POST the sealed frame to the relay with the owner's per-vault token). Requires an unlocked active vault held as owner PLUS a held person identity; the recipient code carries public material only."
commands.allow = ["sync_person_create_invite"]

[[permission]]
identifier = "allow-sync-list-vault-invites"
description = "Allow invoking sync:sync_list_vault_invites (B2B owner-side: list the invitations this owner has sent for the active vault, with the recipient person id and the claimed flag. Authorized by the owner's per-vault token; no payload)."
commands.allow = ["sync_list_vault_invites"]

[[permission]]
identifier = "allow-sync-person-decline-invite"
description = "Allow invoking sync:sync_person_decline_invite (B2B: refuse an invitation addressed to this identity). The server drops the sealed payload, so the invitation can never be claimed, and the sender's own list reports it declined. Sends the device-scoped person token and the invite id and nothing else; no vault content, no key material, no vault access."
commands.allow = ["sync_person_decline_invite"]

[[permission]]
identifier = "allow-sync-person-accept-invite"
description = "Allow invoking sync:sync_person_accept_invite (B2B: claim a sealed invite from the relay with the person token, verify the owner-signed group package against the owner's public half from the out-of-band owner identity code, unwrap the group key, derive the itemsKey, materialize a local member vault and install a member slot with no root key). The keys stay backend-side."
commands.allow = ["sync_person_accept_invite"]

[[permission]]
identifier = "allow-sync-member-join-vault"
description = "Allow invoking sync:sync_member_join_vault (B2B, member-devices task 7: join a shared vault as a member's SECOND device from the recovery phrase alone, with no owner action and no fresh invite). Reads the pinned owner identity code from the joining person's own sealed MYY5 profile, re-claims the invite (idempotent for its own recipient) for a fresh per-vault membership token, verifies the retained group package against the pinned owner half, and materializes + installs the member slot. No owner code is collected from the user and none is taken from the package; the phrase and the device-local password cross IPC once, and no key material does."
commands.allow = ["sync_member_join_vault"]

[[permission]]
identifier = "allow-sync-person-set-member-password"
description = "Allow invoking sync:sync_person_set_member_password (B2B: while an unlocked member vault holds the person session, seal its group + items keys and person keypair into the device-local vault.member-unlock store under a member-chosen password, so the member vault re-unlocks without the recovery phrase). Password crosses IPC once; no key material does."
commands.allow = ["sync_person_set_member_password"]

[[permission]]
identifier = "allow-sync-person-unlock-member-vault-with-password"
description = "Allow invoking sync:sync_person_unlock_member_vault_with_password (B2B: re-unlock a member vault from its device-local password by opening vault.member-unlock and installing the member slot plus the person session)."
commands.allow = ["sync_person_unlock_member_vault_with_password"]

[[permission]]
identifier = "allow-sync-person-set-member-pin"
description = "Allow invoking sync:sync_person_set_member_pin (B2B: seal the same member vault credential under a PIN via the quick-unlock PIN provider). PIN crosses IPC once; no key material does."
commands.allow = ["sync_person_set_member_pin"]

[[permission]]
identifier = "allow-sync-person-set-member-biometric"
description = "Allow invoking sync:sync_person_set_member_biometric (B2B: seal the member vault credential under an Apple-Keychain biometric credential; HardwareUnavailable off Apple targets)."
commands.allow = ["sync_person_set_member_biometric"]

[[permission]]
identifier = "allow-sync-person-unlock-member-vault-with-pin"
description = "Allow invoking sync:sync_person_unlock_member_vault_with_pin (B2B: re-unlock a member vault from its device-local PIN; a wrong PIN burns an attempt and the fifth wipes the credential)."
commands.allow = ["sync_person_unlock_member_vault_with_pin"]

[[permission]]
identifier = "allow-sync-person-unlock-member-vault-with-biometric"
description = "Allow invoking sync:sync_person_unlock_member_vault_with_biometric (B2B: re-unlock a member vault from its device-local biometric credential; HardwareUnavailable off Apple targets)."
commands.allow = ["sync_person_unlock_member_vault_with_biometric"]

[[permission]]
identifier = "allow-sync-member-unlock-status"
description = "Allow invoking sync:sync_member_unlock_status (read-only: the member vault's configured fast-unlock method, password / pin / biometric / null, so the Unlock surface offers the right credential)."
commands.allow = ["sync_member_unlock_status"]

[[permission]]
identifier = "allow-sync-person-clear-member-unlock"
description = "Allow invoking sync:sync_person_clear_member_unlock (B2B: remove the device-local member fast-unlock credential for the active vault)."
commands.allow = ["sync_person_clear_member_unlock"]

[[permission]]
identifier = "allow-sync-list-roster"
description = "Allow invoking sync:sync_list_roster (B2B: unseal the membership roster extension of the unlocked vault and return the non-tombstoned member rows)."
commands.allow = ["sync_list_roster"]

[[permission]]
identifier = "allow-sync-remove-member"
description = "Allow invoking sync:sync_remove_member (B2B: rotate the vault itemsKey, re-wrap every note and attachment per-entry key, tombstone the removed member, re-wrap to remaining members, re-seal vault.meta). Requires an unlocked active vault with a roster."
commands.allow = ["sync_remove_member"]

[[permission]]
identifier = "allow-sync-list-devices"
description = "Allow invoking sync:sync_list_devices (authed device roster from GET /auth/devices). No vault-blob access."
commands.allow = ["sync_list_devices"]

[[permission]]
identifier = "allow-sync-account-status"
description = "Allow invoking sync:sync_account_status (authed read-only projection from GET /account/status — this account's own stored bytes, device count, frozen flag and EFFECTIVE ceilings. Account is resolved from the device token, never a URL/query selector; no vault-blob access, no cross-account data)."
commands.allow = ["sync_account_status"]

[[permission]]
identifier = "allow-sync-approve-device"
description = "Allow invoking sync:sync_approve_device (authed: approve a pending device, POST /auth/devices/approve). Requires an unlocked active vault."
commands.allow = ["sync_approve_device"]

[[permission]]
identifier = "allow-sync-device-admission-start"
description = "Allow invoking sync:sync_device_admission_start (JOINING side, step 1 of 2: mint a device-admission code + its SAS for the other device to read). Writes NO CREDENTIAL and sends NOTHING: the secret waits in RAM for the user's own confirm, which is the two-sided rule (decisions/protocol/0735). It may create this device's own signing key at rest on first use, which every sync action does. No vault access, no network."
commands.allow = ["sync_device_admission_start"]

[[permission]]
identifier = "allow-sync-device-admission-confirm"
description = "Allow invoking sync:sync_device_admission_confirm (JOINING side, step 2 of 2: persist this device's own SCRAM secret, but only for the SAS the user confirmed, then attempt its device login). Writes person-auth; reaches the server only to try that login. No vault content, no key material."
commands.allow = ["sync_device_admission_confirm"]

[[permission]]
identifier = "allow-sync-device-admission-preview"
description = "Allow invoking sync:sync_device_admission_preview (ADMITTING side, step 1 of 2: decode a code another device showed and derive its SAS for the human to compare). Read-only by construction: it takes no IO handle, so it cannot write or send anything."
commands.allow = ["sync_device_admission_preview"]

[[permission]]
identifier = "allow-sync-device-admission-accept"
description = "Allow invoking sync:sync_device_admission_accept (ADMITTING side, step 2 of 2: install the joining device's credential, POST /auth/devices/credential, then write its MYU5 binding row). Refused for any SAS other than the one derived from the code in hand. Requires an unlocked active vault and a person session."
commands.allow = ["sync_device_admission_accept"]

[[permission]]
identifier = "allow-sync-device-admission-cancel"
description = "Allow invoking sync:sync_device_admission_cancel (either side: forget the minted admission). Nothing was written before this, so it only drops the RAM copy."
commands.allow = ["sync_device_admission_cancel"]

[[permission]]
identifier = "allow-sync-remove-device"
description = "Allow invoking sync:sync_remove_device (authed: revoke a device's token, POST /auth/devices/revoke; device_id untouched, SYNC-2). Requires an unlocked active vault."
commands.allow = ["sync_remove_device"]

[[permission]]
identifier = "allow-sync-pending-conflicts"
description = "Allow invoking sync:sync_pending_conflicts (list the note ids with a staged conflicting remote revision awaiting keep-both materialization). No vault-blob access beyond the device-local conflicts staging dir."
commands.allow = ["sync_pending_conflicts"]

[[permission]]
identifier = "allow-sync-awareness-stats"
description = "Allow invoking sync:sync_awareness_stats (read-only awareness transport counters for the leak budget, `collab-verification` task 3: coalesced batches emitted, frames carried, the last batch's encoded length, the reconnect generation, the subscribed-room count, and the window they span). Counts and lengths only: never a frame byte, a room id or a note id. No vault access. Desktop-only (the web client runs no awareness supervisor)."
commands.allow = ["sync_awareness_stats"]

[[permission]]
identifier = "allow-sync-take-conflict"
description = "Allow invoking sync:sync_take_conflict (decrypt a staged conflicting remote revision to its plaintext body so the notes layer can materialize a keep-both copy; requires the unlocked vault's items_key)."
commands.allow = ["sync_take_conflict"]

[[permission]]
identifier = "allow-sync-resolve-conflict"
description = "Allow invoking sync:sync_resolve_conflict (adopt the staged remote revision as the synced baseline + clear staging, so the local edit pushes as a linear advance)."
commands.allow = ["sync_resolve_conflict"]

[[permission]]
identifier = "allow-sync-mark-tombstone"
description = "Allow invoking sync:sync_mark_tombstone (queue a deletion's note id so the next push sets the server tombstone flag for horizon-GC). Touches only the device-local pending-tombstone queue; no vault-blob access."
commands.allow = ["sync_mark_tombstone"]

[[permission]]
identifier = "allow-sync-enroll"
description = "Allow invoking sync:sync_enroll (new-device enrollment: fetch vault.meta pre-auth, derive root_key from {account#+password/phrase}, SCRAM-enroll, store the per-device token)."
commands.allow = ["sync_enroll"]

[[permission]]
identifier = "allow-sync-join-account"
description = "Allow invoking sync:sync_join_account (add this device to an existing account: verify the endpoint certificate and, fetch vault.meta pre-auth, bootstrap a NEW local vault from {account#+password}, unlock it, SCRAM-enroll password-path → pending). Materializes a vault dir; gated on the same A4/TB5 transport policy."
commands.allow = ["sync_join_account"]

[[permission]]
identifier = "allow-sync-reset-local"
description = "Allow invoking sync:sync_reset_local (reset this device's sync enrollment locally: clear the device-local per-device token + sync baseline (sync-state.json + vault.head-state) for the active vault so a stale/rejected token can be re-enrolled). NEVER touches notes/attachments/vault.meta and makes no server call."
commands.allow = ["sync_reset_local"]

[[permission]]
identifier = "allow-sync-head-fingerprint"
description = "Allow invoking sync:sync_head_fingerprint (return the 8-char Crockford XXXX-XXXX SAS fingerprint of this device's currently adopted vault head, read from the device-local sync-state's latest head observation; None when no head is adopted yet). The out-of-band enroll-time eye-compare substrate (SYNC-17); returns no key material and makes no server call — reveals only the already-server-visible head_id, one-way-hashed to ~40 bits."
commands.allow = ["sync_head_fingerprint"]

[[permission]]
identifier = "allow-sync-list-quarantine"
description = "Allow invoking sync:sync_list_quarantine (list the quarantined note blobs the reconcile drop-leg moved to the device-local quarantine/ dir — file name, suffix-stripped note id, size, device-local mtime). Decrypt-free; no vault-blob access beyond the quarantine dir listing."
commands.allow = ["sync_list_quarantine"]

[[permission]]
identifier = "allow-sync-read-quarantine"
description = "Allow invoking sync:sync_read_quarantine (decrypt ONE quarantined note blob to its plaintext body for the Recovered-notes preview; file name validated against the strict <uuid>[-<n>].myn shape — path traversal rejected). Requires the unlocked vault's items_key."
commands.allow = ["sync_read_quarantine"]

[[permission]]
identifier = "allow-sync-restore-quarantine"
description = "Allow invoking sync:sync_restore_quarantine (restore a quarantined note blob as a NEW note — fresh UUIDv7 via the shared note-create pipeline; the reclaimed original id is never re-pushed — then remove the quarantine source on success). Requires the unlocked vault's items_key."
commands.allow = ["sync_restore_quarantine"]

[[permission]]
identifier = "allow-sync-delete-quarantine"
description = "Allow invoking sync:sync_delete_quarantine (permanently remove ONE quarantined note blob; strict file-name validation; requires an unlocked active vault (Slot::Unlocked, enforced in the shared core), and the UI confirms first — the single path that destroys quarantine evidence). No decrypt, no vault-blob access beyond the quarantine dir."
commands.allow = ["sync_delete_quarantine"]

[[permission]]
identifier = "allow-sync-decode-join-qr"
description = "Allow invoking sync:sync_decode_join_qr (myne-md/myne#911 task 9 - decode a pasted join code into the confirm-screen view). Pure over the scanned string plus the clock: it validates a versioned, self-describing payload (magic, kind, endpoint URL, target id) and checks its freshness window. No vault access, no IO, no network, no secret (the payload carries public ids only, which is what makes a QR readable). Granted to the desktop because a device with no camera pastes the code a phone is showing, which is the only way the identity-model join reaches a laptop."
commands.allow = ["sync_decode_join_qr"]

[[permission]]
identifier = "allow-sync-device-join-qr"
description = "Allow invoking sync:sync_device_join_qr (MYND-466 — render a device-join QR for the user-pasted account number + this device's own endpoint/cert-pin. Read-only affordance: reads the endpoint config, moves no vault bytes, carries no secret in the QR — SYNC-47. The account# is a paste argument, never read from storage)."
commands.allow = ["sync_device_join_qr"]

[[permission]]
identifier = "allow-sync-member-join-qr"
description = "Allow invoking sync:sync_member_join_qr (myne-md/myne — render a device-join QR for ANOTHER DEVICE OF THE SAME PERSON in the shared vault this device is a member of. Reads the endpoint config and the ACTIVE member vault's own account hash from device-local sync state; the vault id is resolved backend-side and never arrives as an argument. Refuses on any non-member session, so it cannot describe an owner's vault. Read-only, moves no vault bytes, and carries no secret (the scanner is still asked for the 24-word phrase) — SYNC-47.)"
commands.allow = ["sync_member_join_qr"]

[[permission]]
identifier = "allow-sync-beta-terms-accepted"
description = "Allow invoking sync:sync_beta_terms_accepted (operations#15 — ask whether the beta-terms version this build ships has been accepted on this device, reading app_config_dir/legal-consent.json; absent or unreadable → false). One boolean out, one version string in. No vault access, no network, no side-effect; reachable pre-unlock because two of the three doors that turn sync on run before any vault is open."
commands.allow = ["sync_beta_terms_accepted"]

[[permission]]
identifier = "allow-sync-accept-beta-terms"
description = "Allow invoking sync:sync_accept_beta_terms (operations#15 — record in app_config_dir/legal-consent.json that the given beta-terms version was accepted on this device). Writes one device-local JSON file, read-modify-write so a later field is not cleared; deliberately NOT a vault.prefs field, because enrolment seeds a new device's prefs wholesale and an acceptance that arrives by sync is not an acceptance. No vault access, no network."
commands.allow = ["sync_accept_beta_terms"]

[[permission]]
identifier = "allow-sync-get-tor-routing"
description = "Allow invoking sync:sync_get_tor_routing (MYND-650 — read the device-local tor_routing_enabled preference from app_config_dir/tor-routing.json; absent → off). One boolean; no vault access, no process started, reachable pre-unlock like the endpoint pair."
commands.allow = ["sync_get_tor_routing"]

[[permission]]
identifier = "allow-sync-set-tor-routing"
description = "Allow invoking sync:sync_set_tor_routing (MYND-650 — persist the device-local tor_routing_enabled preference, then move the sync routing gate and the arti sidecar to match: enabling closes the gate BEFORE spawning, disabling terminates the sidecar BEFORE reopening it). Starts/stops the bundled myne-tor externalBin, which is a Tor client with no access to vault bytes; no new network surface is granted to the webview, which can only ask for the two states this toggle already has. No vault access."
commands.allow = ["sync_set_tor_routing"]

[[permission]]
identifier = "allow-sync-get-tor-state"
description = "Allow invoking sync:sync_get_tor_state (MYND-650 — read the live routing posture: Tor mode as the sync routing gate has it, the bundled Tor client's phase (starting / ready / failed / stopped), and whether the configured endpoint is routed at all). With Tor mode off it reads an in-memory cell and touches no file. With Tor mode on it also reads the device-local endpoint config (app_config_dir/sync-config.json) to answer the third field — read-only, creating no directory, and only so the UI cannot claim a tunnel over a loopback endpoint that never enters one. Starts nothing; the loopback SOCKS port is the only payload and it names a listener on this device. This is what lets the UI say 'sync is paused' instead of implying protection while the tunnel is down. No vault access."
commands.allow = ["sync_get_tor_state"]

[[permission]]
identifier = "allow-sync-verify-hold-begin"
description = "Allow invoking sync:sync_verify_hold_begin (myne#462 — declare that a SYNC-40 device-verification eye-compare is open on this device, so the sync engine holds CONTENT pushes and the vault head both screens are comparing cannot advance under them). Idempotent, and it doubles as the lease ping: silence releases the hold after 15s and a hard ceiling of 5 minutes bounds it regardless, so a crashed WebView cannot leave this device silently unsynced. Flips an in-RAM flag only — no vault access, no IO, no server call, and pulls are never held. It cannot suppress an edit, only delay it: the coalescing anchor is retained, so the push flushes when the compare closes."
commands.allow = ["sync_verify_hold_begin"]

[[permission]]
identifier = "allow-sync-verify-hold-end"
description = "Allow invoking sync:sync_verify_hold_end (myne#462 — release the push hold engaged by sync_verify_hold_begin, on match, on mismatch or on unmount). Idempotent; in-RAM flag only, no vault access, no IO, no server call. Releasing early only restores the ordinary push cadence."
commands.allow = ["sync_verify_hold_end"]
