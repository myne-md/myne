# Permissions for the in-app `export` Tauri plugin (MYND-211, epic
# export-suite). Picked up under the `export:` ACL namespace only because
# `build.rs` declares this as an `InlinedPlugin`. Capability files reference
# these as `export:default` (or `export:allow-<cmd>`).
#
# `vault_export_markdown` is the ONLY path that writes the plaintext
# markdown tree: the WebView picks the destination via `dialog:allow-open`
# and the Rust core does all the IO — no `fs:` write scope is granted for
# export trees (least-privilege, TB6; the backup/importer narrow-seam
# precedent). Adding a command here without a matching `build.rs`
# `InlinedPlugin::commands` entry is a security regression.

"$schema" = "../../gen/schemas/desktop-schema.json"

[default]
description = "Default permission set for the vault markdown-export plugin."
permissions = [
    "allow-vault-export-markdown",
    "allow-vault-export-cancel",
]

[[permission]]
identifier = "allow-vault-export-markdown"
description = "Allow invoking export:vault_export_markdown (decrypt the unlocked vault — or one folder subtree — into a plaintext Obsidian-shape markdown tree at a user-chosen destination; deliberate TB3 egress, staged then atomically published, nothing appears at the destination unless complete)."
commands.allow = ["vault_export_markdown"]

[[permission]]
identifier = "allow-vault-export-cancel"
description = "Allow invoking export:vault_export_cancel (cooperatively cancel the in-flight markdown export; the staging tree is discarded — nothing appears at the destination)."
commands.allow = ["vault_export_cancel"]
