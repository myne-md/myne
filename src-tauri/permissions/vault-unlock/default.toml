# Permissions for the in-app `vault-unlock` Tauri plugin.
# Picked up under the `vault-unlock:` ACL namespace only because
# `build.rs` declares this as an `InlinedPlugin`. Capability files
# reference these as `vault-unlock:default` (or `vault-unlock:allow-<cmd>`).
#
# Task 2 of `vault-unlock-password` introduces `allow-unlock`. Task 6
# of that feature adds `allow-lock` (the A8e bundle). Task 1 of
# `app-state-machine` adds `allow-vault-status` (read-only `vault.meta`
# disk probe — Exists | Missing | Corrupted) and `allow-vault-is-unlocked`
# (read-only boolean peek of the unlocked-vault slot). Task 8 of
# `vault-recovery-from-phrase` adds `allow-vault-slot-kind` (read-only
# three-state SlotKind probe — Empty | Recovering | Unlocked, used by
# frontend boot-time + post-WebView-reload routing in the recovery flow).

"$schema" = "../../gen/schemas/desktop-schema.json"

[default]
description = "Default permission set for the vault-unlock plugin."
permissions = [
    "allow-unlock",
    "allow-lock",
    "allow-vault-status",
    "allow-vault-is-unlocked",
    "allow-vault-slot-kind",
    "allow-report-user-activity",
]

[[permission]]
identifier = "allow-unlock"
description = "Allow invoking vault_unlock:unlock (open an existing vault with master password)."
commands.allow = ["unlock"]

[[permission]]
identifier = "allow-lock"
description = "Allow invoking vault_unlock:lock (close the open vault — drops whichever Slot variant is held; idempotent on Empty)."
commands.allow = ["lock"]

[[permission]]
identifier = "allow-vault-status"
description = "Allow invoking vault_unlock:vault_status (read-only probe of vault.meta — Exists | Missing | Corrupted)."
commands.allow = ["vault_status"]

[[permission]]
identifier = "allow-vault-is-unlocked"
description = "Allow invoking vault_unlock:vault_is_unlocked (read-only peek of the unlocked-vault slot)."
commands.allow = ["vault_is_unlocked"]

[[permission]]
identifier = "allow-vault-slot-kind"
description = "Allow invoking vault_unlock:vault_slot_kind (read-only: returns the current SlotKind variant — Empty | Recovering | Unlocked. Used by frontend boot-time + post-WebView-reload routing for the recovery flow)."
commands.allow = ["vault_slot_kind"]

[[permission]]
identifier = "allow-report-user-activity"
description = "Allow invoking vault_unlock:report_user_activity (lock-free activity heartbeat for the auto-lock-on-idle timer — MYND-121; no secret material, no slot-lock acquisition)."
commands.allow = ["report_user_activity"]
