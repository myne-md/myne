# Permissions for the in-app `vault-unlock` Tauri plugin.
# Picked up under the `vault-unlock:` ACL namespace only because
# `build.rs` declares this as an `InlinedPlugin`. Capability files
# reference these as `vault-unlock:default` (or `vault-unlock:allow-<cmd>`).
#
# Task 2 of `vault-unlock-password` introduces `allow-unlock`. Task 6
# of that feature adds `allow-lock` (the A8e bundle). Task 1 of
# `app-state-machine` adds `allow-vault-status` (read-only `vault.meta`
# disk probe — Exists | Missing | Corrupted) and `allow-vault-is-unlocked`
# (read-only boolean peek of the unlocked-vault slot). Task 8 of
# `vault-recovery-from-phrase` adds `allow-vault-slot-kind` (read-only
# three-state SlotKind probe — Empty | Recovering | Unlocked, used by
# frontend boot-time + post-WebView-reload routing in the recovery flow).
# Task 3 of `vault-registry-and-disk-layout` (multi-vault, MYND-202) adds
# `allow-vault-list` (read-only multi-vault enumeration: one VaultSummary per
# discovered `vaults/<id>/`, the SYNC-4 generalization of `vault_status`).
# Task 30 of `phase3-web-client` adds `allow-account-number-check`: a pure,
# network-free predicate over a user-typed account number (no IO, no state, no
# vault access, and a single non-distinguishing boolean out — `account-number.md`
# §5). It is listed here rather than left out because the ACL is fail-closed:
# an unlisted command is refused, and the web-side screen shares the `src/` tree
# with desktop.

"$schema" = "../../gen/schemas/desktop-schema.json"

[default]
description = "Default permission set for the vault-unlock plugin."
permissions = [
    "allow-unlock",
    "allow-unlock-with-person-phrase",
    "allow-lock",
    "allow-vault-status",
    "allow-vault-storage-health",
    "allow-vault-list",
    "allow-vault-is-unlocked",
    "allow-vault-is-person-wrapped",
    "allow-vault-slot-kind",
    "allow-vault-active-id",
    "allow-report-user-activity",
    "allow-account-number-check",
]

[[permission]]
identifier = "allow-unlock"
description = "Allow invoking vault_unlock:unlock (open an existing vault with master password)."
commands.allow = ["unlock"]

[[permission]]
identifier = "allow-unlock-with-person-phrase"
description = "Allow invoking vault_unlock:unlock_with_person_phrase: open an NTV7 vault with the owner's identity phrase (myne-md/myne#911 task 10). The second credential the person-wrapped generation ships: the saved vault phrase was retired by the explicit upgrade, and this is what replaces it. The core normalizes the phrase (one normalization, three clients), derives the person from it, and opens the person wrap; the AAD binds the owner fingerprint and the vault's items_key_id, so another person's phrase is an AEAD failure rather than a code path. A vault of any other generation refuses with the same non-distinguishing InvalidCredentialOrVault a wrong password gets."
commands.allow = ["unlock_with_person_phrase"]

[[permission]]
identifier = "allow-lock"
description = "Allow invoking vault_unlock:lock (close the open vault — drops whichever Slot variant is held; idempotent on Empty)."
commands.allow = ["lock"]

[[permission]]
identifier = "allow-vault-status"
description = "Allow invoking vault_unlock:vault_status (read-only probe of vault.meta — Exists | Missing | Corrupted)."
commands.allow = ["vault_status"]

[[permission]]
identifier = "allow-vault-storage-health"
description = "Allow invoking vault_unlock:vault_storage_health (read-only mid-session probe: Healthy | NotUnlocked | Evicted | Unopenable | Unknown). A slot peek plus a vault.meta read; no key material, no write, no network. Distinct from vault_status, which is the boot probe — this one exists to tell an eviction from a corruption, which the boot vocabulary cannot express."
commands.allow = ["vault_storage_health"]

[[permission]]
identifier = "allow-vault-list"
description = "Allow invoking vault_unlock:vault_list (read-only multi-vault enumeration: one VaultSummary { id, status: Exists|Corrupted, label, last_unlock } per discovered vaults/<id>/ directory; no account_number_hash bytes or filesystem paths cross IPC)."
commands.allow = ["vault_list"]

[[permission]]
identifier = "allow-vault-is-unlocked"
description = "Allow invoking vault_unlock:vault_is_unlocked (read-only peek of the unlocked-vault slot)."
commands.allow = ["vault_is_unlocked"]

[[permission]]
identifier = "allow-vault-slot-kind"
description = "Allow invoking vault_unlock:vault_slot_kind (read-only: returns the current SlotKind variant — Empty | Recovering | Unlocked. Used by frontend boot-time + post-WebView-reload routing for the recovery flow)."
commands.allow = ["vault_slot_kind"]

[[permission]]
identifier = "allow-vault-active-id"
description = "Allow invoking vault_unlock:vault_active_id (read-only: the id of the vault currently Unlocked, or null. Reads the runtime slot map — the authority — rather than the best-effort registry.json last-unlock cache; no key material, no write, no network)."
commands.allow = ["vault_active_id"]

[[permission]]
identifier = "allow-report-user-activity"
description = "Allow invoking vault_unlock:report_user_activity (lock-free activity heartbeat for the auto-lock-on-idle timer — MYND-121; no secret material, no slot-lock acquisition)."
commands.allow = ["report_user_activity"]

[[permission]]
identifier = "allow-vault-is-person-wrapped"
description = "Allow invoking vault_unlock:vault_is_person_wrapped: a read-only one-bit probe answering whether the active vault carries the NTV7 person wrap, i.e. whether the owner's identity phrase is a credential for it (myne-md/myne#911 task 10). The unlock screen uses it to decide whether its recovery escape hatch says \"unlock with your vault recovery phrase\" or \"unlock with your identity phrase\", because the explicit upgrade retires the first. Not a secret: it reads the first four magic bytes of vault.meta, which any reader of the directory already has. No permit, no Argon2id, no slot peek, no key material."
commands.allow = ["vault_is_person_wrapped"]
