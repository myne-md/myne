# Permissions for the in-app `attachments` Tauri plugin (MYND-169).
# Picked up under the `attachments:` ACL namespace only because
# `build.rs` declares this as an `InlinedPlugin`. Capability files
# reference these as `attachments:default` (or
# `attachments:allow-attachment-import` /
# `attachments:allow-catalog-list` /
# `attachments:allow-attachment-delete`).
#
# Multi-window (myne#677, epic #173, sync-ledger SYNC-12): the `default` bundle stays
# MAIN-WINDOW-ONLY. The library-management + ref-graph commands (delete, rename, export,
# clean-unused, unused-list, refs-apply/remove/referencing, voice capture) write vault state or
# drive the whole-vault reference graph, so they are NOT granted to a non-main window. What a
# detached (pop-out) note EDITOR needs to render and paste into its own note IS granted, via the
# `detached` set below: import (paste an image) + the read commands (catalog list + inline
# text/structured/extracted-text previews). This is the deliberate resolution of the former
# blanket "MUST NOT grant any of these to a non-main window" reservation: a detached `note-*`
# window runs the same bundled code and holds the same plaintext a split pane already does, so
# rendering/pasting attachments there is the same exposure a split pane already has. The
# `attachment://` URI scheme is NOT a command: it is registered on the Builder in `lib.rs` and
# gated inside its own handler (unlock + a label allowlist); myne#677 task 2 widens that allowlist
# to the `note-` prefix so embeds render in the pop-out.

"$schema" = "../../gen/schemas/desktop-schema.json"

[default]
description = "Default permission set for the attachments plugin — import + catalog list + delete + rename + export + reconcile (apply / remove / referencing) + unused-list."
permissions = [
  "allow-attachment-import",
  "allow-catalog-list",
  "allow-attachment-delete",
  "allow-attachment-rename",
  "allow-attachment-export",
  "allow-attachment-read-text",
  "allow-attachment-read-structured",
  "allow-attachment-read-extracted-text",
  "allow-attachment-refs-apply",
  "allow-attachment-refs-remove",
  "allow-attachment-refs-referencing",
  "allow-attachment-unused-list",
  "allow-attachment-clean-unused",
  "allow-voice-record-start",
  "allow-voice-record-stop",
  "allow-voice-record-cancel",
  "allow-meeting-session-start",
  "allow-meeting-session-stop",
  "allow-meeting-session-cancel",
]

# Detached (pop-out) note-window seat (myne#677, epic #173; capabilities/detached-note.json,
# windows: ["note-*"]). Render + paste only: import (paste an image while editing) + the read
# commands the inline preview uses. Deliberately excludes every library-management + ref-graph +
# voice-capture command (delete/rename/export/clean-unused/unused-list/refs-*/voice), which stay
# main-window-only per the header above.
[[set]]
identifier = "detached-read"
description = "Detached note-window attachment seat: import (paste) + catalog list + inline text/structured/extracted-text reads. No delete/rename/export/clean/refs/voice. Granted exclusively by capabilities/detached-note.json (windows: [\"note-*\"])."
permissions = [
  "allow-attachment-import",
  "allow-catalog-list",
  "allow-attachment-read-text",
  "allow-attachment-read-structured",
  "allow-attachment-read-extracted-text",
]

[[permission]]
identifier = "allow-voice-record-start"
description = "Allow invoking attachments:voice_record_start (Slot::Unlocked-gated arm of a microphone recording session; native cpal capture into a Zeroizing RAM buffer, never a plaintext temp file; fails if a recording is already in progress; MYND-259)."
commands.allow = ["voice_record_start"]

[[permission]]
identifier = "allow-voice-record-stop"
description = "Allow invoking attachments:voice_record_stop (Slot::Unlocked-gated finalize of the active recording — encodes the captured PCM to WAV in Rust, encrypts + stores it as an audio/wav MYA1 attachment via the existing import core, and returns only the attachment metadata; the raw PCM never crosses IPC; MYND-259)."
commands.allow = ["voice_record_stop"]

[[permission]]
identifier = "allow-voice-record-cancel"
description = "Allow invoking attachments:voice_record_cancel (discard the active recording — wipes the in-RAM buffer and stores nothing; idempotent when nothing is recording; MYND-259)."
commands.allow = ["voice_record_cancel"]

[[permission]]
identifier = "allow-meeting-session-start"
description = "Allow invoking attachments:meeting_session_start (Slot::Unlocked-gated start of a meeting session, myne-md/myne#789: the microphone mixed with the macOS system-audio tap where the platform supplies one, captured natively into a Zeroizing RAM buffer, encrypted in Rust through the existing import core; refuses while a session or a voice recording already runs; never a plaintext temp file)."
commands.allow = ["meeting_session_start"]

[[permission]]
identifier = "allow-meeting-session-stop"
description = "Allow invoking attachments:meeting_session_stop (Slot::Unlocked-gated finalize of the active meeting session: awaits every continuation clip's import, imports the final sub-cap clip, and returns the whole session's attachment metadata in capture order. The raw PCM never crosses IPC)."
commands.allow = ["meeting_session_stop"]

[[permission]]
identifier = "allow-meeting-session-cancel"
description = "Allow invoking attachments:meeting_session_cancel (discard the active meeting session's in-flight tail, wiping the in-RAM buffer; already-committed clips remain, matching voice_record_cancel's checkpoint semantics; idempotent when no session runs)."
commands.allow = ["meeting_session_cancel"]

[[permission]]
identifier = "allow-attachment-import"
description = "Allow invoking attachments:attachment_import (Slot::Unlocked-gated import of inline bytes or a path; sniffs + validates the type against the PNG/JPEG/GIF/WebP/SVG/PDF allowlist, enforces the 64 MiB cap, computes the content-addressed attachment-id, dedups on id-existence, else encrypts the MYA1 blob + upserts the MYC1 catalog; returns the id + metadata)."
commands.allow = ["attachment_import"]

[[permission]]
identifier = "allow-catalog-list"
description = "Allow invoking attachments:catalog_list (Slot::Unlocked-gated read of the full vault.attachments catalog metadata for the library UI; fall-back-to-empty on absence / AEAD-fail / parse-fail per protocol.md § 9.10.4)."
commands.allow = ["catalog_list"]

[[permission]]
identifier = "allow-attachment-delete"
description = "Allow invoking attachments:attachment_delete (Slot::Unlocked-gated explicit removal of one attachment — unlinks the blob + removes the catalog entry; idempotent on an absent id; NO auto-GC, the reference graph is the UI's concern)."
commands.allow = ["attachment_delete"]

[[permission]]
identifier = "allow-attachment-rename"
description = "Allow invoking attachments:attachment_rename (Slot::Unlocked-gated free-form rename of one attachment's catalog display filename; duplicates allowed since the content-addressed id is the key; only the MYC1 catalog entry's filename changes — the blob + id + on-disk filename are untouched)."
commands.allow = ["attachment_rename"]

[[permission]]
identifier = "allow-attachment-export"
description = "Allow invoking attachments:attachment_export (Slot::Unlocked-gated export of one attachment's DECRYPTED bytes to a user-chosen destination path; the frontend opens the native Save dialog and passes the path + overwrite consent; the plaintext is decrypted in Rust RAM and written via atomic_write_unclobbered, never crossing back into the WebView. TB3 user-initiated-egress exception — the destination is plaintext by the user's own intent. Type-agnostic: the generic file-card Export action and the image/PDF Save-As affordance both use it; MYND-173)."
commands.allow = ["attachment_export"]

[[permission]]
identifier = "allow-attachment-read-text"
description = "Allow invoking attachments:attachment_read_text (Slot::Unlocked-gated decrypt of one text/code/csv attachment to plaintext text for the inline read-only preview; the plaintext crosses IPC as a String — same secret class as a note body — capped at the preview size limit; the caller renders it INERT (never an interpreted content-type), so there is no serve-time XSS surface; MYND-268 Tier-1)."
commands.allow = ["attachment_read_text"]

[[permission]]
identifier = "allow-attachment-read-structured"
description = "Allow invoking attachments:attachment_read_structured (Slot::Unlocked-gated decrypt + Rust-side parse of one docx/xlsx attachment into a SAFE structured model — a row-major grid or heading/paragraph block list; only the parsed model crosses IPC, never raw bytes or HTML, so the WebView has no XSS surface; MYND-268 Tier-2)."
commands.allow = ["attachment_read_structured"]

[[permission]]
identifier = "allow-attachment-read-extracted-text"
description = "Allow invoking attachments:attachment_read_extracted_text (Slot::Unlocked-gated read-back of one attachment's cached MYE1 extracted text — today the on-device voice-note transcript, protocol.md § 9.15; decrypts the device-local cache blob in Rust and crosses IPC as plaintext (same secret class as a note body) for the read-only 'View transcription' surface, returning null when no Ok extracted-text blob exists. No engine and no ai_enabled gate, so it stays available in the auditable --no-default-features build; MYND-552)."
commands.allow = ["attachment_read_extracted_text"]

[[permission]]
identifier = "allow-attachment-refs-apply"
description = "Allow invoking attachments:attachment_refs_apply (Slot::Unlocked-gated replace-on-apply of a note's referenced attachment-ids; ids arrive already extracted TS-side via the shared extractAttachmentIds tokenizer — never parses markdown; SYNC-6 reconcile)."
commands.allow = ["attachment_refs_apply"]

[[permission]]
identifier = "allow-attachment-refs-remove"
description = "Allow invoking attachments:attachment_refs_remove (Slot::Unlocked-gated removal of a hard-deleted note from the reference graph; trash does NOT route here — trashed notes stay in the graph, filtered TS-side via the live id-set)."
commands.allow = ["attachment_refs_remove"]

[[permission]]
identifier = "allow-attachment-refs-referencing"
description = "Allow invoking attachments:attachment_refs_referencing (Slot::Unlocked-gated query of the note-ids referencing one attachment-id — the library's 'used in N notes' count + the delete-warning's note list; SYNC-6 amended exposes ids, not just a count)."
commands.allow = ["attachment_refs_referencing"]

[[permission]]
identifier = "allow-attachment-unused-list"
description = "Allow invoking attachments:attachment_unused_list (Slot::Unlocked-gated read of the unused-attachment set behind the 'Clean unused attachments' review dialog — catalog entries referenced by zero live notes, computed authoritatively by decrypting + scanning every note for canonical ![[att:<id>]] embeds; fail-closed on an unreadable note; read-only, no mutation; MYND-171)."
commands.allow = ["attachment_unused_list"]

[[permission]]
identifier = "allow-attachment-clean-unused"
description = "Allow invoking attachments:attachment_clean_unused (Slot::Unlocked-gated batched cryptographic erase of confirmed unused attachments — re-verifies each id is still referenced by zero notes via the authoritative fail-closed scan, drops survivors from the MYC1 catalog in one atomic rewrite catalog-first, then unlinks their MYA1 blobs; a re-referenced or already-gone id is skipped; returns deleted/skipped/bytes-reclaimed counts; MYND-171)."
commands.allow = ["attachment_clean_unused"]
