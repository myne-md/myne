# Permissions for the in-app `spell` Tauri plugin (MYND-262 / MYND-266).
# Picked up under the `spell:` ACL namespace because `build.rs` declares this
# as an `InlinedPlugin`. Capability files reference `spell:default`.
#
# The two write commands (add_to_personal_dictionary / ignore_word_in_vault)
# write the encrypted vault.dictionary blob and were reserved main-window-only
# anticipating multi-window; myne#677 (epic #173, sync-ledger SYNC-12) resolves
# that reservation: a detached (pop-out) note window is granted `spell:default`
# via capabilities/detached-note.json (windows: ["note-*"]), because "add to
# dictionary" / "ignore word" are ordinary editor actions a split pane already
# performs, and the exposure (same bundled code, same plaintext) is the same one
# already permitted. omerdduran reviews this reversal in the myne#677 PR.

"$schema" = "../../gen/schemas/desktop-schema.json"

[default]
description = "Default permission set for the spell plugin — batch check + personal-dictionary writers."
permissions = [
  "allow-spell-check",
  "allow-spell-set-active-languages",
  "allow-add-to-personal-dictionary",
  "allow-ignore-word-in-vault",
]

[[permission]]
identifier = "allow-spell-check"
description = "Allow invoking spell:spell_check (batch per-viewport spell check over the active-language dictionaries; lazily loads an active language's bundled dictionary on first use; infallible-empty when no vault/dicts are loaded; returns per-word misspelled+suggestions, no plaintext beyond the words the caller already holds)."
commands.allow = ["spell_check"]

[[permission]]
identifier = "allow-spell-set-active-languages"
description = "Allow invoking spell:spell_set_active_languages (RAM-only: unloads dictionaries for deactivated languages so the loaded set follows the settings picker; no disk write, no plaintext)."
commands.allow = ["spell_set_active_languages"]

[[permission]]
identifier = "allow-add-to-personal-dictionary"
description = "Allow invoking spell:add_to_personal_dictionary (Slot::Unlocked-gated; adds a word to the vault's personal set and persists the encrypted vault.dictionary blob)."
commands.allow = ["add_to_personal_dictionary"]

[[permission]]
identifier = "allow-ignore-word-in-vault"
description = "Allow invoking spell:ignore_word_in_vault (Slot::Unlocked-gated; adds a word to the vault-wide ignore set and persists the encrypted vault.dictionary blob)."
commands.allow = ["ignore_word_in_vault"]
