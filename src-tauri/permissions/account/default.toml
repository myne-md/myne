# Permissions for the in-app `account` Tauri plugin (myne-md/myne#684).
# Picked up under the `account:` ACL namespace only because `build.rs`
# declares the plugin as an `InlinedPlugin`; without that, these flatten into
# `__app-acl__` and never match the `plugin:account|<cmd>` form. The
# `generate_handler!` in `src-tauri/src/plugins/account/mod.rs` ships the
# commands; this file authorizes them.
#
# ONE command since myne-md/myne#937: the grouping is read-only, because
# `account_split` was the only code path that could ever create a second account
# and multi-account support exists nowhere else in the product.

"$schema" = "../../gen/schemas/desktop-schema.json"

[default]
description = "Default permission set for the account plugin: read the device-local account grouping. Read-only: the move/split mutations were removed with the single-account grouping (myne-md/myne#937)."
permissions = [
  "allow-account-list",
]

[[permission]]
identifier = "allow-account-list"
description = "Allow invoking account:account_list (read the device-local account grouping from app_config_dir/account.json; absent means no grouping, a damaged file rebuilds from the disk-scan). A list of accounts out; no vault content, no keychain write."
commands.allow = ["account_list"]
