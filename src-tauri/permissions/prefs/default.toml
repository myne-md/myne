[[permission]]
identifier = "allow-set-developer-mode"
description = "Allow invoking prefs:set_developer_mode (Slot::Unlocked-gated setter for the developer_mode toggle, MYND-593; atomic-writes vault.prefs with no native side-effect; defaults to false, so it is emitted on disk only when true)."
commands.allow = ["set_developer_mode"]

# myne-md/myne#617: how many characters of visible chat history an agent run
# may be seeded with. Same main-window-only invariant as the other allow-set-*
