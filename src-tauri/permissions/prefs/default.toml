[[permission]]
identifier = "allow-set-editor-vim-mode"
description = "Allow invoking prefs:set_editor_vim_mode (Slot::Unlocked-gated setter for the editor_vim_mode toggle — the optional vim keyboard mode; atomic-writes vault.prefs with no native side-effect; the default-OFF policy is applied host-side at read time)."
commands.allow = ["set_editor_vim_mode"]

[[permission]]
identifier = "allow-set-archive-disabled"
description = "Allow invoking prefs:set_archive_disabled (Slot::Unlocked-gated setter for the archive_disabled toggle — disables the note-archive feature's UI entry points; atomic-writes vault.prefs with no native side-effect; the default-OFF policy (archiving enabled) is applied host-side at read time)."
commands.allow = ["set_archive_disabled"]

# myne#279: display date/time/timezone. Each is a free Option<String> the client
# validates — an unrecognised value reads as the `system` default rather than
# failing a write. `timezone` is DISPLAY-ONLY: it decides what the app treats as
# "today" and how a stored wall-clock value is printed, and never enters a .myn
# file, so a note never records where its author was. It DOES live in the MYP1
# vault.prefs blob this command writes, and that blob is pushed and pulled
# verbatim; device-local is a MERGE classification (PrefClass::DeviceLocal,
# sync-protocol.md 10.2), not a transmission one.
#
# Corrected by myne-md/myne#609 across every site a `git grep "sync wire"`
# found, which was nine and not the five the first sweep visited: this file,
# the mobile twin, both clients' prefs.ts (twice in the desktop one),
# DateTimeSettings.tsx, core's set_timezone_from_host,
# prefs_classification.rs's own DeviceLocal comment, protocol/src/prefs.rs
# (the two field docs plus a published vector description),
# docs/spec/protocol.md 9.5.2, and a user-guide article. The count is stated
# as the grep rather than as a memory of the sweep, because a completeness
# claim taken from memory is what let this sentence spread in the first
# place.
[[permission]]
identifier = "allow-set-date-format"
description = "Allow invoking prefs:set_date_format (Slot::Unlocked-gated setter for the date_format display preference — system/iso/dmy/mdy/dmmmy, Option<String> where None clears to the system default; atomic-writes vault.prefs with no native side-effect)."
commands.allow = ["set_date_format"]

[[permission]]
identifier = "allow-set-time-format"
description = "Allow invoking prefs:set_time_format (Slot::Unlocked-gated setter for the time_format display preference — system/24h/12h, Option<String> where None clears to the system default; atomic-writes vault.prefs with no native side-effect)."
commands.allow = ["set_time_format"]

[[permission]]
identifier = "allow-set-timezone"
description = "Allow invoking prefs:set_timezone (Slot::Unlocked-gated setter for the timezone DISPLAY override — an IANA zone identifier, Option<String> where None clears to the host's own zone; atomic-writes vault.prefs with no native side-effect and never writes a zone into note bytes)."
commands.allow = ["set_timezone"]

[[permission]]
identifier = "allow-set-editor-content-width"
description = "Allow invoking prefs:set_editor_content_width (Slot::Unlocked-gated setter for the editor_content_width preset — narrow/normal/wide/full, Option<String> where None clears to the normal default; atomic-writes vault.prefs with no native side-effect)."
commands.allow = ["set_editor_content_width"]

[[permission]]
identifier = "allow-set-editor-font-family"
description = "Allow invoking prefs:set_editor_font_family (Slot::Unlocked-gated setter for the editor_font_family preset — mono/sans, Option<String> where None clears to the mono default; atomic-writes vault.prefs with no native side-effect)."
commands.allow = ["set_editor_font_family"]

