[[permission]]
identifier = "allow-prefs-read"
description = "Allow invoking prefs:prefs_read (Slot::Unlocked-gated read of the vault.prefs blob; returns PrefsView with fall-back-to-defaults on absence / AEAD-fail / parse-fail per protocol.md § 9.5.5)."
commands.allow = ["prefs_read"]

[[permission]]
identifier = "allow-set-screen-capture-protection"
description = "Allow invoking prefs:set_screen_capture_protection (Slot::Unlocked-gated per-field setter for the screen_capture_protection bool; atomic-writes vault.prefs FIRST then calls screen_capture::apply for the native side-effect — disk-then-native ordering is load-bearing for UI/disk consistency per MYND-160 grill Q5.2)."
commands.allow = ["set_screen_capture_protection"]

# MYND-144: a write setter, so it inherits the same main-window-only
# invariant as allow-set-screen-capture-protection — v0.2 multi-window
# MUST NOT grant this to any non-main window.
[[permission]]
identifier = "allow-set-deliberate-folders"
description = "Allow invoking prefs:set_deliberate_folders (Slot::Unlocked-gated setter for the deliberate_folders set — the carrier for empty/deliberately-created folders in the virtual-folder model; atomic-writes vault.prefs with no native side-effect)."
commands.allow = ["set_deliberate_folders"]

# Folder-archive: a write setter, so it inherits the same main-window-only
# invariant as allow-set-deliberate-folders — v0.2 multi-window MUST NOT
# grant this to any non-main window.
[[permission]]
identifier = "allow-set-archived-folders"
description = "Allow invoking prefs:set_archived_folders (Slot::Unlocked-gated setter for the archived_folders set — folders archived as a unit in the folder-archive feature; atomic-writes vault.prefs with no native side-effect)."
commands.allow = ["set_archived_folders"]

# MYND-121: a write setter, so it inherits the same main-window-only
# invariant as the other allow-set-* permissions.
[[permission]]
identifier = "allow-set-auto-lock-timeout"
description = "Allow invoking prefs:set_auto_lock_timeout (Slot::Unlocked-gated setter for the auto_lock_seconds field — atomic-writes vault.prefs FIRST then refreshes the idle timer's cached effective timeout, clamped through the protective envelope; MYND-121)."
commands.allow = ["set_auto_lock_timeout"]

# Unified manual sidebar order + favorites (MYND-183): write setters, so they
# inherit the same main-window-only invariant as the other allow-set-*
# permissions — v0.2 multi-window MUST NOT grant these to any non-main window.
[[permission]]
identifier = "allow-set-item-order"
description = "Allow invoking prefs:set_item_order (Slot::Unlocked-gated setter for the item_order sequence — the unified manual sidebar order across the interleaved file-tree, a heterogeneous list of note UUIDs + folder paths; atomic-writes vault.prefs with no native side-effect, preserving element order)."
commands.allow = ["set_item_order"]

# Bottom-bar customization: a write setter for the hidden_bar_items set — the
# BottomBar element ids the user hid via the bar's right-click menu. Inherits
# the same main-window-only invariant as the other allow-set-* permissions —
# v0.2 multi-window MUST NOT grant this to any non-main window. Atomic-writes
# vault.prefs with no native side-effect; non-load-bearing (no clamp).
[[permission]]
identifier = "allow-set-hidden-bar-items"
description = "Allow invoking prefs:set_hidden_bar_items (Slot::Unlocked-gated setter for the hidden_bar_items set — the bottom-bar element ids the user chose to hide; codec NFC-sorts+dedupes; atomic-writes vault.prefs with no native side-effect)."
commands.allow = ["set_hidden_bar_items"]

# Bottom-bar customization: a write setter for the bar_items_order sequence —
# the right-cluster BottomBar element ids in the order the user arranged them by
# drag-to-reorder or the bar's right-click move actions. Inherits the same
# main-window-only invariant as the other allow-set-* permissions — v0.2
# multi-window MUST NOT grant this to any non-main window. Atomic-writes
# vault.prefs with no native side-effect; non-load-bearing (no clamp).
[[permission]]
identifier = "allow-set-bar-items-order"
description = "Allow invoking prefs:set_bar_items_order (Slot::Unlocked-gated setter for the bar_items_order sequence — the bottom-bar item display order; atomic-writes vault.prefs with no native side-effect, preserving element order verbatim; no codec GC of unknown ids)."
commands.allow = ["set_bar_items_order"]

[[permission]]
identifier = "allow-set-favorites"
description = "Allow invoking prefs:set_favorites (Slot::Unlocked-gated setter for the favorites sequence — the user's favorited notes shown in the sidebar's Favorites section; atomic-writes vault.prefs with no native side-effect, preserving element order)."
commands.allow = ["set_favorites"]

# MYND-137: a write setter, so it inherits the same main-window-only
# invariant as the other allow-set-* permissions — v0.2 multi-window
# MUST NOT grant this to any non-main window.
[[permission]]
identifier = "allow-set-editor-layout"
description = "Allow invoking prefs:set_editor_layout (Slot::Unlocked-gated setter for the editor_layout object — the editor three-pane sidebar widths + collapsed flags; atomic-writes vault.prefs with no native side-effect)."
commands.allow = ["set_editor_layout"]

# MYND-110: a write setter, so it inherits the same main-window-only
# invariant as the other allow-set-* permissions — v0.2 multi-window
# MUST NOT grant this to any non-main window.
[[permission]]
identifier = "allow-set-theme"
description = "Allow invoking prefs:set_theme (Slot::Unlocked-gated setter for the theme field — the user's Light/Dark/System choice; Option<ThemeChoice> where None ≡ system clears the field; atomic-writes vault.prefs with no native side-effect, no protective-envelope clamp since theme is non-load-bearing)."
commands.allow = ["set_theme"]

# custom-themes epic (MYND-297): a write setter for the custom_theme field —
# the active custom-theme name. Inherits the same main-window-only invariant as
# the other allow-set-* permissions — v0.2 multi-window MUST NOT grant this to
# any non-main window. Atomic-writes vault.prefs with no native side-effect;
# non-load-bearing cosmetic (no clamp; the apply layer validates the file and
# falls back to a built-in theme on any failure).
[[permission]]
identifier = "allow-set-custom-theme"
description = "Allow invoking prefs:set_custom_theme (Slot::Unlocked-gated setter for the custom_theme field — the active custom-theme name; Option<String> where None clears it and the client falls back to the built-in theme; atomic-writes vault.prefs with no native side-effect; logs set/cleared only, never the name)."
commands.allow = ["set_custom_theme"]

# MYND-191 daily-notes: three write setters, so they inherit the same
