[[permission]]
identifier = "allow-set-ribbon-visible"
description = "Allow invoking prefs:set_ribbon_visible (Slot::Unlocked-gated setter for the ribbon_visible flag: whether this device shows the left ribbon; default true, omitted unless false; atomic-writes vault.prefs with no native side-effect)."
commands.allow = ["set_ribbon_visible"]

[[permission]]
identifier = "allow-set-periodic-note-setting"
description = "Allow invoking prefs:set_periodic_note_setting (myne#177: a Slot::Unlocked-gated setter for one periodic_notes entry, keyed <period>.<setting> where setting is folder/format/template; Some sets, None removes the key; a folder value is also registered as a deliberate folder so it survives empty, the set_daily_folder discipline; atomic-writes vault.prefs with no native side-effect)."
