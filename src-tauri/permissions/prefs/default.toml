# and TB13 records that no other per-run volume cap exists.
[[permission]]
identifier = "allow-set-chat-history-budget"
description = "Allow invoking prefs:set_chat_history_budget (Slot::Unlocked-gated setter for the agent chat-history seed budget, myne-md/myne#617; atomic-writes vault.prefs with no native side-effect; clamped host-side to MAX_HISTORY_BUDGET; omitted on disk when unset)."
commands.allow = ["set_chat_history_budget"]

