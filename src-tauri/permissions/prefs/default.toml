# Permissions for the in-app `prefs` Tauri plugin (MYND-160).
# Picked up under the `prefs:` ACL namespace only because `build.rs`
# declares this as an `InlinedPlugin`. Capability files reference
# these as `prefs:default` (or `prefs:allow-prefs-read` /
# `prefs:allow-set-screen-capture-protection`).
#
# MYND-160 grill Q5.4 — main-window-only invariant. The `default`
# permission bundle is the only one consumed in v0.1; v0.2 multi-window
# may grant `prefs:allow-prefs-read` to sub-windows but MUST NOT grant
# `prefs:allow-set-screen-capture-protection` to any non-main window
# per `decisions.md` 2026-05-27 "Forward commitment: prefs:write
# capability stays main-window-only".

"$schema" = "../../gen/schemas/desktop-schema.json"

[default]
description = "Default permission set for the prefs plugin — both read + per-field setters."
permissions = [
  "allow-prefs-read",
  "allow-set-screen-capture-protection",
  "allow-set-deliberate-folders",
  "allow-set-auto-lock-timeout",
  "allow-set-note-order",
  "allow-set-folder-order",
  "allow-set-editor-layout",
]

[[permission]]
identifier = "allow-prefs-read"
description = "Allow invoking prefs:prefs_read (Slot::Unlocked-gated read of the vault.prefs blob; returns PrefsView with fall-back-to-defaults on absence / AEAD-fail / parse-fail per protocol.md § 9.5.5)."
commands.allow = ["prefs_read"]

[[permission]]
identifier = "allow-set-screen-capture-protection"
description = "Allow invoking prefs:set_screen_capture_protection (Slot::Unlocked-gated per-field setter for the screen_capture_protection bool; atomic-writes vault.prefs FIRST then calls screen_capture::apply for the native side-effect — disk-then-native ordering is load-bearing for UI/disk consistency per MYND-160 grill Q5.2)."
commands.allow = ["set_screen_capture_protection"]

# MYND-144: a write setter, so it inherits the same main-window-only
# invariant as allow-set-screen-capture-protection — v0.2 multi-window
# MUST NOT grant this to any non-main window.
[[permission]]
identifier = "allow-set-deliberate-folders"
description = "Allow invoking prefs:set_deliberate_folders (Slot::Unlocked-gated setter for the deliberate_folders set — the carrier for empty/deliberately-created folders in the virtual-folder model; atomic-writes vault.prefs with no native side-effect)."
commands.allow = ["set_deliberate_folders"]

# MYND-121: a write setter, so it inherits the same main-window-only
# invariant as the other allow-set-* permissions.
[[permission]]
identifier = "allow-set-auto-lock-timeout"
description = "Allow invoking prefs:set_auto_lock_timeout (Slot::Unlocked-gated setter for the auto_lock_seconds field — atomic-writes vault.prefs FIRST then refreshes the idle timer's cached effective timeout, clamped through the protective envelope; MYND-121)."
commands.allow = ["set_auto_lock_timeout"]

# Manual sidebar reorder: a write setter, so it inherits the same
# main-window-only invariant as the other allow-set-* permissions —
# v0.2 multi-window MUST NOT grant these to any non-main window.
[[permission]]
identifier = "allow-set-note-order"
description = "Allow invoking prefs:set_note_order (Slot::Unlocked-gated setter for the note_order sequence — the manual sidebar sort order for notes; atomic-writes vault.prefs with no native side-effect, preserving element order)."
commands.allow = ["set_note_order"]

[[permission]]
identifier = "allow-set-folder-order"
description = "Allow invoking prefs:set_folder_order (Slot::Unlocked-gated setter for the folder_order sequence — the manual sidebar sort order for folders; atomic-writes vault.prefs with no native side-effect, preserving element order)."
commands.allow = ["set_folder_order"]

# MYND-137: a write setter, so it inherits the same main-window-only
# invariant as the other allow-set-* permissions — v0.2 multi-window
# MUST NOT grant this to any non-main window.
[[permission]]
identifier = "allow-set-editor-layout"
description = "Allow invoking prefs:set_editor_layout (Slot::Unlocked-gated setter for the editor_layout object — the editor three-pane sidebar widths + collapsed flags; atomic-writes vault.prefs with no native side-effect)."
commands.allow = ["set_editor_layout"]
