[[permission]]
identifier = "allow-set-cli-rate-limit-disabled"
description = "Allow invoking prefs:set_cli_rate_limit_disabled (Slot::Unlocked-gated setter for the cli_rate_limit_disabled toggle — removes the default-on socket rate limit; atomic-writes vault.prefs with no native side-effect; class DeviceLocal per sync-protocol.md §10.2 — a machine-local performance knob; Option<bool>, the archive_disabled precedent, omitted on disk only when unset)."
commands.allow = ["set_cli_rate_limit_disabled"]
# graph-connection-ux-polish: a whole-list-replace write setter for the
# color_groups rule list. Inherits the same main-window-only invariant as the
