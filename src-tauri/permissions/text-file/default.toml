# Permissions for the `text_file` plugin (myne-md/myne#1037): the calendar's
# `.ics` exchange, one plaintext file out and one in.
#
# Picked up under the `text-file:` ACL namespace because `build.rs` declares this
# as an `InlinedPlugin`; capability files reference it as `text-file:default`.
# The InlinedPlugin mirror is lock-step with this file: adding a command without a
# matching `commands.allow` entry is a security regression.
#
# Both commands are deliberate, user-initiated plaintext movement (`myne-agents/docs/threat-model.md`
# TB3). Neither reads a vault key, neither mints a handle, and neither runs on its
# own: a save is a click and a read is a file the user picked.

"$schema" = "../../gen/schemas/desktop-schema.json"

[default]
description = "Default permission set for the plaintext file exchange plugin."
permissions = [
  "allow-export-text-file",
  "allow-import-text-file",
]

[[permission]]
identifier = "allow-export-text-file"
description = "Allow invoking text-file:export_text_file (write ONE plaintext file to a path the user named in the OS save dialog: bounded to 1 MiB so a file the app writes is a file it would also import, destination validated, written through the atomic unclobbering write with the dialog's own overwrite consent, and no handle, state or tab is created; deliberate user-initiated egress per myne-agents/docs/threat-model.md TB3, the same exception every export in this product is; the content is the caller's own plaintext, so no vault key is read and no approval is involved; class NotSynced)."
commands.allow = ["export_text_file"]

[[permission]]
identifier = "allow-import-text-file"
description = "Allow invoking text-file:import_text_file (read ONE plaintext file the user picked, as UTF-8, bounded to 1 MiB read one byte past the cap so an oversized file is DETECTED rather than truncated, returning the file's NAME and its text and never a full path; refuses non-UTF-8 by name rather than guessing an encoding; deliberate user-initiated ingress per myne-agents/docs/threat-model.md TB3 and its .ics untrusted-input entry, so the caller must treat the returned text as untrusted; class NotSynced)."
commands.allow = ["import_text_file"]
