# Permissions for the in-app `themes` Tauri plugin (MYND-486).
# Picked up under the `themes:` ACL namespace only because `build.rs` declares
# this as an `InlinedPlugin`. Capability files reference these as `themes:default`
# (or the individual `themes:allow-*` permissions).
#
# As of MYND-486 the custom-theme palettes are VAULT CONTENT (the encrypted
# `vault.themes` `MYT1` blob, protocol.md § 9.21), NOT device-local plaintext.
# Every command is Slot::Unlocked-gated. The mutating commands (import / delete)
# are write setters, so — like the other write-capable plugins — v0.2
# multi-window MUST NOT grant `allow-themes-import` or `allow-themes-delete` to
# any non-main window. The `default` bundle is the only one consumed in v0.1.

"$schema" = "../../gen/schemas/desktop-schema.json"

[default]
description = "Default permission set for the themes plugin — list + read + export (read) and import + delete (write) of vault-content custom themes."
permissions = [
  "allow-themes-list",
  "allow-themes-read",
  "allow-themes-export",
  "allow-themes-import",
  "allow-themes-delete",
]

[[permission]]
identifier = "allow-themes-list"
description = "Allow invoking themes:themes_list (Slot::Unlocked-gated read of the sorted custom-theme names in the vault.themes MYT1 blob; falls back to an empty list on absence / AEAD-fail / parse-fail per protocol.md § 9.21.4)."
commands.allow = ["themes_list"]

[[permission]]
identifier = "allow-themes-read"
description = "Allow invoking themes:themes_read (Slot::Unlocked-gated read of one custom theme's CSS-variable palette by name from vault.themes; NotFound when the name is absent from the store)."
commands.allow = ["themes_read"]

[[permission]]
identifier = "allow-themes-export"
description = "Allow invoking themes:themes_export (Slot::Unlocked-gated read of one custom theme's palette for a plaintext .json export — byte-identical to themes_read; the caller writes the returned palette to a user-chosen file, a TB3 egress the user initiated)."
commands.allow = ["themes_export"]

[[permission]]
identifier = "allow-themes-import"
description = "Allow invoking themes:themes_import (Slot::Unlocked-gated upsert of a validated custom theme under a name; the raw .json is validated through the shared theme_validator value-shape allowlist — the security-load-bearing injection guard — BEFORE it is sealed into vault.themes; an invalid palette rejects with Invalid before any write)."
commands.allow = ["themes_import"]

[[permission]]
identifier = "allow-themes-delete"
description = "Allow invoking themes:themes_delete (Slot::Unlocked-gated delete of one custom theme by name from vault.themes; idempotent — deleting an absent name is a no-op success)."
commands.allow = ["themes_delete"]
