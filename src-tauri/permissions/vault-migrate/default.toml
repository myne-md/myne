# Permissions for the in-app `vault-migrate` Tauri plugin
# (automerge-sync-migration #420). Picked up under the `vault-migrate:` ACL
# namespace only because `build.rs` declares this as an `InlinedPlugin`.
# Capability files reference these as `vault-migrate:default` (or
# `vault-migrate:allow-vault-migrate`). Granular capability per the ecosystem
# convention — one permission entry per command.

"$schema" = "../../gen/schemas/desktop-schema.json"

[default]
description = "Default permission set for the vault-migrate plugin."
permissions = [
  "allow-vault-migrate",
  "allow-vault-migrate-abort",
  "allow-vault-migrate-confirm",
  "allow-vault-migrate-settle-status",
  "allow-vault-migrate-progress",
]

[[permission]]
identifier = "allow-vault-migrate"
description = "Allow invoking vault-migrate:vault_migrate — the whole-vault v0.1 → v0.2 (MYV1 → NTV5) migration (protocol.md §10.4.1). Verifies the password AND requires a valid recovery phrase (RecoveryPhraseRequired otherwise — a backend gate so recovery is never stranded), then mints a new v0.2 root_key, re-encrypts every note MY01 → NC05 and the KEK singletons under the new keys, stages a device-local legacy/ snapshot, and writes NTV5 vault.meta LAST as the atomic commit point. One-way once confirmed; until then the old vault survives in legacy/ and vault_migrate_abort can restore it."
commands.allow = ["vault_migrate"]

[[permission]]
identifier = "allow-vault-migrate-abort"
description = "Allow invoking vault-migrate:vault_migrate_abort — restore the byte-identical pre-migration v0.1 vault from the device-local legacy/ snapshot (protocol.md §10.4.1 point 5). Valid PRE-SYNC and pre-confirm only: once the re-based vault head has landed on the server the peers have adopted the v0.2 generation, and a local roll-back would fork this device away from them (AlreadySynced otherwise). Restores notes, snapshots, attachments and the singletons, writes the old vault.meta LAST, drops the v0.2 caches, and locks the vault so the user re-unlocks the restored v0.1 one."
commands.allow = ["vault_migrate_abort"]

[[permission]]
identifier = "allow-vault-migrate-confirm"
description = "Allow invoking vault-migrate:vault_migrate_confirm — crypto-erase the pre-migration vault (protocol.md §10.4.1 point 5). Deletes legacy/, which holds the ONLY remaining copy of the old root_key (wrapped in legacy/vault.meta under the old password and the old recovery phrase) plus every staged blob. Until this runs, rotating the master password does not revoke access to the staged notes, and the recovery phrase never can. Irreversible: after it the migration is settled and there is no way back."
commands.allow = ["vault_migrate_confirm"]

[[permission]]
identifier = "allow-vault-migrate-settle-status"
description = "Allow invoking vault-migrate:vault_migrate_settle_status — a read-only probe for whether this vault holds an unsettled migration (a legacy/ snapshot neither aborted nor confirmed) and whether abort is still available (pre-sync). Separate from the two acting commands because probing by calling confirm would erase the very thing being probed for. Reads no secret and returns two booleans."
commands.allow = ["vault_migrate_settle_status"]

[[permission]]
identifier = "allow-vault-migrate-progress"
description = "Allow invoking vault-migrate:vault_migrate_progress — read the running migration's per-blob progress (protocol.md §10.4.1 point 2). Counts only: done, total, a generation counter and an active flag. No percentage and no ETA, because the migration's cost is dominated by four Argon2id derivations that happen BEFORE the counted loop and vary by an order of magnitude across machines. Reads three atomics; touches no vault data."
commands.allow = ["vault_migrate_progress"]
