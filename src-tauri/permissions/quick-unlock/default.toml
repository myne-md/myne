# Permissions for the in-app `quick-unlock` Tauri plugin (MYND-329).
# Picked up under the `quick-unlock:` ACL namespace because `build.rs`
# declares this as an `InlinedPlugin`. Capability files reference these
# as `quick-unlock:default` (or `quick-unlock:allow-<cmd>`).
#
# Task 6 ships the PIN path: setup / unlock / status / disable. The macOS
# biometric command branch (task 7) reuses these same commands with a
# biometric provider, so no new permission identifier is needed there.

"$schema" = "../../gen/schemas/desktop-schema.json"

[default]
description = "Default permission set for the quick-unlock plugin."
permissions = [
    "allow-quick-unlock-setup-pin",
    "allow-quick-unlock-with-pin",
    "allow-quick-unlock-setup-biometric",
    "allow-quick-unlock-with-biometric",
    "allow-quick-unlock-status",
    "allow-quick-unlock-disable",
]

[[permission]]
identifier = "allow-quick-unlock-setup-pin"
description = "Allow invoking quick-unlock:quick_unlock_setup_pin (configure PIN quick-unlock while the vault is unlocked)."
commands.allow = ["quick_unlock_setup_pin"]

[[permission]]
identifier = "allow-quick-unlock-with-pin"
description = "Allow invoking quick-unlock:quick_unlock_with_pin (attempt a PIN quick-unlock of the active vault)."
commands.allow = ["quick_unlock_with_pin"]

[[permission]]
identifier = "allow-quick-unlock-setup-biometric"
description = "Allow invoking quick-unlock:quick_unlock_setup_biometric (configure macOS Touch ID quick-unlock; HardwareUnavailable off macOS)."
commands.allow = ["quick_unlock_setup_biometric"]

[[permission]]
identifier = "allow-quick-unlock-with-biometric"
description = "Allow invoking quick-unlock:quick_unlock_with_biometric (attempt a macOS Touch ID quick-unlock of the active vault)."
commands.allow = ["quick_unlock_with_biometric"]

[[permission]]
identifier = "allow-quick-unlock-status"
description = "Allow invoking quick-unlock:quick_unlock_status (read-only: is quick-unlock configured, and by which method)."
commands.allow = ["quick_unlock_status"]

[[permission]]
identifier = "allow-quick-unlock-disable"
description = "Allow invoking quick-unlock:quick_unlock_disable (remove the device-local quick-unlock credential)."
commands.allow = ["quick_unlock_disable"]
