# Permissions for the in-app `device-binding` Tauri plugin.
# Picked up under the `device-binding:` ACL namespace only because `build.rs` declares
# this as an `InlinedPlugin`. Capability files reference these as
# `device-binding:default` (or the individual `device-binding:allow-*` permissions).
#
# The family is the B2B device-to-person binding store: the encrypted
# `vault.device-bindings` (`MYU5`) singleton, group-tier sealed and `NTV6`-only
# (protocol.md §9.30, the member-devices feature). The ONE command is
# Slot::Unlocked-gated and it is a read: `device_bindings_list` answers the
# signature-verified view rather than the raw map, so no grant here can render an
# unverified row beside a member's name.
#
# **The write half has no command** (myne-md/myne#976). `device_bindings_claim` was a
# write setter whose only reachable use was the `MEMBER DEVICES` panel's button, and the
# one state it repaired (a `ConflictingBinding` this device is party to) is repaired by
# the sync cycle's own boundary now, without a human. Granting an affordance with no
# reachable state behind it is what this bundle stopped doing. No command here writes a
# tombstone either: an owner's removal tombstone is written inside the group rotation,
# which is not reachable over IPC at all.

"$schema" = "../../gen/schemas/desktop-schema.json"

[default]
description = "Default permission set for the device-binding plugin: read the vault's signature-verified device bindings."
permissions = [
  "allow-device-bindings-list",
]
