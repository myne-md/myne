# Permissions for the in-app `device-binding` Tauri plugin.
# Picked up under the `device-binding:` ACL namespace only because `build.rs` declares
# this as an `InlinedPlugin`. Capability files reference these as
# `device-binding:default` (or the individual `device-binding:allow-*` permissions).
#
# The family is the B2B device-to-person binding store: the encrypted
# `vault.device-bindings` (`MYU5`) singleton, group-tier sealed and `NTV6`-only
# (protocol.md §9.30, the member-devices feature). Every command is
# Slot::Unlocked-gated. `device_bindings_claim` is a WRITE setter, and it can only ever
# write the CALLER'S OWN row: the row key is the session's enrolled device id and the
# signer is the session's own person key, both read from the session rather than from a
# command argument, so the ACL grants no authority over another device's binding.
# Neither command writes a tombstone: an owner's removal tombstone is written inside
# the group rotation, which is not reachable over IPC. Like the other write-capable
# plugins, v0.2 multi-window MUST NOT grant `allow-device-bindings-claim` to any
# non-main window. The `default` bundle is the only one consumed in v0.1.

"$schema" = "../../gen/schemas/desktop-schema.json"

[default]
description = "Default permission set for the device-binding plugin: list the vault's device bindings, and register this device's OWN binding."
permissions = [
  "allow-device-bindings-list",
  "allow-device-bindings-claim",
]
