[package]
name = "myne-desktop"
version = "0.1.0"
description = "Myne — end-to-end-encrypted markdown notes desktop client"
edition = "2021"
license = "AGPL-3.0"
repository = "https://github.com/myne-md/myne"
publish = false

[lib]
# `_lib` suffix is required so the lib name is unique and does not conflict
# with the bin name on Windows. See rust-lang/cargo#8519.
name = "myne_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# AI ships in the DEFAULT build, but stays OFF at runtime until the user opts in
# via the Settings → Labs "AI (Beta)" toggle (`ai_enabled` pref, default off).
# The `local-inference` feature gates the entire on-device LLM/embedding module
# (`plugins::local_inference`, local-ai epic MYND-406/408) — Candle engine +
# embed-on-unlock; the sandboxed sidecar is still deferred. Because it is in
# `default`, `pnpm tauri dev` / `pnpm tauri build` / CI all compile AI with no
# `--features` flag (decisions.md 2026-07-02 "Ship local AI in the default build
# behind a runtime beta opt-in", superseding the 2026-07-01 default-off posture).
#
# AUDITABLE build: `cargo build -p myne-desktop --no-default-features` (or
# `pnpm tauri build --no-default-features`) drops the ENTIRE `local-inference`
# stack — the generation model, the embedding model, the ASR/speech-to-text path
# and every candle/tokenizers symbol — and carries no network path whatsoever.
# The reproducible-build / TB9 escape hatch is preserved even though AI is no
# longer opt-in at compile time. The no-egress guarantee is an ABSOLUTE property
# of the single shipped tree, proved by `scripts/ai-no-network-check.sh`
# (denylist scan), not a feature delta.
#
# It is NOT, however, a machine-learning-free build, and this comment used to
# claim it was ("zero ML symbols"). Since MYND-441 the tree also contains an
# on-device OCR extractor (`rten` + bundled PP-OCRv5 weights), and that ships in
# EVERY build on purpose: OCR is search correctness, not an AI feature. Gating it
# would make the audit build search differently from the shipped product, which
# is precisely what this build exists to rule out. `ai-no-network-check.sh`
# check 3 asserts the OCR runtime is present in both trees, so it cannot be
# quietly moved behind the feature flag. What an auditor gets here is: no
# generative model, no embeddings, no ASR, no network — plus a fixed,
# model-invariant text recognizer whose weights are hash-pinned in
# `resources/models/ocr/README.md`.
default = ["local-inference"]
local-inference = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]
# E2E-only build variant: keeps `local-inference` but swaps the Candle engine for
# the deterministic `StubEngine` at compile time, so the tauri-driver flow-suite
# gets stable AI output without a model file in the repo. NEVER the shipped
# bundle (the production build uses the real Candle engine). See `docs/dev/e2e.md`.
local-inference-stub = ["local-inference"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
theme-validator = { path = "../theme-validator" }
protocol = { path = "../protocol" }
myne-core = { path = "../core" }
uuid = { version = "1", features = ["v4", "v7"] }
thiserror = "2"
getrandom = "0.2"
zeroize = { version = "1.8", features = ["alloc", "derive"] }
# Constant-time comparison for the clipper pairing-token bearer value
# (`clipper::token::TokenRegistry::validate`) — same blessed RustCrypto primitive
# the protocol crate uses for AEAD tag verification; already in the shared lock.
subtle = { version = "2", default-features = false }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync"] }
# `tracing` for structured ops-side logging (stage tags + bounded
# variant-name fields only; see src-tauri/CLAUDE.md
# "Secret-handling logging discipline").
tracing = "0.1"
# `tracing-subscriber` installs the actual log sink so `tracing::*!` events
# reach stdout (env-filtered via `RUST_LOG`, default `info`). Promoted
# transitive→direct (already locked at 0.3.23 — zero dependency-tree
# expansion, same posture as the objc2/windows-sys promotions below).
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Direct-dep widening of the existing workspace-transitive
# `unicode-normalization` (already pulled in via `protocol`'s vault.prefs
# NFC folder normalization). Still used desktop-side (e.g. the spell path);
# the search index's NFC token folding moved to `myne-core` with the engine.
# Pure-Rust, already in Cargo.lock — no new transitive surface.
unicode-normalization = { version = "0.1.25", default-features = false }

# NOTE: `rust-stemmers` + `whatlang` (the search-index stemmer + language
# detector) moved to `myne-core` alongside the full-text search engine (MYS1);
# they are no longer direct desktop dependencies.

# Compact binary serialization for the search-index blob (MYND-29 Task 9).
# The Task 9 benchmark showed serde_json blew the at-rest blob-size (~5×) and
# warm-unlock budgets; postcard (varint, no field names) shrinks the `MYS1`
# plaintext ~3-5× and the decode accordingly. Pure-Rust, `no_std`+`alloc`,
# tiny surface (cobs + serde, already present). Defines the v0.1
# index_format_version 0x01 payload encoding (nothing shipped yet → no version
# bump). Record in the Task 10 dependency-policy finalization.
postcard = { version = "1", default-features = false, features = ["alloc"] }

# On-device inference stack (local-ai epic, MYND-406). OPTIONAL + pulled by the
# (now default-on) `local-inference` feature; a `--no-default-features` build
# still carries zero ML symbols (the AI-free auditable variant). The no-egress
# gate is an absolute denylist scan over the shipped tree (no networked crate
# present), not a feature delta. `default-features = false` on candle-transformers
# + tokenizers is
# load-bearing: it keeps `hf-hub` / `http` (networked model-download crates) OUT
# of the tree — models are side-loaded from the user's disk (SYNC-1), never
# downloaded (SYNC-2). Verified by `scripts/ai-no-network-check.sh` +
# `no_egress.rs` after this addition.
#
# tokenizers `features = ["onig"]` — the Oniguruma (C) regex engine — is a
# DELIBERATE, audited choice, NOT a default. tokenizers 0.20 offers a pure-Rust
# regex only via `fancy-regex`, which the crate gates exclusively behind its
# `unstable_wasm` feature; that feature also force-enables `getrandom/js` (a
# wasm32 RNG backend), which is wrong for and would break a NATIVE desktop build.
# So there is no native-safe pure-Rust swap in this version. `onig` adds a C
# build-time dep (cc + a vendored Oniguruma) but no network/runtime surface, and
# is confined to the `local-inference` feature (absent from `--no-default-features`).
# Revisit if a
# tokenizers release exposes a native-target pure-Rust regex feature.
candle-core = { version = "0.8", optional = true, default-features = false }
candle-nn = { version = "0.8", optional = true, default-features = false }
candle-transformers = { version = "0.8", optional = true, default-features = false }
tokenizers = { version = "0.20", optional = true, default-features = false, features = ["onig"] }

# Direct-dep widening of the existing workspace-transitive `sha2`
# (already pulled in via `protocol`'s KDF salt construction). Used
# desktop-side to compute SHA-256 of `vault.meta` bytes for the
# slot-held CAS anchor (`Slot::Unlocked.vault_meta_bytes_hash`)
# introduced in MYND-22's foundation hardening. Sister-crate audit
# anchor per `decisions.md` 2026-05-06 entry.
sha2 = { version = "0.10", default-features = false }
spellbook = "=0.4.2"

# Phase 2 sync (MYND-424): decode the base64-encoded head record + blob
# ciphertext the Go server emits on /sync/pull (record_b64 / ciphertext_b64)
# and encode them on /sync/push. Transitive→direct promotion — `base64 0.22.1`
# is already locked via the dependency tree, so this is zero Cargo.lock tree
# expansion (the `windows-sys`/`objc2` precedent). Pure-Rust, no_std-capable,
# MIT/Apache-2.0. Record in `docs/dependency-policy.md`.
# base64 — desktop-side use is local_inference (engine_candle). The sync
# transport's base64 use moved to `myne-core` with the sync extraction
# (decisions.md 2026-07-07); this stays because local_inference still needs it.
base64 = "0.22"

# NOTE: the Phase-2 sync transport crates (rustls + ring provider +
# rustls-pki-types) moved to `myne-core` with the sync engine extraction
# (decisions.md 2026-07-07) — they are now inherited transitively via the
# `myne-core` path dependency, not declared here.

# PDF export per-page footer stamping (MYND-255 hotfix, owner-requested):
# post-processes the captured PDF to draw the document title (bottom-left)
# and an "X / Y" page counter (bottom-right) on every page. WebKit print
# engines cannot draw margin-box page counters, CSS `@page` margin boxes
# are Chromium-only, and a hand-rolled stamper would have to parse three
# engine dialects (classic xref + xref/object streams) — see
# `docs/dependency-policy.md` ledger ("PDF footer stamping") for the
# measured transitive footprint. Not crypto, not telemetry; command-path
# only (`plugins/pdf_export/footer.rs`), never on the boot path. Default
# features (chrono/jiff/rayon/time — date-object + parallel-parse
# conveniences) disabled: the stamper needs parse + content append + full
# rewrite save only. MIT.
lopdf = { version = "0.42.0", default-features = false }
# Decodes the page images pulled out of a scanned (text-layer-less) PDF before
# they go to OCR (MYND-441, `attachments::extract::decode_pdf_image`), and
# synthesizes small PNGs in the dispatch tests. Same pin and same narrow feature
# set as `myne-core`'s, so no package enters the graph that was not already
# there — this is a second declaring crate, not a new admission.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# Attachment text extraction for search (MYND-328). DOCX is an OOXML zip whose
# text lives in `word/document.xml`; `zip` unpacks that one member and
# `quick-xml` streams the `<w:t>` runs out. PDF reuses the lopdf above
# (`Document::extract_text`, zero new deps) and text-like files use std UTF-8 —
# so these two are the ONLY new crates this feature adds. Chosen over
# `pdf-extract` (+61 transitive incl. a duplicate lopdf 0.36) and `docx-rs`
# (+44 transitive) after the MYND-328 dependency spike — see
# `docs/dependency-policy.md` ledger ("Attachment text extraction"). Both
# pure-Rust, command-path only (`plugins/attachments/extract.rs`), never on the
# boot path. `zip` default features off (only `deflate` — the OOXML storage
# method). zip MIT, quick-xml MIT.
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"

# Native microphone capture for voice notes (MYND-259). Pure-Rust cross-
# platform audio I/O over the OS backends (CoreAudio / WASAPI / ALSA); chosen
# over WebView MediaRecorder so captured PCM stays Rust-side + Zeroize-able
# (never the JS heap), the codec is uniform across the three OS WebViews, and
# the unreliable WebKitGTK MediaRecorder path is avoided (`decisions.md`
# voice-notes entry). Command-path only (`plugins/attachments/voice/`), never
# on the boot path; v0.1 records WAV with no encoder dependency. NOTE: the
# Linux build needs the ALSA dev headers (`libasound2-dev`) for cpal's
# alsa-sys backend. A dependency is a security decision — record in
# `docs/dependency-policy.md`. Apache-2.0/MIT.
cpal = "0.15"

# Desktop-only: collapse the parallel-instance race source at process
# boundary (a second app launch redirects to the existing window
# instead of opening a new one). Defends against the catastrophic-
# overwrite class on `vault.meta` together with the slot-held meta-hash
# CAS introduced in MYND-22 — single-instance + CAS = belt+suspenders.
# TB9 audit anchor: see `decisions.md` 2026-05-06 entry.
[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
tauri-plugin-single-instance = "2"

# Windows durability primitive: MoveFileExW(MOVEFILE_WRITE_THROUGH) for
# `atomic_write`'s Windows arm (`src/atomic_write.rs`). Microsoft-
# maintained, audit-strong (transitively used by zip/rusqlite/tempfile
# in the broader Rust ecosystem; version 0.60 is already locked via
# `tauri 2.10.3` / `arboard` / `muda` — no `Cargo.lock` tree expansion).
# Target-conditional so non-Windows builds neither resolve nor compile
# the crate. See `decisions.md` 2026-05-07 for the dependency-policy
# checklist.
#
# Auto-lock on idle (MYND-121) extends the feature list (NOT a new crate):
# `Win32_UI_Input_KeyboardAndMouse` (GetLastInputInfo + LASTINPUTINFO) and
# `Win32_System_SystemInformation` (GetTickCount) give the Windows
# machine-level idle reader in `auto_lock::machine_idle`. Pure-Rust
# bindings, no system-lib build script — same already-locked crate.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_SystemInformation",
] }
# PDF export native print-to-PDF arm, Windows (MYND-255):
# `ICoreWebView2_7::PrintToPdf` via tauri's `with_webview` handle.
# Transitive→direct promotions — `webview2-com 0.38.2` and
# `windows 0.61.3` are already locked via tauri/wry on Windows; zero
# dependency-tree expansion. Best-effort arm (no Windows lane);
# ratified fallback is window.print() if unviable.
webview2-com = "0.38"
windows = "0.61"

# Linux machine-level idle reader (MYND-121): the X11 ScreenSaver extension
# (`XScreenSaverQueryInfo` equivalent) via the **pure-Rust** `x11rb` (talks
# the X11 wire protocol over a socket — no libX11/libXss C linkage, so it
# stays reproducible-build-clean unlike the `x11-dl` dlopen alternative).
# `connect()` failing (Wayland-only session / no DISPLAY) → `None` →
# `auto_lock` falls back to the window-level heartbeat (fail-secure). New
# direct dependency per the user's "all three platforms now" decision
# (grill/feature dependency call) — `docs/dependency-policy.md` bar applies.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["screensaver"] }
# PDF export print-to-file arm (MYND-255): WebKitPrintOperation +
# GtkPrintSettings, reached through tauri's `with_webview` handle.
# Both crates are transitive→direct promotions — `webkit2gtk 2.0.2` and
# `gtk 0.18.2` are already locked via tauri/wry on Linux; zero
# dependency-tree expansion (the `windows-sys` precedent above).
webkit2gtk = "2.0"
gtk = "0.18"

# PDF export native print-to-PDF arm, macOS (MYND-255): WKWebView
# `printOperationWithPrintInfo:` with an NSPrintSaveJob disposition,
# reached through tauri's `with_webview` handle. All four objc2 crates
# are transitive→direct promotions — `objc2 0.6.4` /
# `objc2-app-kit 0.3.2` / `objc2-foundation 0.3.2` /
# `objc2-web-kit 0.3.2` are already locked via tauri/wry on macOS; zero
# dependency-tree expansion (the `windows-sys` precedent above).
[target.'cfg(target_os = "macos")'.dependencies]
# `security-framework` (the MYND-329 Touch ID quick-unlock provider's Keychain
# backing) moved to `myne-core` with the Apple biometric provider so the mobile
# client shares it (decisions.md 2026-07-12); this crate reaches it through the
# `myne-core` path dep.
objc2 = { version = "0.6", default-features = false }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSGraphics",
    "NSGraphicsContext",
    "NSPrintInfo",
    "NSPrintOperation",
    "NSResponder",
    "NSView",
    # `NSWindow` gates `NSView::window` + the modal-for-window print run
    # (`runOperationModalForWindow:…` — the synchronous `runOperation`
    # deadlocks WKWebView pagination; see plugins/pdf_export/capture.rs).
    "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSDictionary",
    "NSString",
    "NSURL",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "std",
    "WKWebView",
    # AppKit integration: WKWebView's NSView superclass chain (we call
    # `view.window()`) and the AppKit-typed print API. Already enabled
    # transitively via wry — declared here so our own use is explicit.
    "objc2-app-kit",
] }

# On-device AI (local-ai epic) — macOS override: enable candle's `accelerate`
# feature so matmul uses Apple's Accelerate.framework BLAS instead of the naive
# `gemm` fallback. Accelerate is a SYSTEM-framework link (`accelerate-src`), NOT
# a network crate — no-egress (SYNC-2) is preserved (re-verified by
# `ai-no-network-check.sh`). Without it a MiniLM embed is ~1.3s (naive gemm) vs
# ~tens of ms (BLAS). These UNION with the base optional candle deps in
# `[dependencies]`, and are pulled by the (now default-on) `local-inference`
# feature (macOS build only; absent from a `--no-default-features` build).
# `metal` adds the Apple GPU backend (Metal.framework — a SYSTEM framework, not a
# network crate; no-egress preserved) so inference can run on the M-series GPU
# instead of the CPU; `accelerate` stays as the CPU-BLAS fallback path (used when
# Metal device creation fails). Device selection is runtime (`select_device()` in
# engine_candle.rs, macOS→Metal-or-CPU).
candle-core = { version = "0.8", optional = true, default-features = false, features = ["accelerate", "metal"] }
candle-nn = { version = "0.8", optional = true, default-features = false, features = ["accelerate", "metal"] }
candle-transformers = { version = "0.8", optional = true, default-features = false, features = ["accelerate", "metal"] }

# Dev-dependencies — evaluated under the same `docs/dependency-policy.md`
# bar as runtime dependencies. `tracing-test` (tokio-rs org, MIT) is the
# project's first dev-dep; it captures `tracing` events per-test so the
# notes plugin's tracing-level discipline (debug for orphan files, warn
# for corruption canaries) is asserted in unit tests rather than
# reviewer-inspected. See `decisions.md` 2026-05-08 "Dev-dependencies
# under the same policy bar as runtime dependencies; `tracing-test` as
# the precedent".
[dev-dependencies]
tracing-test = "0.2"
# Cross-plugin test fixtures (ScratchVault, ScopedTempDir, FAST_TEST_KDF,
# seed_real_vault_meta) live in `myne-core`; the `test-support` feature gates
# them so production builds never compile them. See `core/src/test_support.rs`.
myne-core = { path = "../core", features = ["test-support"] }
