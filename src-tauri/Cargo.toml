[package]
name = "myne-desktop"
version = "0.1.0"
description = "Myne — end-to-end-encrypted markdown notes desktop client"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/myne-md/myne"
publish = false

[lib]
# `_lib` suffix is required so the lib name is unique and does not conflict
# with the bin name on Windows. See rust-lang/cargo#8519.
name = "myne_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
protocol = { path = "../protocol" }
uuid = { version = "1", features = ["v4", "v7"] }
thiserror = "2"
getrandom = "0.2"
zeroize = { version = "1.8", features = ["alloc", "derive"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync"] }
# `tracing` for structured ops-side logging (stage tags + bounded
# variant-name fields only; see src-tauri/CLAUDE.md
# "Secret-handling logging discipline").
tracing = "0.1"

# Direct-dep widening of the existing workspace-transitive `sha2`
# (already pulled in via `protocol`'s KDF salt construction). Used
# desktop-side to compute SHA-256 of `vault.meta` bytes for the
# slot-held CAS anchor (`Slot::Unlocked.vault_meta_bytes_hash`)
# introduced in MYND-22's foundation hardening. Sister-crate audit
# anchor per `decisions.md` 2026-05-06 entry.
sha2 = { version = "0.10", default-features = false }

# Desktop-only: collapse the parallel-instance race source at process
# boundary (a second app launch redirects to the existing window
# instead of opening a new one). Defends against the catastrophic-
# overwrite class on `vault.meta` together with the slot-held meta-hash
# CAS introduced in MYND-22 — single-instance + CAS = belt+suspenders.
# TB9 audit anchor: see `decisions.md` 2026-05-06 entry.
[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
tauri-plugin-single-instance = "2"

# Windows durability primitive: MoveFileExW(MOVEFILE_WRITE_THROUGH) for
# `atomic_write`'s Windows arm (`src/atomic_write.rs`). Microsoft-
# maintained, audit-strong (transitively used by zip/rusqlite/tempfile
# in the broader Rust ecosystem; version 0.60 is already locked via
# `tauri 2.10.3` / `arboard` / `muda` — no `Cargo.lock` tree expansion).
# Target-conditional so non-Windows builds neither resolve nor compile
# the crate. See `decisions.md` 2026-05-07 for the dependency-policy
# checklist.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

# Dev-dependencies — evaluated under the same `docs/dependency-policy.md`
# bar as runtime dependencies. `tracing-test` (tokio-rs org, MIT) is the
# project's first dev-dep; it captures `tracing` events per-test so the
# notes plugin's tracing-level discipline (debug for orphan files, warn
# for corruption canaries) is asserted in unit tests rather than
# reviewer-inspected. See `decisions.md` 2026-05-08 "Dev-dependencies
# under the same policy bar as runtime dependencies; `tracing-test` as
# the precedent".
[dev-dependencies]
tracing-test = "0.2"
