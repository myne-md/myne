[package]
name = "myne-desktop"
version = "0.1.0"
description = "Myne — end-to-end-encrypted markdown notes desktop client"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/myne-md/myne"

[lib]
# `_lib` suffix is required so the lib name is unique and does not conflict
# with the bin name on Windows. See rust-lang/cargo#8519.
name = "myne_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
protocol = { path = "../protocol" }
uuid = { version = "1", features = ["v4", "v7"] }
thiserror = "2"
getrandom = "0.2"
zeroize = { version = "1.8", features = ["alloc", "derive"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }
