# SPDX-License-Identifier: AGPL-3.0-only
#
# Flatpak manifest for the released desktop bundle.
#
# It packages the .deb the release already publishes rather than rebuilding the
# app: the payload is the same bytes every other channel ships, so a Flatpak
# cannot drift from the deb, the rpm, the Arch package or the snap. The runtime
# supplies WebKitGTK and GTK, which is the whole reason a Flatpak exists here —
# the deb and rpm drag those in as system packages.
#
# Runtime choice: org.gnome.Platform//46 is the last GNOME runtime that ships
# webkit2gtk-4.1, which is what Tauri 2 links. A freedesktop runtime has no
# WebKitGTK at all.
id: md.myne.desktop
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: myne-desktop

finish-args:
  # Vaults are files the user points the app at, anywhere on disk; the app also
  # opens them through its own CLI sidecar, so home access is the honest scope.
  - --filesystem=home
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --filesystem=xdg-run/keyring

modules:
  - name: myne
    buildsystem: simple
    build-commands:
      # The deb payload is already the FHS tree the app expects under a prefix:
      # usr/bin (the app and its three sidecars), usr/lib/Myne (models and
      # dictionaries), usr/share (desktop file, icons, metainfo). The tree is
      # kept intact because Tauri resolves its resources relative to the
      # executable, so splitting it into /app/bin + /app/lib strands the models.
      # `ar` takes exact member names, and the deb's data member names its own
      # compression, so the member is looked up and the decompressor chosen from
      # its suffix rather than assumed.
      - |
        member=$(ar t myne.deb | grep '^data.tar' | head -1)
        case "$member" in
          *.gz) Z=-z ;; *.xz) Z=-J ;; *.zst) Z=--zstd ;; *) Z= ;;
        esac
        ar p myne.deb "$member" | tar $Z -x -C /app
      - mkdir -p /app/bin
      - ln -s ../usr/bin/myne-desktop /app/bin/myne-desktop
      - install -Dm644 /app/usr/share/applications/Myne.desktop /app/share/applications/md.myne.desktop.desktop
      # The deb's desktop file points Icon=myne-desktop; Flatpak (and appstreamcli,
      # which gates the export) resolve the icon by the application ID instead, so
      # both the Icon key and the file names move to md.myne.desktop.
      - sed -i -e 's/^Exec=.*/Exec=myne-desktop/' -e 's/^Icon=.*/Icon=md.myne.desktop/' /app/share/applications/md.myne.desktop.desktop
      - |
        for s in 16 32 48 64 128 256 512; do
          src=$(find /app/usr/share/icons -path "*/${s}x${s}/*" -name "*.png" | head -1)
          if [ -n "$src" ]; then
            install -Dm644 "$src" "/app/share/icons/hicolor/${s}x${s}/apps/md.myne.desktop.png"
          fi
        done
      - install -Dm644 /app/usr/share/metainfo/md.myne.desktop.metainfo.xml /app/share/metainfo/md.myne.desktop.metainfo.xml
    sources:
      - type: file
        path: myne.deb
