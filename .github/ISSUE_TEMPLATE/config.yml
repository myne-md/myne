blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability (private)
    url: https://github.com/myne-md/myne/blob/develop/SECURITY.md
    about: Do NOT open a public issue for cryptography, key handling, recovery, sync, or bundle-integrity problems. Email security@myne.md — coordinated disclosure per SECURITY.md.
  - name: Protocol, threat model and specs
    url: https://github.com/myne-md/myne/tree/develop/docs
    about: The v0.1 protocol, threat model, and account-number spec are the source of truth across every client. Read before filing a crypto or on-disk-format issue.
  - name: Questions and support
    url: https://github.com/myne-md/myne/blob/develop/SUPPORT.md
    about: Read this first. Questions go through the Question template; security reports go to security@myne.md.
  - name: Contributing and the DCO
    url: https://github.com/myne-md/myne/blob/develop/CONTRIBUTING.md
    about: Every commit needs a Signed-off-by trailer (`git commit -s`). Read this before opening a pull request.
