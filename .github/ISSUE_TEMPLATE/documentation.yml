name: Documentation
description: A spec, README, glossary entry, or guide is wrong, unclear, or missing.
title: "[Docs]: "
labels: ["type: docs"]
body:
  - type: markdown
    attributes:
      value: |
        Note that the decision log is append-only and the glossary keeps one A–Z entry per term.
  - type: input
    id: where
    attributes:
      label: Which document or page?
      placeholder: "e.g. agent-tooling/docs/spec/protocol.md §9.14, README.md, glossary entry 'account number'"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong or missing?
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested fix
