name: nightly-build

# Unsigned internal builds. This is not a release: no tag, no GitHub release,
# no signing key, no store upload. Each platform job uploads an Actions artifact
# retained for 14 days, so the team can install and test the current develop
# without turning a nightly into an official artefact.
#
# The extension lives in myne-clipper and is intentionally absent here.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev \
            patchelf desktop-file-utils libfuse2
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.8.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sidecar:release
      - name: Build unsigned bundle
        run: pnpm tauri build --bundles deb,appimage --config src-tauri/tauri.nightly.conf.json
      - name: Build the Arch nightly package
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          # Absolute, because `find` with a relative root prints a relative path and
          # Docker reads a bare `target/...` as a named volume, not a host directory.
          DEB="$(find "$PWD/target/release/bundle/deb" -maxdepth 1 -name '*.deb' -print -quit)"
          if [ -z "$DEB" ]; then
            echo "no .deb was produced; nothing to repackage"
            exit 1
          fi
          mkdir -p target/release/bundle/arch
          docker run --rm \
            -v "$PWD:/src:ro" \
            -v "$PWD/target/release/bundle/arch:/out" \
            -v "$(dirname "$DEB"):/deb:ro" \
            archlinux:base-devel \
            /src/packaging/arch/nightly-container.sh "/deb/$(basename "$DEB")" "$VERSION" "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: myne-linux-${{ github.sha }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: myne-arch-${{ github.sha }}
          path: target/release/bundle/arch/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev \
            patchelf desktop-file-utils libfuse2
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.8.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sidecar:release
      - name: Build unsigned bundle
        run: pnpm tauri build --bundles deb,appimage --config src-tauri/tauri.nightly.conf.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: myne-linux-arm64-${{ github.sha }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

  nix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@d698718aa798980d17dd749f03beae0b51183399 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # The flake is deliberately source-only: it has devShells and no
      # packages/apps. This checks the NixOS entry point without pretending a
      # prebuilt Nix package exists.
      - run: nix flake check --no-build
      - run: nix develop --command pnpm --version

  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.8.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sidecar:release
      - name: Build unsigned app bundle
        run: pnpm tauri build --bundles app --config src-tauri/tauri.nightly.conf.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: myne-macos-${{ github.sha }}
          path: target/release/bundle/macos/*.app
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.8.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Provide the SQLite import library used by the Tor sidecar
        shell: pwsh
        run: |
          vcpkg install sqlite3:x64-windows
          "LIB=C:\vcpkg\installed\x64-windows\lib;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Append
          "INCLUDE=C:\vcpkg\installed\x64-windows\include;$env:INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: pnpm install --frozen-lockfile
      - run: pnpm sidecar:release
      - name: Build unsigned NSIS installer
        run: pnpm tauri build --bundles nsis --config src-tauri/tauri.nightly.conf.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: myne-windows-${{ github.sha }}
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK and NDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0" \
            "ndk;29.0.13846066"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.8.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Initialise the generated Android project
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          NDK_HOME: /usr/local/lib/android/sdk/ndk/29.0.13846066
        run: |
          cd mobile
          pnpm tauri android init
          bash scripts/android-postinit.sh
      - name: Build debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          NDK_HOME: /usr/local/lib/android/sdk/ndk/29.0.13846066
        run: |
          cd mobile
          pnpm tauri android build --apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: myne-android-${{ github.sha }}
          path: mobile/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    runs-on: macos-15
    timeout-minutes: 90
    # An unsigned simulator build is useful as an internal smoke artefact but is
    # not a TestFlight build. Keep it non-blocking until Apple signing material
    # is provisioned; the other platform artefacts must not be held hostage to it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: brew install xcodegen
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.8.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Initialise the generated iOS project
        run: |
          cd mobile
          pnpm tauri ios init
          bash scripts/ios-postinit.sh
      - name: Build simulator/debug app
        env:
          CI: "true"
          NPM_CONFIG_CONFIRM_MODULES_PURGE: "false"
        run: |
          cd mobile
          pnpm tauri ios build --debug --target aarch64-sim --ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: myne-ios-${{ github.sha }}
          path: |
            mobile/src-tauri/gen/apple/build/**/*.ipa
            mobile/src-tauri/gen/apple/build/**/*.app
          if-no-files-found: warn
          retention-days: 14
