name: ci-full

# The push/nightly battery. It mirrors the old Woodpecker main.yml by area
# rather than by one job per historical step: every command that gated a push
# still runs here, but related checks share a runner so the free public-repo
# minutes are not spent thirty times on the same checkout and pnpm install.
#
# This workflow never runs on a pull request. PRs get the fork-safe core in
# ci.yml; private companions and the long compile lanes run here, on develop
# and by hand.

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev \
            mold file git
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all -- --check
      # The dudect timing test is a measurement of a quiet host, not a merge
      # gate: a loaded shared runner produces a false TIMING LEAK (the test's
      # own control cannot tell the two apart at this sample size). It runs in
      # the separate, non-blocking `timing` job on the full battery.
      - run: cargo test -p protocol --no-fail-fast -- --skip dudect_decode_timing_independent_of_key_bytes
      - run: cargo test -p myne-mcp -p myne-cli -p theme-validator --no-fail-fast
      - run: cargo clippy -p protocol -p myne-core --all-targets -- -D warnings
      - run: cargo clippy -p myne-web-wasm --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy -p myne-core -p protocol --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test -p myne-web-wasm
      - name: Install llvm-nm for the wasm symbol gate
        run: rustup component add llvm-tools-preview
      - run: bash scripts/wasm-csprng-check.sh
      - run: bash scripts/wasm-core-graph-check.sh
      - run: bash scripts/wasm-repro-check.sh
      - run: bash src-tauri/scripts/ai-no-network-check.sh
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - run: cargo deny check
      - run: node scripts/gen-rust-third-party-licenses.mjs
      - run: node scripts/check-build-notices.mjs --rust-only

  timing:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - run: cargo test -p protocol --test crypto_attacks_timing -- --nocapture
        continue-on-error: true

  guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.8.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/ci-guards.sh

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.8.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/check-build-notices.mjs
      - run: pnpm test
      - run: pnpm test:seam:desktop
      - run: pnpm stories:test

  stories:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.8.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm stories:build
      - run: node scripts/check-stories-bundle.mjs
      - run: pnpm stories:build:public
      - run: node scripts/check-stories-public-bundle.mjs
      - run: bash scripts/check-stories-container-headers.sh

  web-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.8.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/wasm-repro-check.sh
      - run: pnpm web:build
      - run: pnpm test:seam:web
      - run: node scripts/check-web-third-party.mjs
      - run: node scripts/check-web-no-test-hooks.mjs
      - run: node scripts/check-web-command-coverage.mjs
      - run: node scripts/check-web-capabilities.mjs
      - run: node scripts/check-web-bundle-budget.mjs
      - run: node scripts/check-web-screens.mjs
      - run: node scripts/check-web-surfaces.mjs
      - run: node scripts/check-web-testids.mjs
      - run: pnpm exec vitest run tests/web tests/platform
      - name: Build and probe the web container
        run: |
          docker build -f web/container/Dockerfile \
            --build-arg MYNE_BUILD_COMMIT=${{ github.sha }} \
            --build-arg "MYNE_BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t myne-web:${{ github.sha }} .
          MYNE_WEB_IMAGE=myne-web:${{ github.sha }} bash scripts/check-web-container-headers.sh --no-build

  tauri:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev mold
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.8.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the desktop app and its sidecars
        env:
          MYNE_SIDECAR_FEATURES: voice-capture-stub,local-inference-stub
        run: pnpm tauri build --no-bundle -- --features voice-capture-stub,local-inference-stub
      - run: cargo clippy -p myne-core -p myne-desktop -p e2e-fixture-gen --all-targets -- -D warnings
      - run: cargo clippy -p myne-desktop --all-targets --no-default-features -- -D warnings
      - run: cargo test -p myne-desktop -p myne-core -p myne-format -p myne-decrypt --no-fail-fast

  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev mold
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.8.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm mobile:build
      - run: node scripts/check-npm-licenses.mjs
      - run: pnpm mobile:test
      - run: pnpm --filter myne-mobile exec playwright install --with-deps chromium
      - run: pnpm mobile:test:flow
      - run: cargo clippy -p myne-mobile -p tauri-plugin-screen-guard -p tauri-plugin-device-key -p tauri-plugin-share-intent -p tauri-plugin-save-file -p tauri-plugin-qr-scan -p tauri-plugin-reminders -p tauri-plugin-sensitive-clipboard --all-targets -- -D warnings
      - run: cargo test -p myne-mobile -p tauri-plugin-sensitive-clipboard -p tauri-plugin-save-file --no-fail-fast

  sync-sim:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myne-md/myne-server
          path: myne-server
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 1.26.11
          cache-dependency-path: myne-server/go.mod
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev mold
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - run: cargo build -p myne-core --tests
      - run: (cd myne-server && CGO_ENABLED=0 go build -o myne-server ./cmd/myne-server)
      - run: |
          export MYNE_E2E_SERVER="$PWD/myne-server/myne-server"
          export MYNE_TEST_REQUIRE_SERVER=1
          cargo test -p myne-core plugins::sync --no-fail-fast

  vectors:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myne-md/myne-test-vectors
          path: myne-test-vectors
          persist-credentials: false
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            chromium chromium-driver
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - run: |
          export MYNE_VECTORS_REQUIRED=1
          export MYNE_TEST_VECTORS_DIR="$PWD/myne-test-vectors/vectors"
          cargo test -p protocol --test vectors
          cargo test -p myne-core --lib dictionary_merge_matches_every_published_vector
          CHROMEDRIVER=/usr/bin/chromedriver bash scripts/browser-vectors.sh

  cross-repo:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myne-md/myne-server
          path: myne-server
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myne-md/myne-website
          path: myne-website
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myne-md/myne-clipper
          path: myne-clipper
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.8.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Private companions (myne-ops, myne-branding) are not checked out in the
      # public workflow: a public repository must not hold a credential that can
      # read private repositories. Their drift lanes run from the private repos.
      # The guards below report the absent private companions without failing.
      - run: node scripts/check-stream-timeout-drift.mjs --require-companion
      - run: node scripts/check-selfhost-bundle-drift.mjs
      - run: node scripts/check-server-env-roster.mjs
      - run: node scripts/check-clipper-wire.mjs --require-companion
      - run: node scripts/check-branding-parity.mjs
