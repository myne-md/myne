name: pr-review

# myne-bot PR review, moved from n8n on the VPS to a GitHub Action. On every PR
# open/push/reopen/draft-ready, build the review context, run the pr-review-bot
# skill headless via `opencode run` with a read-only permission set, then render
# and post the verdict (summary comment + inline Critical anchors).
#
# The skill is a pure function over the tree: it reads, never writes. The
# deterministic halves live in scripts/github-review/. opencode is the reviewer
# in the middle, and its permissions are the opencode equivalent of the old
# jailed runner's `--allowed-tools Read Grep Glob Agent Task "Bash(git …:*)"`.
#
# Forks are not reviewed (same decision the n8n reviewer made): a fork's code
# must never run inside this workflow's context, and pull_request_target is
# deliberately not used because it would checkout fork code with secrets present.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.fork == false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # The skill body and the reviewer rulebooks live in agent-tooling (private).
      - name: Clone agent-tooling (skill + reviewers)
        env:
          MYNE_BOT_PAT: ${{ secrets.MYNE_BOT_PAT }}
        run: |
          git clone --depth 1 https://x-access-token:${MYNE_BOT_PAT}@github.com/example-org/agent-tooling.git agent-tooling

      # Companion repos do not carry the specs. When the PR is NOT in myne, clone
      # the main repo read-only so the crypto/threat-model/spec dimensions have
      # something to read (review.sh did exactly this).
      - name: Clone myne (specs, for companion PRs)
        if: github.event.repository.name != 'myne'
        env:
          MYNE_BOT_PAT: ${{ secrets.MYNE_BOT_PAT }}
        run: |
          git clone --depth 1 https://x-access-token:${MYNE_BOT_PAT}@github.com/myne-md/myne.git spec-repo

      # The legal texts live in companion repos. myne-website is published content
      # (full clone); operations is sparse — only legal/**/*.md is materialised, so
      # deploy config and runbooks never reach the reviewer's context (the branch
      # under review is attacker-influenceable text).
      - name: Clone legal reference trees
        env:
          MYNE_BOT_PAT: ${{ secrets.MYNE_BOT_PAT }}
        run: |
          git clone --depth 1 https://x-access-token:${MYNE_BOT_PAT}@github.com/myne-md/myne-website.git legal/website
          git clone --depth 1 --no-checkout --filter=blob:none https://x-access-token:${MYNE_BOT_PAT}@github.com/example-org/operations.git legal/ops
          git -C legal/ops sparse-checkout init --no-cone
          git -C legal/ops sparse-checkout set '/legal/**/*.md'
          git -C legal/ops checkout

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install opencode
        run: curl -fsSL https://opencode.ai/install | bash -s -- --no-modify-path

      - name: Build context
        env:
          MYNE_BOT_PAT: ${{ secrets.MYNE_BOT_PAT }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          SPEC_REPO_DIR: ${{ github.event.repository.name != 'myne' && 'spec-repo' || '' }}
          LEGAL_REPO_DIR: legal
          REVIEW_OUT_DIR: scripts/github-review/.review
        run: node scripts/github-review/build-context.mjs

      - name: Classify (opencode run, read-only)
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
          REVIEW_PACKET: scripts/github-review/.review/packet.json
          REVIEW_SKILL: agent-tooling/skills/pr-review-bot/SKILL.md
          REVIEW_OUT: scripts/github-review/.review/verdict.json
          REVIEW_DIR: ${{ github.workspace }}
        run: node scripts/github-review/classify.mjs

      # The reviewer must never modify the tree. Assert it after the run, exactly
      # as review.sh did before unwrapping the verdict.
      - name: Assert tree clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "FATAL: the reviewer modified the working tree, which it must never do:"
            git status --porcelain
            exit 1
          fi

      - name: Apply verdict
        env:
          MYNE_BOT_PAT: ${{ secrets.MYNE_BOT_PAT }}
          REVIEW_PACKET: scripts/github-review/.review/packet.json
          REVIEW_VERDICT: scripts/github-review/.review/verdict.json
        run: node scripts/github-review/apply-verdict.mjs
