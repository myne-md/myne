name: issue-triage

# myne-bot issue triage. This is the "Route to triage" half of WF0 + WF3: on `issues.opened`, build
# the context packet, classify it, and apply the verdict.
#
# The classifier is Jev (TypeSafe's System One decision model) reached through OpenRouter. It is
# asked one typed question per decision and answers from a closed set of options, so it cannot name
# a label, a repo or a milestone the packet did not offer, and it does not generate the comment: that
# is rendered from templates in render-comment.mjs. The prose in agent-tooling'
# skills/issue-triage/SKILL.md is the specification these questions implement.
#
# The three pieces are split so that only the middle one can be wrong in a new way:
#   build-packet.mjs   deterministic, GitHub reads, no model
#   classify-jev.mjs   the only model call, one request, typed answers
#   apply-verdict.mjs  deterministic, GitHub writes, validates every value against the packet
#
# The classifier code is CHECKED OUT FROM `myne` RATHER THAN READ FROM THIS REPOSITORY. All nine
# repos run this workflow, and the scripts used to be copied into each of them, which meant a fix to
# the label handling reached one repository out of seven. That is the same "a copied file drifts"
# shape the skill clone below used to solve, and the criteria now live in code rather than in a
# prompt, so a stale copy is a stale DECISION rather than a stale docstring. `myne@develop` is the
# single source. The trade is blast radius: a broken classifier in `myne` breaks triage in all nine
# at once. That is accepted because the failure path is destroy-nothing (apply-verdict keeps the
# labels the issue already has, adds `status: triage`, and exits non-zero), and because a broken
# classifier is caught by `myne`'s own CI rather than by a satellite's.

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    # The same two exclusions as n8n's Route to triage: never re-triage the bot's
    # own issues (which would loop or double-process transfers).
    if: >-
      github.event.sender.login != 'myne-bot' &&
      github.event.issue.user.login != 'myne-bot'
    steps:
      # `myne` is private and this is not it, so GITHUB_TOKEN cannot read it. The PAT is the same
      # org-wide myne-bot credential every GitHub write in the pipeline uses.
      - name: Check out the triage code (myne@develop)
        uses: actions/checkout@v6
        with:
          repository: myne-md/myne
          ref: develop
          path: triage
          token: ${{ secrets.MYNE_BOT_PAT }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build packet
        env:
          MYNE_BOT_PAT: ${{ secrets.MYNE_BOT_PAT }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          mkdir -p .triage
          node triage/scripts/github-triage/build-packet.mjs > .triage/packet.json

      - name: Classify (Jev via OpenRouter)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TRIAGE_PACKET: .triage/packet.json
          TRIAGE_OUT: .triage/verdict.json
        run: node triage/scripts/github-triage/classify-jev.mjs

      # A classifier that cannot be reached and a classifier that answers wrongly need different
      # responses, and the run log alone does not tell them apart. One cheap call settles which.
      - name: Diagnose OpenRouter reachability
        if: failure()
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "=== curl the Decisions API (real Jev call, minimal request) ==="
          curl -sS -m 60 -w "\nhttp=%{http_code} time=%{time_total}s\n" \
            -H "Authorization: Bearer ${OPENROUTER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"model":"typesafe/jev-1.13","state":"ping","questions":{"ok":{"type":"noul","instructions":"Is this reachable?"}}}' \
            https://openrouter.ai/api/alpha/decisions || echo "curl failed (exit $?)"

      - name: Apply verdict
        env:
          MYNE_BOT_PAT: ${{ secrets.MYNE_BOT_PAT }}
          TRIAGE_PACKET: .triage/packet.json
          TRIAGE_VERDICT: .triage/verdict.json
        run: node triage/scripts/github-triage/apply-verdict.mjs
