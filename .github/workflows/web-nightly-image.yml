name: web-nightly-image

# Private internal build of the browser client. It is not a release: no tag, no
# GitHub release, no signing key. The image is published to GHCR for the team
# and for the future app.myne.md deployment, which is not wired up yet.
#
# The package is bootstrapped private from outside this public repository; the
# preflight refuses to publish if the package is missing or has become public.
# The main repository's GITHUB_TOKEN cannot own an unlinked package, so a
# classic PAT with write:packages is the credential.
#
# amd64 only: the future app.myne.md host is amd64 and a second architecture
# would rebuild the whole Rust/wasm stage for no current consumer. Add arm64
# here when a real arm host needs it.

on:
  schedule:
    - cron: "45 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: web-nightly-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the package to exist as private before publishing
        env:
          GH_TOKEN: ${{ secrets.GHCR_WRITE_TOKEN || secrets.MYNE_BOT_PAT }}
        run: |
          if ! visibility=$(gh api orgs/myne-md/packages/container/myne-web-nightly --jq .visibility 2>/dev/null); then
            echo "::error::myne-web-nightly does not exist yet. Bootstrap it as private first; publishing from this public repository would create it public."
            exit 1
          fi
          echo "myne-web-nightly visibility before build: $visibility"
          if [ "$visibility" != "private" ]; then
            echo "::error::myne-web-nightly is $visibility; refusing to publish"
            exit 1
          fi
      - name: Record the source clock
        run: echo "MYNE_BUILD_TIMESTAMP=$(git log -1 --format=%cI)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: omerdduran
          password: ${{ secrets.GHCR_WRITE_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: web/container/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            MYNE_BUILD_COMMIT=${{ github.sha }}
            MYNE_BUILD_TIMESTAMP=${{ env.MYNE_BUILD_TIMESTAMP }}
          tags: |
            ghcr.io/myne-md/myne-web-nightly:nightly
            ghcr.io/myne-md/myne-web-nightly:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify the package stayed private
        env:
          GH_TOKEN: ${{ secrets.GHCR_WRITE_TOKEN || secrets.MYNE_BOT_PAT }}
        run: |
          visibility=$(gh api orgs/myne-md/packages/container/myne-web-nightly --jq .visibility)
          echo "myne-web-nightly visibility: $visibility"
          if [ "$visibility" != "private" ]; then
            echo "::error::myne-web-nightly is $visibility; it must be private"
            exit 1
          fi
