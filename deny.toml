# cargo-deny configuration — Myne workspace
# Run via: cargo deny check
# Policy doc: agent-tooling/docs/dependency-policy.md
# Threat model: agent-tooling/docs/threat-model.md §6, TB9

[graph]
# Check all targets to catch platform-specific deps
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ─────────────────────────────────────────────────────────────────────
# Advisories — vulnerability + unmaintained checks
# ─────────────────────────────────────────────────────────────────────
[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Fail on any unmaintained / unsound advisory by default; add specific ignores
# with rationale + tracking issue if absolutely necessary.
#
# FIFTEEN ENTRIES WERE DELETED HERE on 2026-10-15, all reported by
# `cargo deny check advisories` as `advisory was not encountered`:
#   · RUSTSEC-2024-0411 … -0420 — the gtk-rs GTK3 block. All ten are WITHDRAWN
#     in the advisory DB (`withdrawn = "2026-08-14"`), so they can never fire
#     again. (The old comment on 0420 said "fxhash"; the DB says `gtk-sys`.)
#   · RUSTSEC-2025-0075/-0080/-0081/-0098/-0100 — the rust-unic block. These are
#     NOT withdrawn and never matched because `urlpattern` 0.6.0 dropped the
#     rust-unic stack for `icu_properties`: no `unic-*` crate is in Cargo.lock
#     at all any more.
# Re-checked under `[graph].targets = ["x86_64-unknown-linux-gnu"]` before
# deleting, in case the ten GTK3 hits were only absent from the macOS graph —
# same fifteen, so it is not a host-target artefact.
# Do not re-add an entry without reproducing a real match; `cargo deny check
# advisories` names every ignore that matches nothing.
#
# The arti block at the END is a different kind of entry — read its comment
# before adding anything near it.
ignore = [
    "RUSTSEC-2024-0370",  # proc-macro-error unmaintained (tauri build chain)
    "RUSTSEC-2025-0057",  # fxhash unmaintained, the SECOND advisory filed against the
                          # same crate — an ignore naming only the first id does not
                          # cover it. Reaches this file through myne-mobile, which
                          # shares this config: the desktop lock has no fxhash at all,
                          # so the desktop tree never trips it and the gap was
                          # invisible here. Transitive via tauri-utils → kuchikiki →
                          # selectors; same no-safe-upgrade-until-Tauri story as the
                          # other Tauri transitives here.
    "RUSTSEC-2024-0436",  # paste unmaintained; build-time proc-macro via gemm →
                          # candle (on-device AI). No safe upgrade; not a runtime path.
    "RUSTSEC-2026-0192",  # ttf-parser unmaintained; via lopdf (PDF export). No safe
                          # upgrade. Revisit when lopdf migrates to skrifa.
    "RUSTSEC-2026-0194",  # quick-xml DoS (quadratic duplicate-attr scan)
    "RUSTSEC-2026-0195",  # quick-xml DoS (NsReader namespace-alloc); both transitive
                          # via wry/Tauri, no upgrade path. SECURITY: drop on Tauri bump.

    # ── arti / `myne-tor` sidecar (MYND-650) ──────────────────────────
    # The ONLY *vulnerability*-class entry in this list (everything above is
    # unmaintained-status), so it carries a reachability argument rather than an
    # "upstream hasn't moved" one:
    #
    #   · The advisory is about RSA **private-key** operations leaking key bits
    #     through timing that is observable over the network (Marvin). It does
    #     not apply to public-key verification.
    #   · `rsa` reaches us only as `ssh-key-fork-arti` → `tor-key-forge` — arti's
    #     OpenSSH-format keystore *encoding*, which compiles in every key type
    #     the ssh-key crate supports. arti's keystore holds ed25519/x25519
    #     material; it neither generates nor operates an RSA private key, and a
    #     Tor *client* performs no RSA private-key operation for a network peer
    #     at all. Verify with `cargo tree -p myne-tor-sidecar -e normal -i rsa`.
    #   · It is confined to the sidecar process: `cargo tree -p myne-desktop -e
    #     normal -i rsa` matches nothing, so it is absent from the audited
    #     desktop binary entirely.
    #
    # Drop this the moment `rsa` ships the constant-time implementation, or
    # sooner if arti stops pulling it. If the tree-shape claim above ever stops
    # holding (an arti bump that puts `rsa` on a live path, or anything that
    # links the sidecar into `myne-desktop`), this ignore is no longer justified
    # — re-argue it, don't re-date it.
    "RUSTSEC-2023-0071",  # rsa: Marvin timing sidechannel; unreachable here (above).

    # ── the bundled-SQLite advisory (RUSTSEC-2026-0459), published 2026-11-09 ──
    # `libsqlite3-sys` below 0.39 bundles a SQLite with CVE-2026-119375. The
    # advisory's own exposure clause is what decides this one: it applies "only to
    # a process that opens a database file, with its -wal, that a less trusted
    # party could have written". The reachability argument, verified not assumed:
    #
    #   · `cargo tree -p myne-tor-sidecar -e normal -i libsqlite3-sys` answers one
    #     chain: rusqlite → tor-dirmgr → arti-client → arti → myne-tor-sidecar.
    #     That is arti's on-disk directory cache, inside the user's own data
    #     directory and written by the sidecar process itself; nothing else on the
    #     machine, and no network peer, hands it a `-wal`.
    #   · `cargo tree -p myne-desktop -e normal -i libsqlite3-sys` matches no
    #     package, so the audited desktop binary does not carry it at all.
    #   · Upgrading is not available in this tree: 0.39 needs rusqlite 0.41, which
    #     arti 2.5 does not use, and it declares a Rust 1.89 floor.
    #
    # Drop this when arti moves to rusqlite 0.41. If the sidecar ever opens a
    # database some other process can write, the argument is void — re-argue it.
    "RUSTSEC-2026-0459",  # bundled SQLite (CVE-2026-119375), arti cache only.

    # ── the `zip` extraction advisories, published together on 2026-10-17 ─────
    # RUSTSEC-2026-0367 / -0368 / -0369 are all one surface: `ZipArchive::extract`,
    # `ZipStreamReader::extract` and the stream extraction API WRITING an
    # archive's entries to a filesystem path (symlink targets escaping the
    # destination, SUID/SGID bits preserved, permissions applied through a
    # symlink). The fix upstream is `>=9.0.0`.
    #
    # RUSTSEC-2026-0429 (GHSA-q7v9-x93c-xqv3, added here 2026-11-03) is the same
    # function reached from the other end: `extract()` sizes its symlink-target
    # buffer from the `uncompressed_size` the central directory declares, before
    # reading a byte of entry data, and ZIP64 widens that to a full `u64` with no
    # cross-check against the compressed size or the archive length, so a crafted
    # archive asks for an arbitrary allocation. It is a fourth advisory on the
    # sink, not a new surface, and the argument below is about the sink.
    #
    # No call to any of them exists in this workspace, which is the whole
    # argument:
    #
    #     grep -rn '\.extract(\|extract_stream' --include='*.rs' \
    #       src-tauri/src core/src mobile/src-tauri/src protocol/
    #       -> no match
    #
    # and every `zip` call site is a read over an in-memory `Cursor`:
    #
    #     src-tauri/src/plugins/attachments/extract.rs:384, :453, :674
    #       ZipArchive::new(std::io::Cursor::new(bytes)) + by_name(..).read_to_end(..)
    #     :812, :831, :939   ZipWriter over `&mut Vec<u8>` (test fixtures)
    #
    # The reachability claim is about the SINK, not the input, and the
    # distinction matters here: a DOCX or XLSX IS attacker-chosen, because the
    # user imports one. What is absent is any hand-off to the filesystem, so
    # there is no path that creates a symlink, a setuid file, or a permission
    # bit. Three versions sit in the tree — 1.1.4 via candle-core 0.8.4, 2.6.1
    # direct, 4.6.1 via tauri-plugin-updater 2.12.0 — and the one sentence
    # covers all three because it is about our code, not about theirs.
    #
    # Neither transitive one can take the fix (candle-core 0.8.4 requires
    # `^1.1.1`; tauri-plugin-updater pins `^4`). Our OWN `zip = "2"`
    # (src-tauri/Cargo.toml) is the one that could move to 9, and that is a
    # separate change with the extractor surface to re-verify. Re-argue this
    # block when any of the three moves; do not re-date it.
    "RUSTSEC-2026-0367",  # zip: SUID/SGID bits preserved during extraction
    "RUSTSEC-2026-0368",  # zip: extracted symlink may point outside the destination
    "RUSTSEC-2026-0369",  # zip: permissions applied through extracted symlinks
    "RUSTSEC-2026-0429",  # zip: symlink-target buffer sized from the declared uncompressed size

    # ── the `zbus` family, unmaintained (2026-10-17) ─────────────────────────
    # RUSTSEC-2026-0370 / -0371 / -0372: upstream merged `zvariant`,
    # `zbus_names` and `zvariant_derive` into `zbus` 6.0.0, so the DB says "No
    # safe upgrade is available" for each. They reach us through `zbus` 5.16,
    # which is a dependency of `tauri-plugin-opener` 2.5.4 and
    # `tauri-plugin-single-instance` 2.4.2 — both Tauri's own, so the upgrade is
    # a Tauri bump and not something this workspace can take alone. Status, not
    # a vulnerability: no advisory attaches to any of the three crates, and what
    # rots is future maintenance rather than a reachable defect. THREE entries,
    # because the split is three crates: an ignore naming two of them leaves the
    # third red, which is exactly how this list was written the first time.
    "RUSTSEC-2026-0370",  # zvariant unmaintained (merged into zbus 6)
    "RUSTSEC-2026-0371",  # zbus_names unmaintained (merged into zbus 6)
    "RUSTSEC-2026-0372",  # zvariant_derive unmaintained (merged into zbus 6)

    # ── the `zip` 1.x yank, LIFTED (checked 2026-11-03) ──────────────────
    # `zip 1.1.4` still reaches us through `candle-core 0.8.4`'s non-optional
    # `zip = "^1.1.1"`, and its yank exemption lived here from 2026-10-16 until
    # the day upstream unyanked the line. `cargo deny check advisories` says so
    # in its own words now ("yanked crate not detected"), which is how to tell:
    # an exemption that no longer names a real yank licenses the next one for
    # free. The candle bump onto a live `zip` major is still the real fix, and
    # it is still a separate change (candle 0.9.2+ asks for ^7.2.0, which
    # touches the on-device AI stack on desktop AND mobile plus the
    # `[profile.dev.package]` gemm overrides).
]

# ─────────────────────────────────────────────────────────────────────
# Licenses — allow-list per agent-tooling/docs/dependency-policy.md
# AGPL-3.0 workspace; permissive + weak-copyleft + GPL-compat allowed
# ─────────────────────────────────────────────────────────────────────
[licenses]
version = 2
allow = [
    "AGPL-3.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    # webpki-roots's Mozilla CA bundle is dual-stated MPL-2.0 / CDLA-Permissive-2.0,
    # and cargo-deny reads the CDLA half. The dependency itself was reviewed and
    # accepted as a security decision — agent-tooling/docs/dependency-policy.md "Remote AI
    # providers (myne#415)" records this exact license pair, decisions.md
    # 2026-08-09 "User-named AI providers", ledger SYNC-23. The prose said yes and
    # this list was never told, so `cargo-deny` has been red since e194df44 —
    # unnoticed because CI was not running on push. Permissive, no copyleft,
    # applies to certificate DATA rather than to code.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

# Specific overrides for crates with non-standard license declarations
exceptions = []

# ─────────────────────────────────────────────────────────────────────
# Bans — duplicate versions, wildcard, unwanted crates
# ─────────────────────────────────────────────────────────────────────
[bans]
multiple-versions = "warn"  # surface duplicate transitives but don't block
wildcards = "deny"           # no `*` versions in Cargo.toml
allow-wildcard-paths = true  # path deps within the workspace lack version requirements
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

# Crates we explicitly forbid (with rationale)
deny = [
    # Add entries as: { name = "foo", reason = "why forbidden" }
]

# Crates we explicitly skip multiple-version warnings for
skip = []

# Skip transitive duplicates that are unavoidable upstream
skip-tree = []

# ─────────────────────────────────────────────────────────────────────
# Sources — only crates.io + git deps with pinned commit hash
# ─────────────────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
# Git deps must be added explicitly to `allow-git` with a pinned commit hash
# in the corresponding Cargo.toml `rev = "..."` field.

[sources.allow-org]
github = []
