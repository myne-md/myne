# cargo-deny configuration — Myne workspace
# Run via: cargo deny check
# Policy doc: docs/dependency-policy.md
# Threat model: docs/threat-model.md §6, TB9

[graph]
# Check all targets to catch platform-specific deps
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ─────────────────────────────────────────────────────────────────────
# Advisories — vulnerability + unmaintained checks
# ─────────────────────────────────────────────────────────────────────
[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Fail on any unmaintained / unsound advisory by default; add specific ignores
# with rationale + tracking issue if absolutely necessary.
#
# The first block below is unmaintained-status advisories on transitive crates
# pulled in by Tauri 2.10.x (GTK3 bindings, urlpattern → rust-unic, fxhash, etc.).
# They have no safe upgrade path until Tauri itself migrates off them; revisit
# when Tauri 3.x lands or when individual crates publish replacements.
# Tracking: https://github.com/rustsec/advisory-db/issues/2414 (rust-unic)
#
# The arti block at the END is a different kind of entry — read its comment
# before adding anything near it.
ignore = [
    "RUSTSEC-2024-0370",  # proc-macro-error unmaintained (tauri build chain)
    "RUSTSEC-2024-0411",  # gtk-rs GTK3 bindings unmaintained
    "RUSTSEC-2024-0412",  # gtk-rs GTK3 bindings unmaintained
    "RUSTSEC-2024-0413",  # gtk-rs GTK3 bindings unmaintained
    "RUSTSEC-2024-0414",  # gtk-rs GTK3 bindings unmaintained
    "RUSTSEC-2024-0415",  # gtk-rs GTK3 bindings unmaintained
    "RUSTSEC-2024-0416",  # gtk-rs GTK3 bindings unmaintained
    "RUSTSEC-2024-0417",  # gtk-rs GTK3 bindings unmaintained
    "RUSTSEC-2024-0418",  # gtk-rs GTK3 bindings unmaintained
    "RUSTSEC-2024-0419",  # gtk-rs GTK3 bindings unmaintained
    "RUSTSEC-2024-0420",  # fxhash unmaintained
    "RUSTSEC-2025-0057",  # fxhash unmaintained, the SECOND advisory filed against the
                          # same crate — an ignore naming only the 2024 id does not
                          # cover it. Reaches this file through myne-mobile, which
                          # shares this config: the desktop lock has no fxhash at all,
                          # so the desktop tree never trips it and the gap was
                          # invisible here. Transitive via tauri-utils → kuchikiki →
                          # selectors; same no-safe-upgrade-until-Tauri story as the
                          # block above.
    "RUSTSEC-2025-0075",  # transitive (Tauri); no upgrade path
    "RUSTSEC-2025-0080",  # transitive (Tauri); no upgrade path
    "RUSTSEC-2025-0081",  # transitive (Tauri); no upgrade path
    "RUSTSEC-2025-0098",  # unic-ucd-version (rust-unic) unmaintained; via urlpattern
    "RUSTSEC-2025-0100",  # unic-ucd-ident (rust-unic) unmaintained; via urlpattern
    "RUSTSEC-2024-0436",  # paste unmaintained; build-time proc-macro via gemm →
                          # candle (on-device AI). No safe upgrade; not a runtime path.
    "RUSTSEC-2026-0192",  # ttf-parser unmaintained; via lopdf (PDF export). No safe
                          # upgrade. Revisit when lopdf migrates to skrifa.
    "RUSTSEC-2026-0194",  # quick-xml DoS (quadratic duplicate-attr scan)
    "RUSTSEC-2026-0195",  # quick-xml DoS (NsReader namespace-alloc); both transitive
                          # via wry/Tauri, no upgrade path. SECURITY: drop on Tauri bump.

    # ── arti / `myne-tor` sidecar (MYND-650) ──────────────────────────
    # The ONLY *vulnerability*-class entry in this list (everything above is
    # unmaintained-status), so it carries a reachability argument rather than an
    # "upstream hasn't moved" one:
    #
    #   · The advisory is about RSA **private-key** operations leaking key bits
    #     through timing that is observable over the network (Marvin). It does
    #     not apply to public-key verification.
    #   · `rsa` reaches us only as `ssh-key-fork-arti` → `tor-key-forge` — arti's
    #     OpenSSH-format keystore *encoding*, which compiles in every key type
    #     the ssh-key crate supports. arti's keystore holds ed25519/x25519
    #     material; it neither generates nor operates an RSA private key, and a
    #     Tor *client* performs no RSA private-key operation for a network peer
    #     at all. Verify with `cargo tree -p myne-tor-sidecar -e normal -i rsa`.
    #   · It is confined to the sidecar process: `cargo tree -p myne-desktop -e
    #     normal -i rsa` matches nothing, so it is absent from the audited
    #     desktop binary entirely.
    #
    # Drop this the moment `rsa` ships the constant-time implementation, or
    # sooner if arti stops pulling it. If the tree-shape claim above ever stops
    # holding (an arti bump that puts `rsa` on a live path, or anything that
    # links the sidecar into `myne-desktop`), this ignore is no longer justified
    # — re-argue it, don't re-date it.
    "RUSTSEC-2023-0071",  # rsa: Marvin timing sidechannel; unreachable here (above).
]

# ─────────────────────────────────────────────────────────────────────
# Licenses — allow-list per docs/dependency-policy.md
# AGPL-3.0 workspace; permissive + weak-copyleft + GPL-compat allowed
# ─────────────────────────────────────────────────────────────────────
[licenses]
version = 2
allow = [
    "AGPL-3.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

# Specific overrides for crates with non-standard license declarations
exceptions = []

# ─────────────────────────────────────────────────────────────────────
# Bans — duplicate versions, wildcard, unwanted crates
# ─────────────────────────────────────────────────────────────────────
[bans]
multiple-versions = "warn"  # surface duplicate transitives but don't block
wildcards = "deny"           # no `*` versions in Cargo.toml
allow-wildcard-paths = true  # path deps within the workspace lack version requirements
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

# Crates we explicitly forbid (with rationale)
deny = [
    # Add entries as: { name = "foo", reason = "why forbidden" }
]

# Crates we explicitly skip multiple-version warnings for
skip = []

# Skip transitive duplicates that are unavoidable upstream
skip-tree = []

# ─────────────────────────────────────────────────────────────────────
# Sources — only crates.io + git deps with pinned commit hash
# ─────────────────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
# Git deps must be added explicitly to `allow-git` with a pinned commit hash
# in the corresponding Cargo.toml `rev = "..."` field.

[sources.allow-org]
github = []
