# Lefthook config — Myne main repo.
# Install once per clone:  brew install lefthook && lefthook install
# Skip ad-hoc:             LEFTHOOK=0 git commit ...   (or  git commit --no-verify)

# Pinned to the version this hook battery was actually verified against, not to
# the earliest that might work. The distinction matters because `lefthook run`
# and the real git hook path IGNORE an unknown key without a word (only
# `lefthook validate` rejects one, and hooks never call it), so an older binary
# would silently drop `use_stdin` below and leave a guard that greenly checks
# nothing. Measured on 2.1.10 in both directions. myne-md/myne#592.
min_version: 2.1.10

pre-commit:
  parallel: true
  commands:

    rustfmt:
      glob: "*.rs"
      run: cargo fmt --all -- --check

    spdx-header:
      # Every tracked Rust source file MUST carry the AGPL-3.0 SPDX header on
      # line 1 (root AGENTS.md "License" + LICENSING.md). This is the
      # machine-readable anchor of the file-level licensing claim; drift here is
      # a normative violation. The rule itself lives in
      # `scripts/check-spdx-headers.mjs`: this hook calls it with the staged
      # paths, and `scripts/hooks-parity-check.sh` calls it with none, so the
      # pre-commit gate and its `--no-verify` backstop cannot drift apart.
      run: node scripts/check-spdx-headers.mjs {staged_files}

    private-path-refs:
      # A path into a private companion (`myne-ops/`, `myne-agents/`,
      # `myne-range/`) written into a tree this repository publishes is a
      # reference a reader cannot follow, and they cannot tell "internal" from
      # "moved". The recorded set may shrink and never grow: `--record` refuses a
      # grown set, so the command its failure message suggests cannot make a
      # finding disappear. Its own header states the classes and the reason each
      # carries; ~250 dated decision entries are permanent by the append-only
      # rule, and the rest is debt that can only fall.
      run: node scripts/check-private-path-refs.mjs

    tsc:
      glob: "*.{ts,tsx}"
      run: pnpm exec tsc --noEmit

    platform-seam:
      # phase3-web-client task 2: `src/platform/` is the only place under
      # `src/` allowed to import `@tauri-apps/*`. Without this the seam erodes
      # on the next feature and the web build silently regains a hard Tauri
      # dependency. `.woodpecker/main.yml` runs the same script as the backstop so
      # `--no-verify` does not slip a violation past.
      #
      # Task 76 extended it to `editor/`, `dialect/` and `copy/` — the shared
      # SOURCE packages every client compiles. There the rule is stricter: they
      # have no seam directory and are allowed ZERO Tauri imports, because they
      # reach their host through `EditorHost` (dependency injection) rather than
      # through a substituted directory. The glob already covers those paths;
      # the script decides which root a staged file belongs to.
      glob: "*.{ts,tsx,js,jsx,mts,cts}"
      run: node scripts/check-platform-seam.mjs {staged_files}

    plain-surface-imports:
      # myne-md/myne#788: the plain-file surface renders the user's own file with
      # the vault locked or absent, and several vault-coupled modules call
      # `invoke` at module scope, so a single direct import in `src/plain/` turns
      # "works with no vault" into a runtime failure that no compiler reports.
      # The host refusal covers only what the editor calls THROUGH the host; a
      # direct import never passes through it.
      #
      # Globbed to the tree the rule is about: every import SITE lives under
      # `src/plain/`, so a docs-only, protocol-only or core-only commit cannot
      # change the answer and does not pay the scan. The `run:` takes no
      # {staged_files}: the glob decides WHETHER it runs, and it sweeps the
      # whole tree when it does.
      glob: "{src/plain/**,scripts/check-plain-surface-imports.mjs}"
      run: node scripts/check-plain-surface-imports.mjs

    core-task-seam:
      # phase3-web-client task 80: `crate::task` is the only place in `core/`
      # allowed to reach tokio's execution surface. The reason this is a hook
      # and not a convention: `spawn_blocking` COMPILES for wasm32 and panics at
      # runtime, so nothing in the build catches a new call site — not cargo
      # check, not clippy on either target, not a native test run. The first
      # symptom is a dead Worker in a browser.
      glob: "core/src/**/*.rs"
      run: node scripts/check-core-task-seam.mjs {staged_files}

    core-io-seam:
      # phase3-web-client task 17: `crate::vault_io` is the only place in `core/`
      # allowed to reach the filesystem. Same reason as `core-task-seam` above —
      # `std::fs` COMPILES for wasm32 and fails at runtime, so nothing in the
      # build catches a new call site.
      #
      # A RATCHET, not a ban: 38 files still reach the filesystem directly and
      # migrating them is the body of tasks 12-14 and 44-48. The rule is
      # one-directional — a file not on the list may not start, and a file that
      # leaves it may not come back.
      glob: "core/src/**/*.rs"
      run: node scripts/check-core-io-seam.mjs {staged_files}

    version-routing:
      # myne-md/myne#442: a vault is v0.1 or, after the §10.4 migration, v0.2, and
      # three helpers have a v0.1-only variant that stays in scope and compiles
      # fine — `parse_vault_meta`, `derive_subkey`, `protocol::decode_note`. When a
      # reader forgets the version-aware one, nothing says so: the failure appears
      # only on a MIGRATED vault, and its worst form is silent (a reader that
      # answers "empty" rather than "error" lets the next write persist that
      # emptiness over the user's real data).
      #
      # A RATCHET, not a ban: the migration legitimately reads the OLD vault, and
      # the never-synced caches deliberately keep the v0.1 context (§10.4.1 md.2).
      # Those are recorded with reasons; everything else is debt and must shrink.
      glob: "{core/src,src-tauri/src}/**/*.rs"
      run: node scripts/check-version-routing.mjs {staged_files}

    crypto-registries:
      # Epic #249: the protocol layer's registries each get ONE chokepoint in
      # code — `derive_subkey` for §3.4 subkey roles, a `*_BLOB_MAGIC` constant
      # per §10.3 family, `push_length_prefixed_u16_be` for §5.2 length
      # prefixes, the non-`_raw` wrappers for §6.7 nonces — and until now the
      # rule "go through the chokepoint" was held by a doc comment.
      #
      # Every one of those rules is invisible to the compiler: a bypass
      # compiles, clippy is green, every other guard passes and CI is green.
      # The divergence is then silent — a wrong-but-self-consistent subkey
      # still AEAD-verifies against blobs written by the same wrong code, and a
      # re-typed magic that stops matching just makes a blob family quietly
      # stop syncing with no error anywhere.
      #
      # Whole-tree rather than glob-scoped: the §10.3 registry is discovered by
      # reading the declaration sites, so a staged-files run would not know
      # which magics exist.
      run: node scripts/check-crypto-registries.mjs

    prefs-nonce:
      # #251: every `vault.prefs` write goes through `writePref` in
      # `src/lib/prefs.ts`, which bumps the prefs nonce. That bump is the only
      # mechanism by which sibling `usePrefs` instances re-read disk truth, and
      # as an optional second line in ~56 setters it was forgotten in 31 of
      # them — favourites silently dropped AND the deletion synced, right-panel
      # tab actions doing nothing, an AI opt-in the editor never saw. Whole-tree
      # rather than glob-scoped: rule 2 is "no module outside prefs.ts invokes a
      # prefs write", which a new file elsewhere can break.
      run: node scripts/check-prefs-nonce.mjs

    datetime-display-publisher:
      # myne-md/myne#609: the shared date/time display store had exactly ONE
      # publisher in the whole tree while three clients read it. The mobile
      # client rendered the desktop's task panel, so it consumed the store from
      # the day it moved in-repo and wrote nothing into it, leaving the store at
      # its defaults for the life of the process. `date_format` is Shared
      # scalar-LWW, so a format chosen on a computer synced to the phone, which
      # held it and printed something else. Nothing reported it: it type-checks,
      # every lint passes, the store has a sane default and the wrong output is a
      # plausible date. Whole-tree rather than glob-scoped, because the rule is
      # about a tree as a whole and a new file anywhere can start consuming.
      run: node scripts/check-datetime-display-publisher.mjs

    clipboard-feedback:
      # myne-md/myne#390 + myne-md/myne#455: eleven clipboard call sites across
      # three trees in four feedback patterns, two of them reporting nothing on
      # either outcome, including the recovery-phrase step, where the phrase is
      # shown once and a failed Copy looked exactly like a successful one. Two
      # rules: no raw WebView clipboard API outside the web seam, and no `silent`
      # feedback arm without a stated reason. Whole-tree rather than
      # glob-scoped, because rule 1 is a prohibition a new file anywhere can
      # break.
      run: node scripts/check-clipboard-feedback.mjs

    unwired:
      # #272: a module nothing imports does not run. TypeScript does not
      # complain about an unused export and lint does not, so a module can be
      # written, documented, unit-tested and never wired — which is exactly how
      # the web client's single-tab vault lock shipped, with the OPFS write path
      # skipping its TOCTOU guard on the strength of it. A RATCHET: the recorded
      # list may shrink, never grow.
      run: node scripts/check-unwired.mjs

    ipc-binding-callers:
      # myne#529: the layer above `unwired`. A module can have production
      # importers for its other exports while one IPC binding inside it has no
      # caller at all, and then the whole feature behind that command ships
      # inert with its ACL row, its Rust core and its tests all in place. The
      # agent's edit-format probe gate shipped exactly that way: two module docs
      # named it as the reason the anchored format may refuse a near-miss, and
      # nothing called it. A RATCHET with reason-carrying exemptions.
      run: node scripts/check-ipc-binding-callers.mjs

    export-callers:
      # The layer above `ipc-binding-callers`, and the third time the same
      # question has to be asked. `unwired` asks whether a MODULE has a
      # production importer; `ipc-binding-callers` whether a BINDING has a
      # caller. A single dead `export function` inside an otherwise live module
      # is below both, and the audit that produced this guard deleted seventeen
      # of them from files that pass the other two. Nothing else can see it: the
      # declaration compiles, this tree has no eslint (and an unused EXPORT is
      # not lintable in principle, since the file cannot know who imports it),
      # and no test can fail on something nothing calls. A per-file RATCHET whose
      # `--record` may only shrink.
      run: node scripts/check-export-callers.mjs

    tracing-discipline:
      # myne-md/myne#860: the diagnostic log's content claim, machine-checked.
      # `src-tauri/AGENTS.md`'s DENY list says about itself that it is
      # "reviewer-enforced; no automated lint", and that was affordable while
      # the sink was a terminal nobody reads. It stops being affordable the
      # moment the sink is a FILE THE USER IS INVITED TO SEND ON, so the rule is
      # now checked: no `%` Display formatter at `info` or above (the levels the
      # file layer records, so a `debug!` one cannot reach disk and is not
      # flagged), and no value interpolated into a message, which is the shape
      # no field-name rule can see. The guard's header states what it
      # deliberately does not check, and why.
      run: node scripts/check-tracing-discipline.mjs

    playwright-image:
      # myne#529: the CI Playwright image tag against the version the lockfile
      # resolves. A tag one minor behind is not a stale toolchain: the image
      # bakes browsers at a revision the installed Playwright does not ask for,
      # so every test dies in `browserType.launch` before its first assertion.
      # It shipped that way and took the whole `mobile-flow-logic` lane with it,
      # 179 tests across 44 files, red on develop and on every branch. Same
      # two-halves-pinned-by-hand shape as `e2e-toolchain` below.
      run: node scripts/check-playwright-image.mjs

    frontend-lock-teardown:
      # myne#529: the WebView half of `check-lock-teardown.mjs`, which held only
      # the Rust side. A module-scope store outlives every unmount, and neither
      # a lock nor a vault switch reloads the page, so a leaving path that skips
      # one clear leaves that store resident into the NEXT vault's session. The
      # agent's proposal, which holds note text copied verbatim, survived a
      # vault switch exactly this way while a decision entry said it could not.
      run: node scripts/check-frontend-lock-teardown.mjs

    mobile-export-backup:
      # myne#491: the mobile client writes plaintext into a device-visible
      # directory in four places (recovery phrase, vault markdown tree, note
      # PDF, exported attachment) and both platforms back that directory up by
      # default — a saved recovery phrase alone reconstructs the vault. The
      # exclusion lives across a Rust module, two Android XML resources and a
      # library manifest, so nothing compares them; this does, in both
      # directions.
      #
      # Globbed, unlike the two unglobbed guards above it: every side of this
      # property lives under mobile/, so a docs-only or protocol-only commit has
      # nothing here to break. The `run:` takes no {staged_files} — the glob
      # decides WHETHER it runs, and it still checks the whole tree when it does.
      glob: "{mobile/**,scripts/check-mobile-export-backup.mjs}"
      run: node scripts/check-mobile-export-backup.mjs

    mobile-plugin-acl:
      # myne#517: every `<plugin>:default` grant in the mobile capability
      # resolves to a permission set that exists. Deleting
      # permissions/<plugin>/default.toml leaves `cargo build` GREEN, because
      # tauri-utils maps a `<plugin>:default` with no default_permission onto an
      # EMPTY set with no error, so every command in that plugin is refused at
      # runtime and the feature is simply inert with nothing reporting it.
      #
      # Same glob shape as its neighbour above and a wider denominator: all 27
      # mobile plugin permission directories, compared both ways. Separate from
      # the export-backup guard on purpose: this is availability (a grant must
      # resolve), that one is confidentiality (plaintext must not reach a
      # platform backup).
      glob: "{mobile/**,scripts/check-mobile-plugin-acl.mjs}"
      run: node scripts/check-mobile-plugin-acl.mjs

    ios-extensions:
      # myne#803: the iOS widget + Apple Watch targets live only in the
      # committed `mobile/src-tauri/ios/project.yml`, re-applied by
      # `mobile/scripts/ios-postinit.sh` (the `tauri ios init` tree is
      # regenerated and git-ignored). A reset silently drops every native
      # extension: Myne.app ships with no PlugIns/ and no Watch/, no compiler or
      # test reports anything, and it is only visible on a device — which is how
      # the v0.8.2 TestFlight build went out phone-only. On a machine with the
      # generated project this also fails while it is unsynced, the exact
      # "ran init and forgot" state.
      #
      # Globbed like its mobile neighbours above: every side of the property is
      # under mobile/ (plus this guard), so a docs- or protocol-only commit has
      # nothing here to break.
      glob: "{mobile/**,scripts/check-ios-extensions.mjs}"
      run: node scripts/check-ios-extensions.mjs

    fdroid-metadata:
      # The F-Droid store metadata against the Android build it describes.
      # Three hand-written artefacts have to agree by arithmetic and nothing else
      # compares them: `mobile/src-tauri/tauri.conf.json`'s version, the four
      # build blocks in `mobile/fdroid/md.myne.mobile.yml`, and the four
      # `changelogs/<versionCode>.txt` names. Bump the version and nothing breaks
      # that any compiler or test can see — the store page just goes blank, and
      # four blocks sharing one versionCode drops three architectures because a
      # client installs only the highest code it can run.
      #
      # `fastlane/**` is in the glob and is not under `mobile/`, which is the
      # whole reason this cannot ride on an existing mobile guard.
      glob: "{fastlane/**,mobile/fdroid/**,mobile/src-tauri/tauri.conf.json,mobile/package.json,scripts/check-fdroid-metadata.mjs}"
      run: node scripts/check-fdroid-metadata.mjs

    store-publishable:
      # myne#896: a publishable store root may hold only frames whose surface a
      # mobile user can actually reach (Apple 2.3.1 and Play's equivalent), and
      # what is on disk must match the plan both ways. A frame is a PNG: nothing
      # in the file says which screen it came from, and nothing in the screen
      # says whether the app can reach it, so the guard compares the story
      # against two reason-carrying rosters and the fastlane directory against
      # the plan. This is the arm that catches a stale `tenInchScreenshots/`
      # frame the plan no longer writes.
      #
      # Globbed like its `fdroid-metadata` neighbour above: every input is under
      # `fastlane/**` or the store-shots library, so a protocol- or docs-only
      # commit cannot change the verdict. The `run:` takes no {staged_files}:
      # the glob decides WHETHER it runs and it sweeps the whole plan when it does.
      glob: "{fastlane/**,scripts/lib/store-shots/**,scripts/check-store-publishable.mjs}"
      run: node scripts/check-store-publishable.mjs

    store-frame-identifiers:
      # myne#896: no store frame may carry an identifier that is not pinned. A
      # listing is permanent and public, so an account number or recovery-phrase
      # specimen that reached one could never be retracted. Deliberately a SOURCE
      # check rather than OCR over the PNGs: it reads the screens the story
      # renders AND `captions.en.json`, whose strings are drawn onto the frame,
      # and fails by name on any account-number-shaped value that is not the one
      # pinned constant. Globbed to the trees those sources live in.
      glob: "{mobile/src/screens/**,mobile/src/ipad/**,mobile/src/components/**,scripts/lib/store-shots/**,scripts/check-store-frame-identifiers.mjs}"
      run: node scripts/check-store-frame-identifiers.mjs

    store-set-freshness:
      # myne#896: a committed store set must still depict the app. The frames are
      # built FROM the app, but they are committed PNGs, so a screen change with
      # no re-render drifts silently, which is the failure the hand-set it
      # replaced had. Failure for a COMMITTED set whose bytes moved without a
      # --record (bytes against bytes, no browser involved); a warning for a
      # re-render comparison, which reddens on a browser bump (the precedent is
      # `preview-freshness` below), because a byte-exact gate needs a pinned
      # browser and reddens on a font-hinting or GPU-path difference, and a
      # permanently-red gate gets routed around. `--render` launches a browser and
      # is a by-hand step; the hook runs the tree-to-record comparison with no
      # flags. Globbed like its `preview-freshness` sibling; the record it reads
      # is a committed file named in the glob so a `--record` run fires it too.
      glob: "{fastlane/**,scripts/store-shots-record.json,scripts/lib/store-shots/**,scripts/check-store-set-freshness.mjs}"
      run: node scripts/check-store-set-freshness.mjs

    twin-inventory:
      # myne#472: every desktop/mobile twin module carries a verdict, and no
      # verdict outlives its files. `check-twin-drift.mjs` (#261) warns when a
      # change touches one side and leaves the other alone, which covers a NEW
      # one-sided change and says nothing about the pairs that had already
      # drifted before anyone counted them. This is the count, and it is also
      # what makes a twin ENTERING the set fail rather than pass unnoticed,
      # which is `decisions.md` 0488's own stated failure signal mechanised.
      # Globbed, unlike `unwired` and `prefs-nonce` above, and the difference is
      # real rather than a preference: their properties can be broken by a file
      # anywhere in the repo, and every side of THIS one lives under the globbed
      # paths. A docs-only, `core/`-only, `protocol/`-only or `locales/`-only
      # commit provably cannot change the verdict, and 55% of recent develop
      # commits are one of those. The `run:` takes no {staged_files}, so the glob
      # decides WHETHER it runs and it still sweeps the whole tree when it does.
      #
      # Cost when it runs: about 82 ms end to end, of which ~57 ms is the guard's
      # own work (a walk of both trees, then a read and a normalize of each side
      # of every byte-different pair). The figure here used to read "about 11 ms
      # of I/O for the full sweep", which was the readFileSync half only and left
      # out both the walk and the comment stripper.
      #
      # `--check` also holds the generated projection to the roster. Without it
      # the "Do not edit by hand" banner on `docs/dev/twin-inventory.md` had no
      # mechanism behind it. CI runs the same `--check` in its own UNFILTERED
      # `twin-inventory` step rather than inside `pnpm-build`, because a hand
      # edit to the projection is a docs-only commit and the `code-paths` filter
      # would skip it, leaving this bypassable hook as the only gate.
      # `bundle-record` is unfiltered for the identical reason, and
      # `decisions-index` guards its generated index the same way two hooks
      # below.
      glob: "{src/**,src-tauri/src/**,mobile/**,scripts/check-twin-inventory.mjs,docs/dev/twin-inventory.md}"
      run: node scripts/check-twin-inventory.mjs --check

    twin-drift-ratchet:
      # myne#473: the recorded set of semantically-differing twin pairs may
      # shrink, never grow. The neighbour above gates the ROSTER against a
      # generated document; this one gates the TREE, so a pair that starts
      # differing fails rather than passing with an unchanged roster entry.
      # A set rather than a count, because the case that happens is one pair
      # converging while another diverges, which leaves a count unmoved.
      #
      # `core/src/**` is in the glob and the reason is worth stating, because an
      # earlier version of this comment claimed a `core/`-only commit "provably
      # cannot change the answer" and that was false: three recorded pairs have
      # their desktop side under `core/src/inference/` (engine.rs, error.rs,
      # state.rs), so a commit touching only one of those can flip a pair from
      # same to different. CI would still have caught it, but a comment that
      # asserts a property the glob does not have is worse than no comment.
      #
      # A docs-only commit genuinely cannot change it: every side of every pair
      # is code.
      glob: "{src/**,src-tauri/src/**,core/src/**,mobile/**,scripts/check-twin-inventory.mjs,scripts/check-twin-drift-ratchet.mjs,scripts/twin-drift-ratchet.json}"
      run: node scripts/check-twin-drift-ratchet.mjs

    manual-test-roster:
      # myne#548: every feature surface carries a pre-release manual-test verdict,
      # and no verdict outlives its files. The half of a release CI does not run
      # is the half nothing could describe: the desktop E2E suite is 133 files, and
      # the 301 scenarios `scripts/e2e-scenario-floor.json` requires to execute
      # all run in a Linux container against WebKitGTK,
      # so macOS desktop, Windows desktop, Safari, iOS and Android have no
      # automated UI coverage at all, and until this roster nothing in the tree
      # said so. Seven manual procedure documents existed and four were reachable
      # from no release step.
      #
      # `--check` also gates the generated `docs/dev/manual-test-roster.md`, and
      # CI runs the same invocation in its own UNFILTERED step for the reason
      # `twin-inventory` above records: a hand edit to a generated projection is a
      # docs-only commit, which the `code-paths` filter would skip, leaving this
      # bypassable hook as the only gate.
      #
      # NO GLOB, deliberately, and the measurement is the argument. Rule 1 ("no
      # verdict outlives its files") ranges over 952 distinct roster paths, and a
      # glob describing the DENOMINATOR covers 145 of them. The other 807 sit
      # outside it entirely, 579 of those under `src/notes`, `src/lib`,
      # `mobile/src`, `editor/src`, `src-tauri/src`, `core/src` and `web/src` and
      # the rest scattered wider still, so renaming any of them would break the
      # guard's opening rule with the local hook blind to it. Widening the glob until it
      # covered the rule would name most of the repository anyway, and `--check`
      # gates a generated `docs/**` file, which a docs-only commit would skip.
      # It costs 50 ms, measured, against `check-twin-inventory.mjs --check` at
      # 128 ms and `check-token-adoption.mjs` at 196 ms in this same hook.
      run: node scripts/check-manual-test-roster.mjs --check

    prefs-parity:
      # myne#880. Desktop and mobile share one `vault.prefs` blob, so a phone
      # that cannot author a value inherits whatever a computer last set, and
      # nothing compared the two clients' settings surfaces: 31 of the 76 Rust
      # prefs commands were surfaced on desktop only. The guard's denominator is
      # the RUST command roster (`core/src/plugins/prefs/commands.rs`), never a
      # client's wrapper list, because a denominator derived from a client is
      # blind to that client.
      #
      # `--check` gates the GENERATED `docs/dev/settings-parity.md`, and CI runs
      # the same invocation in its own UNFILTERED step for the reason
      # `twin-inventory` above records: a hand edit to a generated projection is
      # a docs-only commit, which the `code-paths` filter would skip, leaving
      # this bypassable hook as the only gate. Until this entry existed that
      # sentence was in the CI comment and nowhere in the hooks, so the local
      # backstop the three sibling guards all have was missing.
      #
      # The glob covers the caller trees rather than only the files the script
      # opens by name: the "is this binding reached" decision is IMPORTED from
      # `check-ipc-binding-callers.mjs`, whose `CALLERS_FOR` walks `src`,
      # `web/src`, `editor/src`, `dialect/src` and `mobile/src`. It costs ~4.4 s,
      # measured, which is why it is globbed rather than run on every commit.
      glob: "{src/**,web/src/**,editor/src/**,dialect/src/**,mobile/**,src-tauri/src/**,core/src/**,scripts/check-prefs-parity.mjs,scripts/check-ipc-binding-callers.mjs,scripts/prefs-parity.json,docs/dev/settings-parity.md}"
      run: node scripts/check-prefs-parity.mjs --check

    embed-layout-drift:
      # myne#409: the form-C embed-layout grammar is written in TypeScript
      # (canonical, source-consumed by all three clients) and, for the export
      # rewrite alone, mirrored narrowly in Rust. Both files and the decision
      # entry said the two halves were "held together by the published
      # embed-layout vectors" — and that vector step is commented out in
      # .woodpecker/main.yml pending a vectors_token secret, MYNE_VECTORS_REQUIRED
      # is set nowhere outside that comment, and both runners skip silently
      # when the companion repo is absent. So the stated lock ran on no
      # machine. This compares the one shared numeric bound, the same way
      # damm32-table-drift compares the frozen quasigroup table.
      glob: "{dialect/src/embedLayout.ts,core/src/export_naming.rs,scripts/check-embed-layout-drift.mjs}"
      run: node scripts/check-embed-layout-drift.mjs

    sync-timeout-drift:
      # Audit R0.3 (2026-10-19): the sync request deadline is written in Rust
      # (`core/src/plugins/sync/http_transport.rs::SOCKET_TIMEOUT`, 180 s since
      # myne-md/myne#222) and in the browser's blocking XHR bridge
      # (`web/src/worker/sync-transport.ts::REQUEST_TIMEOUT_MS`), which still said
      # 60 s with a comment claiming it mirrored the native value. Nothing could
      # compare them: `SOCKET_TIMEOUT` is `#[cfg(not(target_arch = "wasm32"))]`, so
      # it is not in the browser's build at all, and a wrong deadline is neither a
      # build error nor a test failure — it is "sync is slow" on a large vault.
      # Same shape as `embed-layout-drift` above: one fact, two languages.
      glob: "{web/src/worker/sync-transport.ts,core/src/plugins/sync/http_transport.rs,scripts/check-sync-timeout-drift.mjs}"
      run: node scripts/check-sync-timeout-drift.mjs

    update-channel:
      # The update channel is chosen by MYNE_UPDATE_CHANNEL and used to be named
      # in four places that could disagree, one of which did nothing at all:
      # `plugins.updater.endpoints` is REPLACED, not merged, by the updater the
      # plugin builds, so a value there was silently ignored while a reader
      # believed the reverse. The other half is that each channel's manifest
      # file name is written in Rust AND in the emitter that produces the
      # document, so moving one stops the channel updating with every gate
      # green. `check-update-channel.mjs` holds the config, the Rust table, the
      # Vite define and the About label together. It is offline and static; the
      # PUBLISHED half (both manifests reachable, beta never behind stable) is
      # `scripts/check-published-manifests.mjs`, which needs the network and
      # runs by hand from the release runbook.
      glob: "{src-tauri/tauri.conf.json,src-tauri/src/update/mod.rs,vite.config.ts,vitest.config.ts,src/components/settings/AboutPanel.tsx,scripts/emit-update-manifest.mjs,scripts/check-update-channel.mjs}"
      run: node scripts/check-update-channel.mjs

    token-adoption:
      glob: "{src,editor/src}/**/*.{ts,tsx,css}"
      # myne#394: a hardcoded visual value in an inline style is unreachable to
      # every custom theme, permanently — inline style outranks any stylesheet,
      # so there is no override. The deep-customization plan pays that debt down
      # surface by surface; this stops it regrowing at the same rate, which is
      # what would otherwise happen (no compiler or lint reports a new literal).
      # A RATCHET: a file's recorded count may fall, never rise.
      run: node scripts/check-token-adoption.mjs

    hex-helpers:
      glob: "**/*.rs,scripts/check-hex-helpers.mjs,scripts/hex-helpers.json,scripts/hex-helpers-decoders.json"
      # Audit T6.10(c) + R1.2: the lowercase-hex encoder, its predicate AND the
      # decoders were all re-derived by hand across a dozen blob families and
      # client modules, and the copies had drifted on the empty string, on
      # whether uppercase is accepted, and on whether a 32-hex id is one
      # spelling or two. `protocol/src/hex.rs` is the one contract
      # (`encode_lower`, `is_lower_hex`, `is_ascii_hex_ci`, `decode_lower`,
      # `decode_ci`); this is the shrink-only ratchet over both halves. A new
      # local `fn hex_lower` / `fn is_lower_hex` / `fn hex_decode_*` fails by
      # name.
      run: node scripts/check-hex-helpers.mjs

    target-size:
      # myne#775: WCAG 2.2 AA SC 2.5.8, the 24px pointer floor. axe has this
      # rule, but it needs LAYOUT — so it is off in the jsdom tier and in the
      # E2E tier it only sees a surface some scenario visits. A control declared
      # 18px on a screen no scenario opens is invisible to both, forever. This
      # reads the declaration instead of the rendered box.
      run: node scripts/check-target-size.mjs

    primitive-adoption:
      # myne#774: 95 files rendered a raw `<button>` against 58 importing the
      # primitive, each having re-derived padding, radius, hover, press and
      # focus by hand — so the app had as many button designs as authors. A
      # ratchet, because 150 files cannot convert in one change and a gate that
      # is red the day it lands teaches people to ignore red.
      run: node scripts/check-primitive-adoption.mjs

    tooltip-convention:
      # myne#775: the native `title=` tooltip waits ~1s, renders as an unstyled
      # OS chip that ignores the theme, clips at the window edge and never shows
      # on keyboard focus — and it had beaten the component written to replace
      # it 262 to 3. A ratchet on that, plus a HARD failure for an icon-only
      # control with no accessible name, which is WCAG 2.2 AA 4.1.2 rather than
      # a matter of polish.
      run: node scripts/check-tooltip-convention.mjs

    motion-canon:
      # myne#772 / docs/decisions/ui/0632: the motion canon, mechanised. Four
      # rules, none of which any compiler, lint or test in this tree reports —
      # a pulsing badge, an `ease-in` entrance, a 620ms hover and a `width`
      # transition on a per-frame loop all typecheck, render and pass. The
      # amendment that split motion into a restrained and an expressive tier is
      # only safe BECAUSE of this file: without it, "expressive, but only where
      # rare" is an intention, and the tree regresses to whatever the last
      # author felt like.
      run: node scripts/check-motion-canon.mjs

    token-parity:
      # myne#478: the sibling of `token-adoption` one step up, and they catch
      # opposite failures. That one asks whether a value should have been a
      # token; this one asks whether a token anybody NAMES actually exists, and
      # whether two clients declare one name independently. Its first run found
      # eight `var(--paper-1)` call sites resolving to nothing, one of them in
      # the shared `@myne/editor` package, so it reached all three clients, plus
      # 105 palette tokens mobile was missing, eight of which the shared editor
      # toolbar drew swatches from.
      #
      # Globbed, and the glob is wider than `token-adoption`'s on purpose: a
      # reference lives anywhere a component does, and the shared packages
      # (`editor`, `dialect`, `ornaments`, `client-core`) are exactly where a
      # broken one reaches every client at once.
      # The eight trees are `scripts/lib/shared-roots.mjs`'s roster, which the
      # guard IMPORTS. `copy/src` was missing from an earlier version of this
      # glob while the guard walked it, which is the drift that module exists to
      # prevent, one file over: a `var(--typo)` added to `copy/src` alone would
      # have skipped the hook and been caught only by CI.
      glob: "{src,mobile/src,web/src,editor/src,dialect/src,copy/src,ornaments/src,client-core/src}/**/*.{ts,tsx,css}"
      run: node scripts/check-token-parity.mjs
    # Unfiltered rather than globbed to `core/**`, and the reason is the one
    # `check-bundle-record` carries: the two properties that rot are a reason that
    # stops naming an OPEN issue and a roster that stops matching the tree, and a
    # docs-only commit that rewrites a decision entry's issue reference is exactly
    # when the first one goes stale.
    ignored-tests:
      run: node scripts/check-ignored-tests.mjs

    native-buttons:
      glob: "{src,web/src,editor/src,dialect/src}/**/*.tsx"
      # tokens.css has no base `button {}` rule, so a <button> with neither
      # className nor style is drawn ENTIRELY by the user agent — outset border,
      # Arial, square corners. `tsc` is happy and the token-adoption ratchet
      # scores it zero (no literals to count), so nothing else in the toolchain
      # reports it. That is how the web client's very first CTA shipped as a
      # native grey button.
      run: node scripts/check-native-buttons.mjs

    ornament-vocabulary:
      glob: "{theme-validator/src/ornament.rs,ornaments/src/*}"
      # myne#394: a value must exist in all three of theme-validator (may a theme
      # say it), ornaments/src/roles.ts (does the client reflect it) and
      # ornaments.css (does anything draw it). Missing from the third, it
      # validates, syncs, and silently does nothing.
      run: node scripts/check-ornament-vocabulary.mjs

    lock-teardown:
      # myne#454: a client that MANAGES a plaintext-derived RAM state must
      # implement the lock-teardown hook that wipes it. The failure is an empty
      # function body, which every compiler, clippy and every other guard
      # accepts — so a lock stops locking with the whole tree green. Mobile
      # shipped all three (search index / vault indices / attachment refs)
      # empty, mixing two vaults' tasks and leaving a locked vault's titles in
      # RAM.
      run: node scripts/check-lock-teardown.mjs

    e2e-menu-testid:
      # #275: an E2E scenario reaching for a testid that renders only inside an
      # open menu waits for something that is not on screen and fails as a
      # timeout — which reads like flake rather than like a stale helper.
      run: node scripts/check-e2e-menu-testids.mjs

    story-coverage:
      # myne-md/myne#832: the design-system story catalogue exists to make
      # "which screen, which state" answerable, and it stops being that the
      # moment it falls behind the tree. Nothing else notices a missing story:
      # it breaks no build and fails no type. A RATCHET over the recorded debt,
      # so the set of surfaces without a story may only shrink. Runs unfiltered
      # (no glob) because a docs-only commit can add a screen just as easily as
      # a code one, and the guard is a directory walk that costs milliseconds.
      run: node scripts/check-story-coverage.mjs

    stories-catalogue:
      # myne-md/myne#845: every story carries the description and tags the navbar
      # search reads, and no story renders a known placeholder phrase. Unfiltered
      # for the same reason as the coverage guard above.
      run: node scripts/check-story-catalogue.mjs

    story-tree:
      # myne-md/myne#847: the rail's `parent` edges are hand-written, so a guard holds
      # them to the tree. It checks that the parent exists, that the edges do not
      # cycle, and that the two modules are connected by an import in EITHER
      # direction, which is the half that catches a fabricated composition claim.
      run: node scripts/check-story-tree.mjs

    token-consumers:
      # myne-md/myne#847: a duration, ease or text token is READ somewhere outside the
      # sheet. Those three families are the ones a catalogue can only DISPLAY: a colour
      # has a swatch and a spacing step has a bar, so an unused one is visible, while a
      # duration and a size are numbers a reader takes on trust.
      run: node scripts/check-token-consumers.mjs

    story-source-map:
      # myne-md/myne#847 review: the generated surface -> source map had no caller and
      # no gate, so the branch that moved QuickPicker and Select left the rail's
      # "Show on GitHub" link pointing at the old lines and nothing reported it.
      run: node scripts/gen-story-source-map.mjs --check

    foundations-coverage:
      # myne-md/myne#845: every token in the sheet and every icon in the registry
      # has a specimen in the Foundations group. Unfiltered: a token lands in a
      # CSS file, which is exactly the commit that would otherwise skip a guard
      # scoped to TypeScript.
      run: node scripts/check-foundations-coverage.mjs

    stories-isolation:
      # myne-md/myne#832: the catalogue is a separate Vite target, so it cannot
      # enter an app bundle by construction. This is the guard on that
      # construction: the moment an app build config or a Tauri bundle manifest
      # references `stories/`, the guarantee becomes an accident. Unfiltered for
      # the same reason as `story-coverage`: the configs it reads are not the
      # files a glob would key on.
      run: node scripts/check-stories-isolation.mjs

    woodpecker-substitution:
      # A single-dollar brace token anywhere in a Woodpecker workflow file,
      # INCLUDING inside a comment, fails Woodpecker's envsubst pass and kills
      # the whole pipeline on every branch before any step runs. This guard is here
      # and not in CI because CI is what breaks: a check for "the CI config does
      # not compile" can never fire from inside CI.
      #
      # The glob is the DIRECTORY since myne-md/myne#579 split the config into
      # `main.yml` (per-push) and `e2e.yml` (manual, pre-release). `.woodpecker.yml`
      # is listed too, and it earns its place: Woodpecker's lookup takes the
      # DIRECTORY and ignores a root file, so resurrecting one produces dead
      # config that changes nothing and reports nothing. Touching it fires this
      # hook, and `scripts/lib/woodpecker-configs.mjs` then refuses outright
      # rather than scanning around it. That roster is also what makes the guard
      # fail BY NAME when a workflow file it expects has gone missing, instead of
      # reporting ok on a smaller walk.
      glob:
        - ".woodpecker/*.yml"
        - ".woodpecker/*.yaml"
        - ".woodpecker.yml"
      run: node scripts/check-woodpecker-substitution.mjs

    woodpecker-split:
      # The two workflow files duplicate ONE thing by design: the desktop
      # build's `--features` list. `main.yml`'s `tauri-compile` carries the stub
      # features purely so those compile arms cannot bit-rot while the suite that
      # consumes them runs only before a release, and that protection is real
      # only while both lists agree. Four prose blocks asserted it and nothing
      # checked it; this compares them in both directions and fails by name when
      # either build line has been renamed away.
      glob:
        - ".woodpecker/*.yml"
        - ".woodpecker/*.yaml"
      run: node scripts/check-woodpecker-split.mjs

    ci-image:
      # `ci/Dockerfile` drifting from the versions the repo pins, or the digest
      # in the workflows drifting from `ci/image.json`. Same family as
      # `e2e-toolchain` below and `playwright-image` above, and the same silence:
      # rustup honours `rust-toolchain.toml` at RUNTIME, so a stale image
      # re-provisions the pinned toolchain inside whichever step makes the first
      # cargo call rather than failing, and a stale digest reads as an
      # infrastructure outage rather than as an edit somebody made.
      glob:
        - "ci/Dockerfile"
        - "ci/image.json"
        - ".woodpecker/*.yml"
        - ".woodpecker/*.yaml"
        - "rust-toolchain.toml"
        - ".nvmrc"
        - "package.json"
      run: node scripts/check-ci-image.mjs

    e2e-toolchain:
      # e2e/Dockerfile drifting from rust-toolchain.toml. Nothing fails to build:
      # rustup just re-provisions the pinned toolchain at runtime, inside
      # whichever scenario makes the first cargo call. That is slow, and it is
      # not crash-safe — one run raced it and reported 255 FAILURES in 266 s,
      # 245 of them the same "cargo build -p e2e-fixture-gen" error wearing a
      # test's name. Invisible to every other check here.
      glob: "{e2e/Dockerfile,rust-toolchain.toml}"
      run: node scripts/check-e2e-toolchain.mjs

    twin-drift:
      # #261: a change to one side of a twin module pair. WARNING ONLY (the
      # script exits 0) — most one-sided changes are legitimate, and a gate
      # would be bypassed rather than heeded. Prints the counterpart and the
      # one line to add to the PR body. It used to skip silently where the
      # `myne-mobile` companion was not cloned — i.e. always, in CI; the mobile
      # tree is in-repo now, so it runs everywhere.
      run: node scripts/check-twin-drift.mjs {staged_files}

    preview-freshness:
      glob: "{src,editor/src,ornaments/src}/**/*.{ts,tsx,css}"
      # myne#394: the theme-preview snapshot is captured FROM this interface and
      # shown to people who have not installed Myne yet (the website builder, the
      # theme gallery). It goes stale silently — it keeps rendering, just of an
      # older app. WARNING ONLY (the script exits 0): most UI changes do not
      # change what the preview shows, and re-capturing costs a container run.
      run: node scripts/check-preview-freshness.mjs

    web-capabilities:
      # phase3-web-client task 27: the UI's capability descriptor
      # (`web/src/platform/capabilities.ts`) and the dispatcher's refusal table
      # (`web/wasm/src/capability.rs`) are two independent statements of "what
      # web cannot do". Both are necessary — the UI decides before rendering,
      # the backend must still refuse a command that arrives by a path gating
      # did not cover — but a DISAGREEMENT between them is invisible from either
      # side and breaks in both directions.
      glob: "*.{ts,rs}"
      run: node scripts/check-web-capabilities.mjs

    web-command-coverage:
      # phase3-web-client task 11: every `plugin:<x>|<y>` name in the SHARED tree
      # must be classified in `web/wasm/src/capability.rs` — dispatched, decided
      # absent on web, or a port still owed. Nothing in either compiler relates a
      # TS string literal to a Rust `match` arm, so without this the answer to
      # "which commands does the web client answer?" is a 180-call-site read.
      #
      # Deliberately NOT glob-scoped to the files that changed: the check is
      # whole-tree by nature (a command removed from `src/` makes a table entry
      # stale, and that edit touches neither the table nor a command name).
      glob: "*.{ts,tsx,rs}"
      run: node scripts/check-web-command-coverage.mjs

    cli-sidecar:
      # cli-thin-client task 11: the `myne` CLI is a separate binary with NO
      # dependency on `myne-desktop`, so the bundle identifier and the
      # socket/status basenames are duplicated on purpose — and drift between
      # the two sides compiles clean on both, then reports "app not running"
      # while the app is running. Also asserts the sidecar is still listed in
      # `bundle.externalBin`, without which the bundle ships no CLI at all.
      #
      # Whole-contract by nature (like web-command-coverage above): a rename on
      # one side never touches the other side's file.
      glob: "*.{rs,json}"
      run: node scripts/check-cli-sidecar.mjs

    mcp-tool-surface:
      # external-mcp-connection (myne-md/myne#923): the compiled MCP tool list
      # must stay a constant expression over string literals AND name no
      # capability outside the vault. `mcp/src/tools_test.rs` asserts the same
      # thing from inside the build, and that is exactly why this exists: a check
      # that only runs when somebody runs `cargo test` is a check that did not
      # run. It reads `mcp/src/tool_list.rs`, the declaration itself, never a
      # document about it.
      #
      # Globbed to the crate plus this script: the answer changes when the list
      # changes, and nowhere else. A no-fetch/no-shell/no-clipboard surface is
      # the one rule the whole feature rests on: a tool that reaches outside the
      # vault makes Myne the exfiltration path rather than the data source.
      glob: "{mcp/**,scripts/check-mcp-tool-surface.mjs}"
      run: node scripts/check-mcp-tool-surface.mjs

    clipper-identifiers:
      # The clipper's three load-bearing identifiers (myne-md/myne#558). Every
      # pairing token binds to an extension ID, and the native-messaging host
      # manifests are generated from these constants — so drift means the browser
      # refuses to start the host for an origin nobody allowlisted, and the user
      # sees "clipping does nothing" with no error on either side.
      #
      # The Chromium half is CROSS-REPO: the pinned ID is derived from the key
      # committed to `myne-clipper/src/manifest.json`, which is why nothing could
      # check it before. Where the companion is absent (a fresh clone, CI) the
      # guard REPORTS what it could not check rather than reporting ok — the
      # silent-skip failure `check-embed-layout-drift.mjs` records about the
      # published vectors.
      #
      # Whole-contract, like cli-sidecar above: a rename on one side never
      # touches the other side's file.
      glob: "*.{rs,json,md,ts}"
      run: node scripts/check-clipper-identifiers.mjs

    server-env-roster:
      # myne#787: there was no authoritative list of the sync server's environment
      # variables anywhere except the comments in its own source, so every copy was
      # hand-maintained and they drifted BOTH ways: the bundle's example file shipped
      # 8 real knobs (including MYNE_EXTENDED_RETENTION, the one self-host-policy.md
      # warns hardest about) and 2 entries nothing reads, while the live mechanism
      # was undocumented. A new knob plus a forgotten example is otherwise a green
      # tree.
      #
      # Both companions are usually ABSENT in a fresh clone, so this prints what it
      # could not check and its closing line says so rather than claiming a verdict.
      # `--require-companion` turns that into a failure for a caller that knows the
      # siblings are there.
      #
      # READ THIS BEFORE ASSUMING THE TRIGGER WORKS. The glob names extensions THIS
      # repository has. It deliberately does NOT name `.go` or `.example`: those files
      # live in two SEPARATE git repositories whose commits never enter this index, so
      # lefthook's filter would never match them and naming them would look like coverage
      # that does not exist. In practice this step fires on an unrelated edit here and
      # nothing fires when a knob is added in `myne-server` or a marker is dropped in
      # `myne-ops`. The guard is therefore a LOCAL PERIODIC CHECK, not a gate on the
      # change that would break it; the real gate on that change has to live in the
      # companions' own hooks, which this repository does not own.
      #
      # It goes GREEN only once the `myne-ops` companion PR that adds the `kind:` markers
      # and the missing entries has landed. Land that PR FIRST; this one red before it is
      # the correct behaviour, not a defect.
      glob: "*.{mjs,json,yml}"
      run: node scripts/check-server-env-roster.mjs

    selfhost-bundle-drift:
      # The self-host bundle is three files that must agree: the runnable compose in
      # `myne-ops/bundle/`, the annotated `.env` example beside it, and the user guide's copy
      # of the compose (`myne-website`). Nothing compared them.
      #
      # WRITTEN BECAUSE THE DRIFT WAS LIVE, and the severity is why it is a failure and not a
      # warning: `bundle.env.example` documented 14 `kind: server` knobs that
      # `bundle/docker-compose.yml` never forwarded into the container. Compose reads `.env` to
      # interpolate `${...}` in the compose file; it does NOT inject the file into the
      # container's environment. An operator who set `MYNE_INVITE_CODE` there, restarted, and
      # believed new-account registration was closed had done nothing at all, and neither file
      # said so. The compose now forwards every documented knob, and this rule holds it there.
      #
      # **`--emit` regenerates the guide's compose block from the bundle's file** (audit R0/A4,
      # 2026-10-19): the guide's block used to be a hand-written subset with LITERAL values, so
      # the page's own "`bundle.env.example` is the file you edit" was false and fourteen knobs
      # it documents could not reach the container. A red here whose first problem is the block
      # not matching is fixed by running the same command with `--emit`, never by editing the
      # block by hand — the next check would overwrite it.
      #
      # The trigger caveat from `server-env-roster` above applies unchanged: the inputs live in
      # two OTHER git repositories, so this fires on an unrelated edit here and nothing fires
      # when a companion breaks it. It is a local periodic check, not a gate on the change.
      glob: "*.{md,mjs,yml,yaml,json}"
      run: node scripts/check-selfhost-bundle-drift.mjs

    web-image-tag-drift:
      # Audit A5 (2026-10-19): the web client's image tag is written in the chart's
      # `values.yaml` (what the Kubernetes path deploys), in `Chart.yaml` (Helm's
      # `--version`), and in the user guide in BOTH forms on ONE page. Measured: the
      # page said `myne-web:0.8.0` in its compose block and `--version 0.8.1` in its
      # Kubernetes block, while the chart deploys `v0.8.1` — two releases, one page,
      # neither sentence wrong alone. Nothing compared them:
      # `check-referenced-digests.mjs` resolves each tag against the registry and BOTH
      # resolve, so "it resolves" is not the question; `check-release-versions.sh` (in
      # `myne-ops`) compares the repos' own manifests and never reads a guide page; and
      # a Helm `--version` is a CHART version, so no app-version rule catches the pair.
      #
      # Same companion-trigger caveat as its neighbours: the chart is in `myne-server`
      # and the guide in `myne-website`, so it is a local periodic check rather than a
      # gate on the change, and it prints NOTHING COMPARED where they are absent.
      glob: "*.{md,mjs,yml,yaml}"
      run: node scripts/check-web-image-tag-drift.mjs

    referenced-digests:
      # Every `ghcr.io` pin this project hands a self-hoster must RESOLVE, and the server image
      # must resolve to a manifest list carrying amd64 AND arm64. A transposed hex digit is
      # invisible in review and fails at an operator's `docker compose up`; a single-platform
      # tag fails only on arm64 hardware, where nothing on the amd64 path notices. Both were
      # found in the shipped tree while writing this: `:0.8.0` is one amd64 manifest, and two
      # files claimed a `v0.9.0` tag that does not exist.
      #
      # THE ONE GUARD HERE THAT NEEDS THE NETWORK, which is exactly why it is pre-commit and
      # NOT CI: a network dependency in a pipeline gate makes a red pipeline mean "GitHub was
      # slow". The release-time gate is `myne-ops/scripts/check-image-multiarch.sh`, wired into
      # the release checklist and run by the publish script. Offline, this prints COULD NOT
      # REACH and says its closing line is not a verdict rather than reporting a pass.
      glob: "*.{md,mjs,yml,yaml,json,example,toml}"
      run: node scripts/check-referenced-digests.mjs

    clipper-wire:
      # Audit Aşama 6 B4 (2026-10-19). The clipper's envelope field names and its
      # `capture_kind` / handoff-kind / reply-status literals are written in two
      # repos and were read by nothing on the extension's side. `deny_unknown_fields`
      # turns a renamed field into a hard reject and a dropped one into a silent
      # default, and a typo'd capture_kind satisfies every compiler and every test.
      #
      # The Rust<->dialect half runs UNCONDITIONALLY (both files are in this repo), so
      # this gate is real in CI; the extension half prints NOT CHECKED where
      # `myne-clipper` is absent and `--require-companion` turns that into a failure.
      glob: "*.{rs,ts,mjs}"
      run: node scripts/check-clipper-wire.mjs

    stream-timeout-drift:
      # Audit Aşama 6 B1+B2 (2026-10-19). The server heartbeats every 30 s (two
      # separate constants in `myne-server`) while the client consumes the stream
      # under one deadline, and the two blob-fetch window caps are mirrored the same
      # way. Both repos say so in prose and neither compared them: raising the
      # heartbeat past the client's timeout tears down a healthy stream, which reads
      # as a network problem rather than as a version skew.
      #
      # Same companion-trigger caveat as `server-env-roster` above: the inputs live in
      # another repository, so it is a local periodic check that prints
      # `NOTHING COMPARED` on the runner.
      glob: "*.{rs,go,mjs}"
      run: node scripts/check-stream-timeout-drift.mjs

    branding-parity:
      # Audit Aşama 6 B5+B6+B7 (2026-10-19). The app token sheet is the source for
      # three companion projections: `myne-branding`'s palette/type-scale (the brand
      # handoff), `myne-clipper`'s token sheet and icon ink, and `myne-website`'s
      # theme builder roster. Nothing read any of them, and two had already drifted:
      # the clipper carried an invented `--danger: #b54034` (5.09:1 against the panel
      # it tints, where the canon value is 7.83:1) and the builder could not
      # serialize 8 of the app's 13 highlight tokens, so an exported theme dropped
      # them silently.
      #
      # It locks only the OVERLAP (the name-pair mapping); the branding repo's ramps,
      # brand names and prose are different artefacts on purpose. Companion-only, so
      # pre-commit and never CI, like `selfhost-bundle-drift` above.
      glob: "*.{css,json,mjs,md,ts,tsx}"
      run: node scripts/check-branding-parity.mjs

    npm-license-mirror:
      # myne#527: the npm allowlist in check-npm-licenses.mjs claims, in a
      # comment, to mirror deny.toml's [licenses].allow — and it had already
      # drifted (deny.toml gained CDLA-Permissive-2.0 for webpki-roots without
      # the npm list hearing about it). Two committed files, one asserting a
      # relationship to the other in prose, and no compiler relates them.
      # Compares BOTH directions plus a reason-carrying npm-only additions
      # list, the same one-file-agreement shape as check-embed-layout-drift.
      # Pre-commit rather than CI: both inputs are committed text, so the check
      # needs no install, no network and no build.
      glob: "{deny.toml,scripts/check-npm-licenses.mjs,scripts/check-npm-license-mirror.mjs}"
      run: node scripts/check-npm-license-mirror.mjs

    adversary-coverage:
      # myne#553: the myne-range epic's anti-rot binding, in THIS repo so it
      # cannot go blind when the companion is absent (the silent-skip failure
      # check-embed-layout-drift records about the published vectors). A
      # threat-model row landing with no scenario-or-reason verdict fails the
      # commit, and so does a verdict whose row is gone. NOT globbed: the
      # projection is a docs/** file, so a hand edit to it is a docs-only
      # commit any code glob would skip, and the verdicts live in the script
      # itself.
      run: node scripts/check-adversary-coverage.mjs

    i18n-catalog:
      # Guards the i18n migration (decisions.md 2026-06-25): fails if
      # locales/en/common.json has any EMPTY English source value, or if a
      # static t("…")/i18n.t("…") key used in src/ is missing from the catalog
      # (plural-aware). Fix: `pnpm i18n:extract` then fill the English text.
      # Load-bearing copy renders from constants and is intentionally out of scope.
      glob: "*.{ts,tsx,json}"
      run: node scripts/check-i18n.mjs

    i18n-coverage:
      # The companion to i18n-catalog above, covering what that guard leaves out
      # by design: it gates the ENGLISH source only, so translation coverage can
      # fall for weeks with every gate green (myne-md/myne#589: the same 215
      # keys missing from all 31 catalogs). Three hard checks (roster parity both
      # ways, no partial plural group, placeholder parity) plus a generated
      # record, docs/dev/i18n-coverage.md, that --check compares.
      # Deliberately NOT globbed: the record is a docs/** file, so a hand edit to
      # it is a docs-only commit any code glob would skip. Regenerate with
      # `node scripts/check-i18n-coverage.mjs --emit`.
      run: node scripts/check-i18n-coverage.mjs --check

    i18n-duplicates:
      # One product fact, one string (myne-md/myne#649): fails on any UNRECORDED
      # pair of catalog entries sharing English (the drift that left 21 catalogs
      # translating the same transcription sentence twice), on a changed key set,
      # on a stale record, and on a missing/short/placeholder reason. Roster is
      # scripts/i18n-duplicate-groups.json; new intentional sharing lands via
      # `node scripts/check-i18n-duplicates.mjs --record` plus a written reason.
      glob: "*.{ts,tsx,json}"
      run: node scripts/check-i18n-duplicates.mjs --check

    decisions-index:
      # docs/decisions.md is generated over docs/decisions/**. Without this, the first person to
      # add a decision hand-edits the index, and the next regeneration silently discards it.
      # Deliberately NOT scoped to code paths: a docs-only commit is exactly when a decision lands.
      run: node scripts/decisions-index.mjs --check

    beta-terms-version:
      # The beta-terms clauses and BETA_TERMS_VERSION must move together
      # (myne-ops#15). Editing a clause without bumping the version leaves every
      # device holding an acceptance of text that no longer exists, and nothing
      # else notices: no compiler, and no test — the clauses are pinned by
      # literal equality, so a test updated alongside the text passes either way.
      glob: "{copy/src/index.ts,scripts/beta-terms-digest.json}"
      run: node scripts/check-beta-terms-version.mjs

    copy-membership:
      # Audit R0.1 (2026-10-19): `copy/src/index.ts` claimed its literals were
      # "byte-identical across clients by construction" while eighteen of them —
      # both non-distinguishing banners included — were declared in
      # `src/lib/load-bearing-copy.ts` AND `mobile/src/lib/load-bearing-copy.ts`.
      # Neither twin guard could see it: the inventory compares the two clients
      # WITH EACH OTHER and both were wrong the same way, and the drift ratchet
      # fires only on a pair that STARTS differing. This fails by naming the file
      # that declares a name the package exports.
      #
      # The glob is the client trees rather than the two files that had it: the
      # next one will be elsewhere, and the class is "a second place the value can
      # drift". `check-token-parity.mjs` above carries the same reasoning for the
      # same shape of rule.
      glob: "{src/**,mobile/src/**,web/src/**,client-core/src/**,editor/src/**,dialect/src/**,copy/src/**,ornaments/src/**,stories/src/**,scripts/check-copy-membership.mjs}"
      run: node scripts/check-copy-membership.mjs

    whitespace:
      # Excludes vendored third-party dictionary data (wooorm/dictionaries
      # Hunspell .aff/.dic + upstream license text) and the bundled AI model
      # assets (upstream Whisper config/tokenizer + Apache-2.0 license, MYND-270):
      # those carry upstream trailing whitespace / blank EOF lines / license
      # `=======` dividers that read as conflict markers — not ours to reformat
      # (hash-pinned upstream data).
      #
      # Also excludes the captured theme-preview snapshot (myne#394). It is
      # written by `e2e/capture/theme-preview.capture.ts` from the running app
      # and carries its own header saying not to hand-edit it — the CSS-in-JS
      # emitter leaves a space after `{` on nine `@keyframes` lines, and the
      # captured DOM keeps the indentation of text nodes. Reformatting it by
      # hand would be a diff the next capture silently reverts, and stripping
      # whitespace inside captured markup is not obviously safe.
      run: git diff --cached --check -- ':(exclude)src-tauri/resources/dictionaries/**' ':(exclude)src-tauri/resources/models/**' ':(exclude)preview/src/preview.html' ':(exclude)preview/src/preview.css'

    eof-newline:
      # Skips tool-generated/exported assets: Lucide icons, exported brand
      # artwork, design preview specimens, Tauri/Android icon resources,
      # vendored Hunspell dictionaries, and the bundled AI model data (upstream
      # Whisper config/tokenizer + Apache-2.0 license, MYND-270 — hash-pinned
      # upstream data). Those round-trip through external tools that don't emit
      # a trailing \n.
      #
      # Tauri plugin permission schemas are the one entry here that is rewritten
      # by a build rather than by an export: the plugin's build.rs regenerates
      # `permissions/schemas/schema.json` on EVERY `cargo build`, and emits no
      # trailing \n. Adding one by hand (9cf3207f did, to unblock hooks-parity)
      # does not hold — the next build strips it again, so the tree goes dirty
      # after any compile and the file ping-pongs forever. The generator's output
      # is what is committed; both this hook and its CI backstop skip the path.
      run: |
        fail=0
        for f in {staged_files}; do
          [ -f "$f" ] || continue
          case "$f" in
            docs/design/icons/*|docs/design/assets/*|docs/design/preview/*) continue ;;
            src-tauri/icons/*|public/*.svg) continue ;;
            src-tauri/resources/dictionaries/*) continue ;;
            src-tauri/resources/models/*) continue ;;
            */permissions/schemas/schema.json) continue ;;
          esac
          if file --mime "$f" | grep -q 'charset=binary'; then continue; fi
          if [ -n "$(tail -c1 "$f")" ]; then
            echo "missing EOF newline: $f"
            fail=1
          fi
        done
        exit $fail

    cargo-lock-singleton:
      # TB9 audit anchor: the workspace must keep a single Cargo.lock at the
      # root. The guard governs GIT-TRACKED locks — the product audit anchor is
      # the committed lockfile graph. Two classes of legitimate non-root lock
      # are gitignored and therefore correctly skipped:
      #   - protocol/fuzz — an intentionally severed tooling workspace (its own
      #     empty [workspace] table so the nightly libFuzzer toolchain stays out
      #     of the product build).
      #   - companion repos nested under this checkout (myne-server/, myne-ops/,
      #     …; all gitignored) — each is a separate repo with its own deliberate
      #     lock, never the main repo's audit anchor.
      # The mobile client USED to be the sharpest example of that second class:
      # `myne-mobile/src-tauri/Cargo.lock` shared `myne-core` and `protocol` via
      # path deps but pinned their closure in a standalone workspace lock of its
      # own, in which 62 of 572 shared crates had drifted from this one. It is a
      # member of this workspace now, governed by the root lock like every other
      # crate, which is what makes the anchor describe the mobile build too.
      # `git check-ignore` filters those out while still catching a real
      # per-crate lock SPLIT committed inside the workspace.
      run: |
        extra=$(find . -name Cargo.lock -not -path './target/*' -not -path './node_modules/*' -not -path './Cargo.lock' 2>/dev/null \
          | while read -r f; do git check-ignore -q "$f" || echo "$f"; done)
        if [ -n "$extra" ]; then
          echo "extra Cargo.lock files outside workspace root:"
          echo "$extra"
          exit 1
        fi

    secret-scan:
      # Two tiers, because the one-tier version this replaces missed the secret
      # that actually got committed in the myne-agents companion: a
      # PLANE_API_KEY in a committed JSON manifest matched none of PEM / AKIA /
      # aws_secret_access_key and sat in the tree for months. A guard whose only
      # real test it failed is worth rewriting rather than trusting. The `run:`
      # block below is kept byte-identical to the myne-agents copy so the two
      # cannot drift; only these comments are repo-specific.
      #
      #   tier 1 — vendor-prefixed tokens. The shape alone identifies them, so
      #            there is no escape hatch: a hit is a hit.
      #   tier 2 — a credential-ish NAME assigned a high-entropy VALUE. This is
      #            the tier that catches the Plane-shaped key, and the tier that
      #            no threshold can make precise. Measured, not assumed: this
      #            repo deliberately ships high-entropy test needles
      #            (e2e/AGENTS.md requires the plaintext-residue markers be
      #            single alnum tokens >=24 chars, tokenizer-survivable) and
      #            they are indistinguishable from an API key by length, digit
      #            count and character variety alike. So tier 2 carries an
      #            ESCAPE HATCH instead of a tighter threshold: a line carrying
      #            `secret-scan:allow`, on itself or the line above, is skipped.
      #            That puts every exemption in the diff where a reviewer sees
      #            it, instead of in a path list nobody re-reads.
      #
      # Matches are MASKED in the output. A guard that echoes the secret into a
      # terminal scrollback or a CI log has leaked it a second time.
      #
      # Measured against the whole tracked tree when it landed: 80 hits under a
      # naive length-only rule, 9 under the entropy rule, 1 after the pragmas.
      # That 1 is e2e-web/fixtures/unlockable-vault.json — JSON carries no
      # comment, so it cannot hold a pragma and will fire whenever that fixture
      # is staged. Confirm the value is fixture data and commit with --no-verify,
      # or move the credential out of the fixture.
      #
      # Still a cheap last-line guard, not real secret scanning. gitleaks would
      # do this properly with a maintained ruleset; that is a dependency
      # decision (see docs/dependency-policy.md), not a hook edit.
      run: |
        vendor='BEGIN [A-Z ]*PRIVATE KEY|AKIA[A-Z0-9]{16}|gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{20,}|xox[abprs]-[A-Za-z0-9-]{10,}|glpat-[A-Za-z0-9_-]{18,}|sk-[A-Za-z0-9]{20,}|plane_api_[A-Za-z0-9_-]{20,}'
        fail=0
        for f in {staged_files}; do
          [ -f "$f" ] || continue
          if file --mime "$f" | grep -q 'charset=binary'; then continue; fi

          hits=$(grep -nE "$vendor" "$f")
          if [ -n "$hits" ]; then
            echo "secret-scan: vendor-prefixed credential in $f"
            printf '%s\n' "$hits" | sed -E 's|[A-Za-z0-9+/=_-]{12,}|********|g'
            fail=1
          fi

          hits=$(awk '
            function digits(s,  t){ t=s; return gsub(/[0-9]/,"",t) }
            function letters(s,  t){ t=s; return gsub(/[A-Za-z]/,"",t) }
            {
              cur = $0
              if (cur ~ /secret-scan:allow/ || prev ~ /secret-scan:allow/) { prev = cur; next }
              if (tolower(cur) ~ /(api[_-]?key|apikey|secret|token|password|passwd|credential)[^[:alnum:]]{0,2}[[:space:]]*[:=]/) {
                line = cur
                while (match(line, /[A-Za-z0-9+\/=_-]{24,}/)) {
                  tok = substr(line, RSTART, RLENGTH)
                  line = substr(line, RSTART + RLENGTH)
                  if (digits(tok) >= 2 && letters(tok) >= 2) { print FNR ":" cur; break }
                }
              }
              prev = cur
            }' "$f")
          if [ -n "$hits" ]; then
            echo "secret-scan: credential-shaped assignment in $f"
            printf '%s\n' "$hits" | sed -E 's|[A-Za-z0-9+/=_-]{16,}|********|g'
            echo "  If this is a fixture or a test constant, mark the line 'secret-scan:allow'."
            fail=1
          fi
        done
        exit $fail

pre-push:
  # Heavier checks — matches AGENTS.md's "Common commands" baseline.
  # Local pre-push net; Woodpecker CI (.woodpecker/) is the remote gate.
  parallel: false
  # A target directory of the hook's OWN, and the reason is a real failure that
  # cost four pushes: `cargo-test` went red twice in a row while the identical
  # command passed locally three times, once taking 165 s instead of the usual
  # 75 s.
  #
  # These steps already run SERIALLY (`parallel: false`), so the collision is
  # not between them — it is between the hook and the developer. A `cargo` or
  # `cargo test` run in another terminal while a push is in flight shares
  # `target/`, and two cargos in one directory produce exactly this shape:
  # long waits on the build lock, and ghost failures against a tree that is
  # clean (see the repo-root AGENTS.md gotcha on shared-target collisions). It
  # is most likely precisely when someone is iterating — which is when they push.
  #
  # `target/pre-push` costs one more build directory and one cold build the
  # first time. Both are cheaper than a gate that fails for reasons unrelated to
  # the commit, because a gate that cries wolf gets bypassed with `--no-verify`,
  # and then it is not a gate.
  #
  # It is set PER COMMAND rather than once on the hook: lefthook does not honour
  # a hook-level `env:`. Verified rather than assumed — with it declared up here
  # the command ran and `target/pre-push` was never created, which is exactly
  # the shape of fix that looks applied and does nothing.
  commands:

    protected-branch:
      # Refuse a push whose REMOTE ref is a protected branch. There is no
      # server-side branch protection to lean on: the org's plan does not offer
      # it for private repos, and all eleven are private (measured against the
      # API, not inferred from a repo's own prose). So nothing on GitHub sits
      # between a mistyped `git push` and a branch that matters.
      # Measurements and context: myne-md/myne#592.
      #
      # This stops an ACCIDENT, not an intent, and the distinction is the whole
      # honest claim. Three doors bypass it and none can be closed from here:
      # `--no-verify`, `LEFTHOOK=0` (which line 3 of this file recommends) and
      # `LEFTHOOK_EXCLUDE=protected-branch`. On top of that the hook exists only
      # where `lefthook install` has been run, so a fresh clone, the jailed
      # unattended runner and `myne-bot` are not covered. Hygiene, not
      # enforcement, and no substitute for server-side protection.
      #
      # `priority: 1` because lefthook sorts commands ALPHABETICALLY rather than
      # in file order (verified, not assumed), so without it this would run
      # somewhere in the middle of a repo's battery instead of at the front.
      #
      # Be precise about what that buys, because the obvious reading is wrong:
      # it makes the refusal PRINT first, and nothing more. There is no
      # `piped: true` on this hook, so every remaining command still runs to
      # completion before git aborts the push. Interrupt rather than wait.
      # `piped: true` would give real fail-fast and was rejected deliberately:
      # in a repo with a heavy battery the command that sorts first after this
      # one carries that repo's slowest and flakiest tests, so piping would let
      # one flake suppress every gate behind it on every push. That is a
      # permanent cost for an occasional convenience.
      priority: 1
      # `use_stdin: true` is LOAD-BEARING and losing it is SILENT. Without it
      # the command receives empty stdin, the loop below runs zero times, and
      # lefthook prints a green tick while the push to `develop` goes through.
      # Verified by deleting the line and watching exactly that happen.
      #
      # Two things now stand between that and a dead guard. The `min_version`
      # at the top of this file makes an older lefthook refuse the config
      # outright rather than drop the key, which matters because `lefthook run`
      # and the real `git commit`/`git push` path IGNORE an unknown key without
      # a word (only `lefthook validate` rejects one, and hooks never call it).
      # And the pass line below prints the ref count, so a guard that received
      # nothing says `checked 0 ref(s)` instead of looking like a clean push.
      use_stdin: true
      # Matched on the REMOTE ref, never on the current branch name: the
      # accident's usual shape is `git push origin HEAD:develop` from a feature
      # branch, and a branch-name check misses it entirely. A deletion
      # (`git push origin :develop`) carries the same remote ref and is caught
      # on the same line.
      #
      # All three names in every repo, so the block stays byte-identical across
      # all of them and can be diffed rather than re-read. `develop` is the
      # default in nine and `main` in `homebrew-tap`, while `myne-themes`
      # carries both. `release` is here because it is the branch that DEPLOYS:
      # `myne-website`'s own `.woodpecker.yml` maps `release` to production and
      # `develop` to staging, so guarding only `develop` would have protected
      # the branch with no blast radius and skipped the one that publishes.
      run: |
        n=0
        blocked=""
        while read -r _local_ref _local_sha remote_ref _remote_sha; do
          n=$((n + 1))
          case "$remote_ref" in
            # The leading space is deliberate: the messages below interpolate
            # `$blocked` straight after a word, so adding one there doubles it.
            refs/heads/develop|refs/heads/main|refs/heads/release)
              blocked="$blocked $remote_ref" ;;
          esac
        done
        if [ -z "$blocked" ]; then
          # Printed on every clean push on purpose. `checked 0 ref(s)` is the
          # visible symptom of a guard that got no stdin, which is otherwise
          # indistinguishable from a guard that looked and found nothing.
          echo "protected-branch: checked $n ref(s), none protected"
          exit 0
        fi
        # Two ways to allow it. The env var is for a one-off. The git-config
        # flag is for a repo whose normal workflow IS pushing to its default
        # branch, so that such a repo does not push someone into exporting the
        # env var from their shell profile, which would switch the guard off in
        # every other clone at once.
        #
        # `--local` is what makes that true and a plain `--get` would not:
        # `--get` reads the MERGED cascade, so one `--global` flag would disable
        # the guard everywhere and reintroduce the exact failure this hatch
        # exists to prevent. `--local` reads only this repo's own .git/config.
        # Verified in both directions.
        #
        # Both hatches parse a VALUE rather than test for presence, and they
        # agree on what "allow" means. Testing `-n` would have let
        # `MYNE_ALLOW_PROTECTED_PUSH=0` and `=false` open the gate, which is the
        # opposite of what someone typing that means, while the git-config side
        # rejected the same literals. An unrecognised value refuses: this fails
        # closed, like every other decision in this block.
        allow=no
        case "$(printf '%s' "${MYNE_ALLOW_PROTECTED_PUSH:-}" | tr 'A-Z' 'a-z')" in
          1|true|yes|on) allow=yes ;;
        esac
        if [ "$(git config --local --bool --get myne.allowProtectedPush 2>/dev/null)" = true ]; then
          allow=yes
        fi
        if [ "$allow" = yes ]; then
          echo "protected-branch: allowed$blocked"
          exit 0
        fi
        echo "protected-branch: refusing a direct push to$blocked"
        echo "  Push a branch and open a pull request instead."
        echo "  One-off:        MYNE_ALLOW_PROTECTED_PUSH=1 git push ..."
        echo "  This repo does not use PRs:  git config myne.allowProtectedPush true"
        exit 1

    damm32-table-drift:
      # MYND-74: the frozen Damm-32 quasigroup table is generated into two
      # sentinel-delimited regions — the DAMM32_TABLE const in
      # protocol/src/account_number.rs and the §4.2 block in
      # docs/spec/account-number.md. Regenerate and compare; fail on drift so
      # the two representations can never diverge from the construction.
      #
      # Division of labor: the const's *values* are already locked to the
      # runtime by the ordinary unit test `damm32_table_matches_runtime_construction`
      # (runs under `cargo-test` below). This hook owns what no `cargo test` can
      # reach — the *textual* sync of both sentinel blocks (const formatting +
      # the .md spec block) against the generator output. Migrate to Woodpecker
      # CI when it lands.
      #
      # Globbed to the only two places the drift can be authored: the const and
      # its generator live together in `account_number.rs`, and the spec block
      # is the file's §4.2 table. A push touching neither cannot change the
      # answer and does not pay the protocol test compile.
      glob: "{protocol/src/account_number.rs,docs/spec/account-number.md}"
      env:
        CARGO_TARGET_DIR: target/pre-push
      run: |
        set -e
        cargo test -p protocol --lib emit_damm32_table_for_paste -- --ignored >/dev/null 2>&1
        # Anchor on the real sentinel lines (start with `//` or `<!--`), not the
        # same substring inside the generator's string literals further down.
        extract() { awk '/^(\/\/|<!--).*BEGIN GENERATED damm32-table/{f=1} f{print} /^(\/\/|<!--).*END GENERATED damm32-table/{if(f)exit}' "$1"; }
        fail=0
        if ! extract protocol/src/account_number.rs | diff -u - /tmp/myne_damm32_table_const.rs; then
          echo "DRIFT: protocol/src/account_number.rs DAMM32_TABLE const differs from the generator."
          fail=1
        fi
        if ! extract docs/spec/account-number.md | diff -u - /tmp/myne_damm32_table_spec.md; then
          echo "DRIFT: docs/spec/account-number.md §4.2 table block differs from the generator."
          fail=1
        fi
        if [ "$fail" -ne 0 ]; then
          echo "Fix: cargo test -p protocol --lib emit_damm32_table_for_paste -- --ignored"
          echo "     then paste /tmp/myne_damm32_table_const.rs (const) and /tmp/myne_damm32_table_spec.md (spec §4.2)."
        fi
        exit $fail

    clippy:
      # Globbed: only a Rust or toolchain change can move the lint result, so a
      # docs-only or TS-only push skips the workspace clippy rebuild. The same
      # applies to `cargo-test` below, which shares the target and the reason.
      #
      # TWO patterns, and the root one is load-bearing rather than tidy:
      # lefthook's `**/` matches ONE OR MORE directories, so `**/*.toml` misses
      # the root `Cargo.toml` / `rust-toolchain.toml` / `Cargo.lock` entirely.
      # Verified against 2.1.15 by injection: a root `Cargo.lock` change skipped
      # this command under the single `**/*` pattern.
      glob:
        - "*.{rs,toml,lock}"
        - "**/*.{rs,toml,lock}"
      env:
        CARGO_TARGET_DIR: target/pre-push
      run: cargo clippy --workspace --all-targets -- -D warnings

    # `clippy-wasm`, `test-web-wasm` and `desktop-ai-free` used to sit here.
    # All three moved to CI-ONLY deliberately: each is exactly, or strictly
    # dominated by, a step `.woodpecker/main.yml` already runs —
    # `wasm-protocol` carries both wasm clippys and `cargo test -p
    # myne-web-wasm` (main.yml:232-254), and `tauri-compile` carries
    # `cargo clippy -p myne-desktop --all-targets --no-default-features`
    # (main.yml:841), which is strictly stronger than the `cargo check
    # --no-default-features` this file used to run. `cargo test --workspace`
    # below covers the web-wasm test crate locally too, so nothing here lost a
    # local gate; the three were the redundant, and slowest-throughput, half of
    # the battery.

    cargo-test:
      glob:
        - "*.{rs,toml,lock}"
        - "**/*.{rs,toml,lock}"
      env:
        CARGO_TARGET_DIR: target/pre-push
      run: cargo test --workspace

    pnpm-build:
      # Globbed to the trees `pnpm build` actually compiles. A Rust-only or
      # docs-only push cannot change the bundle, so it skips the Vite/tsc pass.
      # The root pattern is not decoration: lefthook's `**/` matches one-or-more
      # directories, so the root `package.json` / `vite.config.ts` /
      # `tsconfig.json` / `index.html` need `*.{…}` beside `**/*.{…}`.
      glob:
        - "*.{ts,tsx,js,jsx,mts,cts,json,html,css}"
        - "**/*.{ts,tsx,js,jsx,mts,cts,json,html,css}"
      run: pnpm build

    # `vitest` used to run here: the whole suite, 1 024 files, on every push that
    # touched a JS file. It was removed deliberately, not by accident.
    #
    # What it cost: four to five minutes of laptop per push to re-run what
    # `.woodpecker/main.yml` runs anyway, on a machine that is not the one that
    # ships the artefact. And it was unreliable under exactly the load pre-push
    # creates: `tests/scripts/hexHelpers.test.ts` shells out over every Rust file
    # in the checkout and blew past vitest's default timeout twice, while the same
    # suite passed standalone minutes earlier. A gate that fails on the machine
    # rather than on the code teaches people to bypass gates, and twice here it
    # did: `LEFTHOOK_EXCLUDE=vitest git push`.
    #
    # What replaces it: CI on `develop`, which is where the suite ran the whole
    # time and where a red result belongs. The cost is real and worth stating:
    # a broken JS test now surfaces after the push instead of before it. Run
    # `pnpm test` by hand before a push you are unsure about; it is the same
    # command the hook used.

# Reject accidental AI co-author / attribution trailers in commit messages
# (project policy — see root guidance). Lefthook passes the commit-message
# file path as {1}.
commit-msg:
  commands:
    require-signoff:
      # DCO (CONTRIBUTING.md): every commit carries a `Signed-off-by:` trailer, which
      # is what makes the certification in the pull-request template a statement the
      # contributor actually made. Merge commits are exempt: git writes their message
      # and there is no authorship decision in it.
      run: |
        if head -1 "{1}" | grep -q '^Merge '; then exit 0; fi
        if sed -e '/^#.*>8/,$d' "{1}" | git stripspace --strip-comments | grep -qE '^Signed-off-by: .+ <.+@.+>'; then
          exit 0
        fi
        echo "commit message has no 'Signed-off-by:' trailer. This project uses the DCO (CONTRIBUTING.md)."
        echo "  Fix the last commit:   git commit --amend -s"
        echo "  Fix the whole branch:  git rebase --signoff origin/develop"
        exit 1

    no-ai-coauthor:
      run: |
        # The message file still holds git's `#` comment block at hook time,
        # and anything below the scissors line, so a raw grep refuses a commit
        # whose only match sits in text git is about to throw away. Both cases
        # were measured refusing before this. Cut at the scissors marker, drop
        # comment lines, then grep what actually reaches the commit.
        if sed -e '/^#.*>8/,$d' "{1}" | git stripspace --strip-comments | grep -qiE 'Co-Authored-By:.*(Claude|Anthropic)|Generated with .*Claude|🤖 Generated'; then
          echo "commit message carries an AI co-author/attribution trailer. Remove it (project policy)."
          exit 1
        fi
