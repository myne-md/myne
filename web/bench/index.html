<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Myne web benchmark</title>
    <style>
      body {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        max-width: 46rem;
        margin: 3rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      pre {
        background: #f6f6f4;
        padding: 1rem;
        border-radius: 6px;
        overflow-x: auto;
      }
      .bad {
        color: #a3161b;
      }
    </style>
  </head>
  <body>
    <h1>Myne web benchmark</h1>
    <p>
      Argon2id at the v0.1 baseline (<code>m=256 MiB, t=3, p=2</code>) and OPFS
      throughput, measured in a Worker — the only place
      <code>createSyncAccessHandle</code> exists, and therefore the only place
      that measures what the client actually does.
    </p>
    <p id="status">Running…</p>
    <pre id="out"></pre>
    <script type="module">
      const out = document.getElementById("out");
      const status = document.getElementById("status");

      if (!crossOriginIsolated) {
        status.innerHTML =
          '<span class="bad">Not cross-origin isolated.</span> Serve this with ' +
          "COOP <code>same-origin</code> + COEP <code>require-corp</code> — " +
          "<code>node scripts/bench-web.mjs</code> does. Numbers taken without " +
          "isolation are not comparable to the app's, which always runs isolated.";
      }

      // The Phase 0 baseline, so a re-run is comparable to the measurement the
      // spec cites rather than to nothing (`spike-phase0.md` §1).
      const PHASE0 = { chrome: 1.13, safari: 1.35, firefox: 1.65 };

      /** The native reference, when this run measured one. Absent is a normal
       *  state (`bench-web.mjs` without `--native`), not an error. */
      async function nativeReference() {
        try {
          const res = await fetch("/native.json", { cache: "no-store" });
          return res.ok ? await res.json() : null;
        } catch {
          return null;
        }
      }

      const worker = new Worker("./worker.js", { type: "module" });
      worker.onmessage = async (e) => {
        const r = e.data;
        if (r.ok) {
          const native = await nativeReference();
          if (native) {
            r.native = native;
            // THE number. Phase 0's conclusion is that milliseconds belong to
            // the machine and the ratio transfers, so it is computed here and
            // shown beside the baseline band rather than left to the reader.
            r.wasm_over_native = +(r.kdf.median_ms / native.median_ms).toFixed(2);
            r.phase0_baseline_ratios = PHASE0;
            r.within_phase0_band =
              r.wasm_over_native >= PHASE0.chrome - 0.15 &&
              r.wasm_over_native <= PHASE0.firefox + 0.35;
          } else {
            r.wasm_over_native = null;
            r.note =
              "no native reference this run — re-run `node scripts/bench-web.mjs --native` " +
              "for the ratio, which is the number that transfers between machines";
          }
        }
        // Published for a driver to read without scraping the DOM.
        window.__BENCH_RESULT = r;
        out.textContent = JSON.stringify(r, null, 2);
        status.textContent = r.ok
          ? r.wasm_over_native
            ? `Done — wasm/native ${r.wasm_over_native}× (Phase 0 band: 1.13–1.65×).`
            : "Done — milliseconds only, no native reference this run."
          : "Failed.";
        if (!r.ok) status.className = "bad";
      };
      worker.postMessage({});
    </script>
  </body>
</html>
