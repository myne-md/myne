name: Bug report
description: Something in the iOS or Android client is broken.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. First:

        - **Security issues do not go here.** Cryptography, key handling, recovery, sync integrity, or keychain/Keystore issues go to **security@myne.md** privately — see [SECURITY.md](https://github.com/myne-md/myne/blob/main/SECURITY.md).
        - **Search first**, and **never paste note content, your account number, your master password, or your recovery phrase.**
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS
        - Android
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device model
      placeholder: "e.g. iPhone 15 Pro, Pixel 8, Samsung Galaxy S24"
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "e.g. iOS 18.5, Android 15 (One UI 7)"
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version / build
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: How did you install it?
      options:
        - TestFlight
        - App Store
        - APK sideload
        - Google Play
        - Built from source
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Screenshots, screen recording, or logs
      description: Redact anything sensitive.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this isn't a duplicate.
          required: true
        - label: This is not a security vulnerability (those go privately to security@myne.md).
          required: true
        - label: I have not included any note content, account number, password, or recovery phrase.
          required: true
