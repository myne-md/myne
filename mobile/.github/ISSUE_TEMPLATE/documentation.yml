name: Documentation
description: The mobile README or a setup / build doc is wrong, unclear, or missing.
title: "[Docs]: "
labels: [documentation]
body:
  - type: markdown
    attributes:
      value: |
        The protocol, threat model, and on-disk format are defined once in the main repo's [`docs/`](https://github.com/myne-md/myne/tree/main/docs) and shared by every client. Mobile-specific build notes live in this repo's `CLAUDE.md` / `README.md`.
  - type: input
    id: where
    attributes:
      label: Which document or page?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong or missing?
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested fix
