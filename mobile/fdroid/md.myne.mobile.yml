    prebuild:
      - sed -i '/"packageManager"/d' package.json mobile/package.json
      - sed -i 's|\.toInt()$|.toInt() * 10 + 3|' mobile/src-tauri/gen/android/app/build.gradle.kts
    build:
      - export PATH="$HOME/.cargo/bin:$PATH"
      - export ANDROID_HOME=$$SDK$$
      - export NDK_HOME=$$NDK$$
