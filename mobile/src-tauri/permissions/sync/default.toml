# Permissions for the in-app `sync` Tauri plugin (MYND-424/458, Phase 2 client
# sync engine — mobile shim). Picked up under the `sync:` ACL namespace because
# `build.rs` declares this as an `InlinedPlugin`. Capability files reference these
# as `sync:default` (or `sync:allow-sync-get-endpoint` /
# `sync:allow-sync-set-endpoint`). Ported from the desktop
# `src-tauri/permissions/sync/default.toml`: the same desktop commands
# (MYND-459 T12 added `sync_head_fingerprint`, the SY-05 SAS eye-compare
# substrate) PLUS the mobile-only lifecycle pair (`sync_lifecycle_suspend` /
# `sync_lifecycle_resume` — in-RAM scheduler flag flips driven by the WebView's
# visibilitychange; desktop never manages the signal so it does not register
# them). 30 commands total (the recovered-notes quarantine quartet:
# `sync_list_quarantine` / `sync_read_quarantine` / `sync_restore_quarantine` /
# `sync_delete_quarantine` — is registered for parity even though the mobile UI
# does not surface it yet).
#
# Deny-by-default (SYNC-15): the data-plane commands (push/pull/sync-now/status)
# each get their own `commands.allow` entry AND remain gated on an authenticated
# session inside the shared core. The endpoint-config pair is intentionally
# reachable pre-auth (an operator configures the server before unlocking/
# enrolling) but moves no vault bytes. Main-window-only, like every other vault
# plugin.

"$schema" = "../../gen/schemas/desktop-schema.json"

[default]
description = "Default permission set for the sync plugin — endpoint config (SYNC-14) + read-only status / manual-trigger affordances. No data-plane blob access."
permissions = [
    "allow-sync-get-endpoint",
    "allow-sync-set-endpoint",
    "allow-sync-status",
    "allow-sync-now",
    "allow-sync-person-unlock",
    "allow-sync-person-lock",
    "allow-sync-invite-member",
    "allow-sync-list-roster",
    "allow-sync-remove-member",
    "allow-sync-list-devices",
    "allow-sync-account-status",
    "allow-sync-approve-device",
    "allow-sync-remove-device",
    "allow-sync-pending-conflicts",
    "allow-sync-take-conflict",
    "allow-sync-resolve-conflict",
    "allow-sync-mark-tombstone",
    "allow-sync-enroll",
    "allow-sync-join-account",
    "allow-sync-reset-local",
    "allow-sync-head-fingerprint",
    "allow-sync-verify-hold-begin",
    "allow-sync-verify-hold-end",
    "allow-sync-list-quarantine",
    "allow-sync-read-quarantine",
    "allow-sync-restore-quarantine",
    "allow-sync-delete-quarantine",
    "allow-sync-lifecycle-suspend",
    "allow-sync-lifecycle-resume",
    "allow-sync-decode-join-qr",
]

[[permission]]
identifier = "allow-sync-get-endpoint"
description = "Allow invoking sync:sync_get_endpoint (read the device-local sync endpoint config from app_config_dir/sync-config.json; absent → unconfigured). No vault access, no native side-effect."
commands.allow = ["sync_get_endpoint"]

[[permission]]
identifier = "allow-sync-set-endpoint"
description = "Allow invoking sync:sync_set_endpoint (validate against the A4/TB5 https-or-loopback policy, then atomic-write the device-local sync endpoint config). No vault access."
commands.allow = ["sync_set_endpoint"]

[[permission]]
identifier = "allow-sync-status"
description = "Allow invoking sync:sync_status (read-only current sync status for the status indicator: disabled / idle / syncing / error / conflicts). No vault access."
commands.allow = ["sync_status"]

[[permission]]
identifier = "allow-sync-now"
description = "Allow invoking sync:sync_now (request an immediate sync; returns the resulting status). No new vault access beyond the engine's authed session."
commands.allow = ["sync_now"]

[[permission]]
identifier = "allow-sync-person-unlock"
description = "Allow invoking sync:sync_person_unlock (B2B: derive-or-open the person keypair from the recovery phrase and hold it backend-side)."
commands.allow = ["sync_person_unlock"]

[[permission]]
identifier = "allow-sync-person-lock"
description = "Allow invoking sync:sync_person_lock (B2B: drop the backend-held person identity)."
commands.allow = ["sync_person_lock"]

[[permission]]
identifier = "allow-sync-invite-member"
description = "Allow invoking sync:sync_invite_member (B2B invite: wrap the unlocked vault's itemsKey to the member's person public half and sign with the held owner identity)."
commands.allow = ["sync_invite_member"]

[[permission]]
identifier = "allow-sync-list-roster"
description = "Allow invoking sync:sync_list_roster (B2B: unseal the membership roster extension and return the non-tombstoned member rows)."
commands.allow = ["sync_list_roster"]

[[permission]]
identifier = "allow-sync-remove-member"
description = "Allow invoking sync:sync_remove_member (B2B: rotate the vault itemsKey, re-wrap every note and attachment, tombstone the removed member, re-seal vault.meta)."
commands.allow = ["sync_remove_member"]

[[permission]]
identifier = "allow-sync-list-devices"
description = "Allow invoking sync:sync_list_devices (authed device roster from GET /auth/devices). No vault-blob access."
commands.allow = ["sync_list_devices"]

[[permission]]
identifier = "allow-sync-account-status"
description = "Allow invoking sync:sync_account_status (authed read-only projection from GET /account/status — this account's own stored bytes, device count, frozen flag and EFFECTIVE ceilings. Account is resolved from the device token, never a URL/query selector; no vault-blob access, no cross-account data)."
commands.allow = ["sync_account_status"]

[[permission]]
identifier = "allow-sync-approve-device"
description = "Allow invoking sync:sync_approve_device (authed: approve a pending device, POST /auth/devices/approve)."
commands.allow = ["sync_approve_device"]

[[permission]]
identifier = "allow-sync-remove-device"
description = "Allow invoking sync:sync_remove_device (authed: revoke a device's token, POST /auth/devices/revoke; device_id untouched, SYNC-2)."
commands.allow = ["sync_remove_device"]

[[permission]]
identifier = "allow-sync-pending-conflicts"
description = "Allow invoking sync:sync_pending_conflicts (list the note ids with a staged conflicting remote revision awaiting keep-both materialization). No vault-blob access beyond the device-local conflicts staging dir."
commands.allow = ["sync_pending_conflicts"]

[[permission]]
identifier = "allow-sync-take-conflict"
description = "Allow invoking sync:sync_take_conflict (decrypt a staged conflicting remote revision to its plaintext body so the notes layer can materialize a keep-both copy; requires the unlocked vault's items_key)."
commands.allow = ["sync_take_conflict"]

[[permission]]
identifier = "allow-sync-resolve-conflict"
description = "Allow invoking sync:sync_resolve_conflict (adopt the staged remote revision as the synced baseline + clear staging, so the local edit pushes as a linear advance)."
commands.allow = ["sync_resolve_conflict"]

[[permission]]
identifier = "allow-sync-mark-tombstone"
description = "Allow invoking sync:sync_mark_tombstone (queue a deletion's note id so the next push sets the server tombstone flag for horizon-GC). Touches only the device-local pending-tombstone queue; no vault-blob access."
commands.allow = ["sync_mark_tombstone"]

[[permission]]
identifier = "allow-sync-enroll"
description = "Allow invoking sync:sync_enroll (new-device enrollment: fetch vault.meta pre-auth, derive root_key from {account#+password/phrase}, SCRAM-enroll, store the per-device token)."
commands.allow = ["sync_enroll"]

[[permission]]
identifier = "allow-sync-join-account"
description = "Allow invoking sync:sync_join_account (add this device to an existing account: TOFU-pin the endpoint, fetch vault.meta pre-auth, bootstrap a NEW local vault from {account#+password}, unlock it, SCRAM-enroll password-path → pending). Materializes a vault dir; gated on the same A4/TB5 transport policy."
commands.allow = ["sync_join_account"]

[[permission]]
identifier = "allow-sync-reset-local"
description = "Allow invoking sync:sync_reset_local (reset this device's sync enrollment locally: clear the device-local per-device token + sync baseline (sync-state.json + vault.head-state) for the active vault so a stale/rejected token can be re-enrolled). NEVER touches notes/attachments/vault.meta and makes no server call."
commands.allow = ["sync_reset_local"]

[[permission]]
identifier = "allow-sync-head-fingerprint"
description = "Allow invoking sync:sync_head_fingerprint (return the 8-char Crockford XXXX-XXXX SAS fingerprint of this device's currently adopted vault head, read from the device-local sync-state's latest head observation; None when no head is adopted yet). The out-of-band enroll-time eye-compare substrate (SYNC-17); returns no key material and makes no server call — reveals only the already-server-visible head_id, one-way-hashed to ~40 bits."
commands.allow = ["sync_head_fingerprint"]

[[permission]]
identifier = "allow-sync-list-quarantine"
description = "Allow invoking sync:sync_list_quarantine (list the quarantined note blobs the reconcile drop-leg moved to the device-local quarantine/ dir — file name, suffix-stripped note id, size, device-local mtime). Decrypt-free; no vault-blob access beyond the quarantine dir listing."
commands.allow = ["sync_list_quarantine"]

[[permission]]
identifier = "allow-sync-read-quarantine"
description = "Allow invoking sync:sync_read_quarantine (decrypt ONE quarantined note blob to its plaintext body for the Recovered-notes preview; file name validated against the strict <uuid>[-<n>].myn shape — path traversal rejected). Requires the unlocked vault's items_key."
commands.allow = ["sync_read_quarantine"]

[[permission]]
identifier = "allow-sync-restore-quarantine"
description = "Allow invoking sync:sync_restore_quarantine (restore a quarantined note blob as a NEW note — fresh UUIDv7 via the shared note-create pipeline; the reclaimed original id is never re-pushed — then remove the quarantine source on success). Requires the unlocked vault's items_key."
commands.allow = ["sync_restore_quarantine"]

[[permission]]
identifier = "allow-sync-delete-quarantine"
description = "Allow invoking sync:sync_delete_quarantine (permanently remove ONE quarantined note blob; strict file-name validation, UI confirm-gated — the single path that destroys quarantine evidence). No decrypt, no vault-blob access beyond the quarantine dir."
commands.allow = ["sync_delete_quarantine"]

[[permission]]
identifier = "allow-sync-lifecycle-suspend"
description = "Allow invoking sync:sync_lifecycle_suspend (WebView visibilitychange → hidden: hard-idle the foreground sync loop while the app is backgrounded, SYNC-37). Flips an in-RAM scheduler flag only — no vault access, no IO, no server call."
commands.allow = ["sync_lifecycle_suspend"]

[[permission]]
identifier = "allow-sync-lifecycle-resume"
description = "Allow invoking sync:sync_lifecycle_resume (WebView visibilitychange → visible: clear the suspend flag and arm the one-shot resume-immediate poll, SYNC-38). Flips an in-RAM scheduler flag only — no vault access, no IO, no server call."
commands.allow = ["sync_lifecycle_resume"]

[[permission]]
identifier = "allow-sync-decode-join-qr"
description = "Allow invoking sync:sync_decode_join_qr (MYND-466 — decode a scanned device-join QR string into {endpoint_url, account#, cert_pin, pin_source, fresh} for the confirm screen). Pure over the scanned string + the clock; no vault access, no IO, no server call, carries no secret."
commands.allow = ["sync_decode_join_qr"]

[[permission]]
identifier = "allow-sync-verify-hold-begin"
description = "Allow invoking sync:sync_verify_hold_begin (myne#462 — declare that a SYNC-40 device-verification eye-compare is open on this device, so the sync engine holds CONTENT pushes and the vault head both screens are comparing cannot advance under them). Idempotent, and it doubles as the lease ping: silence releases the hold after 15s and a hard ceiling of 5 minutes bounds it regardless, so a crashed WebView cannot leave this device silently unsynced. Flips an in-RAM flag only — no vault access, no IO, no server call, and pulls are never held. It cannot suppress an edit, only delay it: the coalescing anchor is retained, so the push flushes when the compare closes."
commands.allow = ["sync_verify_hold_begin"]

[[permission]]
identifier = "allow-sync-verify-hold-end"
description = "Allow invoking sync:sync_verify_hold_end (myne#462 — release the push hold engaged by sync_verify_hold_begin, on match, on mismatch or on unmount). Idempotent; in-RAM flag only, no vault access, no IO, no server call. Releasing early only restores the ordinary push cadence."
commands.allow = ["sync_verify_hold_end"]
