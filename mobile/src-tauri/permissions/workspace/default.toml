# Permissions for the in-app `workspace` Tauri plugin (mobile, MYND-561).
# Picked up under the `workspace:` ACL namespace because `build.rs` declares
# this as an `InlinedPlugin`. Capability files reference these as
# `workspace:default` (or `workspace:allow-workspace-read` /
# `workspace:allow-workspace-write`).
#
# Both commands are read/write of the encrypted vault.workspace blob and
# inherit the main-window-only invariant shared by the other vault plugins
# — v0.2 multi-window MUST NOT grant `workspace:allow-workspace-write` to
# any non-main window.
#
# Deliberately TWO permissions, not three: desktop's `workspace_stage`
# (RAM-staging for its Cmd+Q exit flush) has no mobile analog and is not
# registered, so granting it here would authorize a command that does not exist.

"$schema" = "../../gen/schemas/mobile-schema.json"

[default]
description = "Default permission set for the workspace plugin — read + write of the encrypted workspace-state descriptor."
permissions = ["allow-workspace-read", "allow-workspace-write"]

[[permission]]
identifier = "allow-workspace-read"
description = "Allow invoking workspace:workspace_read (Slot::Unlocked-gated read of the vault.workspace blob; returns the opaque descriptor string or None with restore-nothing fall-back per protocol.md § 9.7.4)."
commands.allow = ["workspace_read"]

[[permission]]
identifier = "allow-workspace-write"
description = "Allow invoking workspace:workspace_write (Slot::Unlocked-gated write of the workspace descriptor; atomic-writes vault.workspace, no native side-effect)."
commands.allow = ["workspace_write"]
