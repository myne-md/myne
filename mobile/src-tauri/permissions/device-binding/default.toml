# Permissions for the in-app `device-binding` Tauri plugin (mobile).
# Picked up under the `device-binding:` ACL namespace only because `build.rs` declares
# this as an `InlinedPlugin`. Capability files reference these as
# `device-binding:default` (or the individual `device-binding:allow-*` permissions).
#
# The family is the B2B device-to-person binding store: the encrypted
# `vault.device-bindings` (`MYU5`) singleton, group-tier sealed and `NTV6`-only
# (protocol.md §9.30, the member-devices feature). Ported from the desktop
# `src-tauri/permissions/device-binding/default.toml`: the same command, no
# mobile-only addition and none dropped. It is Slot::Unlocked-gated and it is a read.
#
# The write half has no command (myne-md/myne#976): `device_bindings_claim` was retired
# on both hosts, because the conflict it repaired is repaired by the sync cycle inside
# `myne-core`. No command here writes a tombstone either: an owner's removal tombstone
# is written inside the group rotation, which is not reachable over IPC.
#
# The remaining command has no mobile caller today, and that is deliberate rather than an
# oversight: the second-device flow reads its owner's code from the per-`(person, vault)`
# record and writes its own row inside `myne-core`, so no TypeScript binding wraps it,
# and `scripts/check-ipc-binding-callers.mjs` refuses a binding with no production
# caller. It stays registered and granted so a later surface needs no Rust change, which
# is the posture `permissions/member-names/default.toml` documents for its own two.

"$schema" = "../../gen/schemas/mobile-schema.json"

[default]
description = "Default permission set for the device-binding plugin: read the vault's signature-verified device bindings."
permissions = [
  "allow-device-bindings-list",
]
