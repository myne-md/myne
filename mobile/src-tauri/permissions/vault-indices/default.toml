# Permissions for the mobile `vault-indices` Tauri plugin (MYND-31 / A11).
# Picked up under the `vault-indices:` ACL namespace because `build.rs` declares
# this as an `InlinedPlugin`. Referenced by `capabilities/default.json` as
# `vault-indices:default`.
#
# The plugin core is shared from `myne-core`; mobile registers the same 16
# commands the desktop registers. All are Slot::Unlocked-gated and consume the
# `VaultRuntimeState` singleton (registered by `vault-unlock::init`); the index
# itself (`VaultIndicesState`) is managed in `lib.rs` setup. The index is
# plaintext-derived RAM, so every command requires an unlocked vault. These are
# write/query commands → main-window-only invariant.

"$schema" = "../../gen/schemas/mobile-schema.json"

[default]
description = "Default permission set for the mobile vault-indices plugin — apply + remove + forward + graph/tag/property queries + MYI1 persist/hydrate."
permissions = [
  "allow-vault-indices-apply",
  "allow-vault-indices-remove",
  "allow-vault-indices-forward",
  "allow-vault-indices-all-edges",
  "allow-vault-indices-orphans",
  "allow-vault-indices-backlink-candidates",
  "allow-vault-indices-by-tag",
  "allow-vault-indices-tag-tree",
  "allow-vault-indices-property-values",
  "allow-vault-indices-property-keys",
  "allow-vault-indices-persist",
  "allow-vault-indices-hydrate",
  "allow-vault-indices-tasks",
  "allow-vault-indices-headings",
  "allow-vault-indices-block-anchors",
]

[[permission]]
identifier = "allow-vault-indices-apply"
description = "Allow invoking vault-indices:vault_indices_apply (Slot::Unlocked-gated upsert of a note's index contribution — title + folder + wikilink edges + tags + typed properties; replace-on-apply)."
commands.allow = ["vault_indices_apply"]

[[permission]]
identifier = "allow-vault-indices-remove"
description = "Allow invoking vault-indices:vault_indices_remove (Slot::Unlocked-gated removal of a hard-deleted note from the index; trash does NOT route here — trashed notes stay indexed and are filtered TS-side via isTrashed)."
commands.allow = ["vault_indices_remove"]

[[permission]]
identifier = "allow-vault-indices-forward"
description = "Allow invoking vault-indices:vault_indices_forward (Slot::Unlocked-gated read of a note's raw outbound wikilink edges; the TS forward() wrapper resolves them via the single resolver into resolved + broken targets)."
commands.allow = ["vault_indices_forward"]

[[permission]]
identifier = "allow-vault-indices-all-edges"
description = "Allow invoking vault-indices:vault_indices_all_edges (Slot::Unlocked-gated whole-vault edge dump — [(noteId, edges)] for every indexed note, for the graph view's whole-vault build at <= cap; defensive edge-ceiling). Returns vault-wide link-structure (AS4-Sensitive) -> main-window-only."
commands.allow = ["vault_indices_all_edges"]

[[permission]]
identifier = "allow-vault-indices-orphans"
description = "Allow invoking vault-indices:vault_indices_orphans (Slot::Unlocked-gated degree-0 query — note ids with zero in+out raw edges, for the orphans-only graph view at any vault size). Vault-wide (AS4-Sensitive) -> main-window-only."
commands.allow = ["vault_indices_orphans"]

[[permission]]
identifier = "allow-vault-indices-backlink-candidates"
description = "Allow invoking vault-indices:vault_indices_backlink_candidates (Slot::Unlocked-gated read of all candidate backlink edges naming a folded title-key; the TS backlinks() wrapper resolves each via the single resolver, keeps those resolving to the queried note, and groups by source)."
commands.allow = ["vault_indices_backlink_candidates"]

[[permission]]
identifier = "allow-vault-indices-by-tag"
description = "Allow invoking vault-indices:vault_indices_by_tag (Slot::Unlocked-gated subtree-inclusive lookup of note ids by folded tag — a parent tag includes descendants; the query is folded TS-side before the call)."
commands.allow = ["vault_indices_by_tag"]

[[permission]]
identifier = "allow-vault-indices-tag-tree"
description = "Allow invoking vault-indices:vault_indices_tag_tree (Slot::Unlocked-gated read of the full tag tree — nodes with direct + subtree counts and a deterministic display, derived from the stored exact folded tags)."
commands.allow = ["vault_indices_tag_tree"]

[[permission]]
identifier = "allow-vault-indices-property-values"
description = "Allow invoking vault-indices:vault_indices_property_values (Slot::Unlocked-gated vault-wide by-key property accessor — (noteId, entry) for every note carrying a key, the query engine's primitive; comparison + filtering happen TS-side, no expression eval in Rust). Returns vault-wide property metadata (AS3/AS4-Sensitive) -> main-window-only."
commands.allow = ["vault_indices_property_values"]

[[permission]]
identifier = "allow-vault-indices-property-keys"
description = "Allow invoking vault-indices:vault_indices_property_keys (Slot::Unlocked-gated vault-wide DISTINCT frontmatter property-key list — the saved-view authoring UI's picker source for groupBy / sort / columns; no values, no comparison, no expression eval in Rust). Returns vault-wide property-key metadata (AS3/AS4-Sensitive) -> main-window-only."
commands.allow = ["vault_indices_property_keys"]

[[permission]]
identifier = "allow-vault-indices-persist"
description = "Allow invoking vault-indices:vault_indices_persist (Slot::Unlocked-gated write of the encrypted vault.indices / MYI1 blob — the at-rest projection of the in-RAM index, MYND-271 Task 8; snapshot + freshly-scanned nonce manifest, AEAD-sealed under vault-indices-key, atomic_write). Best-effort; writes vault-internal ciphertext only. Main-window-only."
commands.allow = ["vault_indices_persist"]

[[permission]]
identifier = "allow-vault-indices-hydrate"
description = "Allow invoking vault-indices:vault_indices_hydrate (Slot::Unlocked-gated load of the vault.indices / MYI1 blob as the unlock fast path — populates the store with unchanged-note records, drops deleted, and returns the stale note ids for TS to re-apply, Build-B reconcile; absent/undecodable/stale -> full rebuild). Returns vault-wide stale-id list (AS3/AS4-Sensitive) -> main-window-only."
commands.allow = ["vault_indices_hydrate"]

[[permission]]
identifier = "allow-vault-indices-tasks"
description = "Allow invoking vault-indices:vault_indices_tasks (Slot::Unlocked-gated whole-vault line-task dump — {noteId, noteTitle, noteFolder} plus the stored record per task, for the mobile task surfaces and the reminder scheduler, MYND-612/619/620; defensive task-ceiling). Rust performs NO filtering, sorting or date comparison: a parameterized accessor would move the §3.6.4 type authority out of the dialect layer, so surfaces filter TS-side over one shared fetch. Returns vault-wide task metadata (AS3/AS4-Sensitive) → main-window-only, the same invariant as every other setter here."
commands.allow = ["vault_indices_tasks"]

[[permission]]
identifier = "allow-vault-indices-headings"
description = "Allow invoking vault-indices:vault_indices_headings (Slot::Unlocked-gated whole-vault heading dump of {noteId, text, level} per heading, for the [[## vault-wide heading picker, myne#216; defensive heading-ceiling). Replaces a full-vault re-read: the picker's set used to be derived by re-reading and re-parsing every note body on each index change. Rows carry no note title/folder because the caller must join against the resident note-set anyway, and that join is where trashed/template exclusion lives (the mobile join is `joinVaultHeadings` over `resolverNotes` in `app/flows/EditorFlow.tsx`, desktop's is `useVaultHeadings`). Returns vault-wide heading metadata (AS3/AS4-Sensitive) → main-window-only, the same invariant as every other setter here."
commands.allow = ["vault_indices_headings"]

[[permission]]
identifier = "allow-vault-indices-block-anchors"
description = "Allow invoking vault-indices:vault_indices_block_anchors (Slot::Unlocked-gated whole-vault dump of imported ^block-id anchors, {noteId, noteTitle, noteFolder, blockId, preview} per anchor, for the [[^^ enumerate-only block-deep-link picker, MYND-382; defensive anchor-ceiling). Enumerate-only: surfaces markers that already exist (import), never mints one. Trash-blind like every query here, so the caller joins against the resident note-set (`joinVaultBlockAnchors`); an unjoined row deep-links into a trashed note. Returns vault-wide block-anchor metadata (AS3/AS4-Sensitive) → main-window-only, the same invariant as every other setter here."
commands.allow = ["vault_indices_block_anchors"]
