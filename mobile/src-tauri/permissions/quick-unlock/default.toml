# Permissions for the mobile `quick-unlock` Tauri plugin (MYND-329).
# Picked up under the `quick-unlock:` ACL namespace because `build.rs`
# declares this as an `InlinedPlugin`. Referenced by `capabilities/default.json`
# as `quick-unlock:default`.
#
# Mobile ships the PIN path only: setup / unlock / status / disable. The macOS
# biometric command branch is desktop-only and is NOT registered on mobile, so
# no biometric permission identifiers appear here.

"$schema" = "../../gen/schemas/mobile-schema.json"

[default]
description = "Default permission set for the mobile quick-unlock plugin (PIN path)."
permissions = [
    "allow-quick-unlock-setup-pin",
    "allow-quick-unlock-with-pin",
    "allow-quick-unlock-status",
    "allow-quick-unlock-disable",
]

[[permission]]
identifier = "allow-quick-unlock-setup-pin"
description = "Allow invoking quick-unlock:quick_unlock_setup_pin (configure PIN quick-unlock while the vault is unlocked)."
commands.allow = ["quick_unlock_setup_pin"]

[[permission]]
identifier = "allow-quick-unlock-with-pin"
description = "Allow invoking quick-unlock:quick_unlock_with_pin (attempt a PIN quick-unlock of the active vault)."
commands.allow = ["quick_unlock_with_pin"]

[[permission]]
identifier = "allow-quick-unlock-status"
description = "Allow invoking quick-unlock:quick_unlock_status (read-only: is quick-unlock configured, and by which method)."
commands.allow = ["quick_unlock_status"]

[[permission]]
identifier = "allow-quick-unlock-disable"
description = "Allow invoking quick-unlock:quick_unlock_disable (remove the device-local quick-unlock credential)."
commands.allow = ["quick_unlock_disable"]
