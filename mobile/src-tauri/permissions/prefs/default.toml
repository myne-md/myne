commands.allow = ["set_daily_template"]

# Periodic-notes settings (myne#177, wired to mobile by myne-md/myne#880). One
# weekly/monthly entry of the `periodic_notes` map, keyed `<period>.<setting>`;
# `value = null` clears the entry. Shared core setter, so this plugin only wires
# the ACL. Same three-site lockstep as every other prefs setter: this file, the
# prefs generate_handler, and (optionally) build.rs's inlined list.
# Graph colour groups (myne-md/myne#727, writable on mobile by myne-md/myne#880).
# A WHOLE-LIST replace of the rule sequence, because rule order is precedence.
# Shared core setter, so this plugin only wires the ACL. Same three-site
# lockstep as every other prefs setter: this file, the prefs generate_handler,
# and build.rs's inlined list.
# AI excluded folders (local-ai epic MYND-408, writable on mobile by
# myne-md/myne#880). The set the AI refusal path honours, so it is an EGRESS
# CONTROL: a set-union mutation with unfolded removals, and §10.2 keeps the union
# monotone. Shared core setter, so this plugin only wires the ACL. Same
# three-site lockstep as every other prefs setter: this file, the prefs
# generate_handler, and build.rs's inlined list.
# AI limits (myne-md/myne#880). Two commands with different classes, kept
# together because they are one surface: `set_chat_history_budget` is
# DEVICE-LOCAL (a per-machine off-device volume bound) and
# `set_meeting_ai_prompt` is SHARED / scalar LWW (vault content). Shared core
# setters, so this plugin only wires the ACL. Same three-site lockstep as every
# other prefs setter: this file, the prefs generate_handler, and build.rs's
# inlined list.
# Attachment image OCR (MYND-441), switchable on mobile since myne-md/myne#880.
# DEVICE-LOCAL (per-device compute budget, §10.2), and the control is the point:
# the import path already reads it and injects a no-op extractor when off, so the
# device paying the compute cost can now turn it off. Shared core setter, so this
# plugin only wires the ACL. Same three-site lockstep as every other prefs setter.
[[permission]]
identifier = "allow-set-attachment-ocr-enabled"
description = "Allow invoking prefs:set_attachment_ocr_enabled (Slot::Unlocked-gated setter for the device-local image-OCR opt-out: turning it off stops the extraction worker without deleting cached results; defaults to true, so an unreadable prefs blob reads as ON; atomic-writes vault.prefs with no native side-effect)."
commands.allow = ["set_attachment_ocr_enabled"]

[[permission]]
identifier = "allow-set-chat-history-budget"
description = "Allow invoking prefs:set_chat_history_budget (Slot::Unlocked-gated setter for the device-local chat-history seed budget, in characters, or null for the host default; the host CLAMPS it to MAX_HISTORY_BUDGET, so this permission is not a bound; atomic-writes vault.prefs with no native side-effect)."
commands.allow = ["set_chat_history_budget"]

[[permission]]
identifier = "allow-set-meeting-ai-prompt"
description = "Allow invoking prefs:set_meeting_ai_prompt (Slot::Unlocked-gated setter for the shared meeting-summary instruction, or null to restore the built-in default; an all-whitespace value clears host-side and a value over 4000 bytes is refused; atomic-writes vault.prefs with no native side-effect)."
commands.allow = ["set_meeting_ai_prompt"]

[[permission]]
identifier = "allow-set-ai-excluded-folders"
description = "Allow invoking prefs:set_ai_excluded_folders (Slot::Unlocked-gated set-union mutator for the folders AI never reads or indexes, with verbs rather than a whole set, because a stale caller's set would claim deletions it never made; atomic-writes vault.prefs with no native side-effect)."
commands.allow = ["set_ai_excluded_folders"]

[[permission]]
identifier = "allow-set-color-groups"
description = "Allow invoking prefs:set_color_groups (Slot::Unlocked-gated whole-list setter for the graph colour-group rule sequence, where order is rule precedence and first match wins; atomic-writes vault.prefs with no native side-effect)."
commands.allow = ["set_color_groups"]

[[permission]]
identifier = "allow-set-periodic-note-setting"
description = "Allow invoking prefs:set_periodic_note_setting (Slot::Unlocked-gated setter for one weekly/monthly periodic-notes entry, the `periodic_notes` map keyed `<period>.<setting>`; a folder value is also registered as a deliberate folder so it survives empty, and a null value clears the entry; atomic-writes vault.prefs with no native side-effect)."
commands.allow = ["set_periodic_note_setting"]

# Display date & time (myne#279, wired to mobile by myne-md/myne#609). The
# command bodies live in the SHARED myne-core prefs core and the desktop has
# registered all three since myne#279; this plugin only wires the ACL. Must stay
# in lockstep with the `generate_handler!` list in `../../src/plugins/prefs/mod.rs`
# or the ACL resolver fails closed, which is the same discipline the
# ingest-image-compression and device-naming entries carry.
#
# `protocol.md` §9.5.2 is normative on all three: closed-enum strings stored
# without codec-level validation, omitted entirely when unset, non-load-bearing
# (AS-low, no protective-envelope clamp), no new magic, no new SubkeyRole, no new
# AAD role, zero new crypto. `date_format` and `time_format` are shared scalar-
# LWW; `timezone` is device-local and DISPLAY-ONLY, deciding what counts as
# "today" and how a real instant prints.
#
# Be exact about what device-local means here, because the looser reading was
# written into nine places across this repository before myne-md/myne#609
# corrected it, and the first sweep found only five of them: the number below
# is what `git grep "sync wire"` returns, not what a session remembered
# visiting. It is a MERGE classification, not a transmission one:
# `PrefClass::DeviceLocal` in `core/src/plugins/sync/prefs_classification.rs` is
# what makes the local value survive the sync-protocol.md §10.2 merge. The zone
# still lives in the `MYP1` vault.prefs blob this very command writes, that blob
# is pushed and pulled verbatim like every other prefs field, and §10.2.1 has a
# newly enrolled device adopt it wholesale as a starting default. What is true
# without qualification is narrower and is the part that matters: the zone never
# enters a .myn file, so a note never records where its author was.
[[permission]]
identifier = "allow-set-date-format"
description = "Allow invoking prefs:set_date_format (Slot::Unlocked-gated setter for the date_format display preference: system/iso/dmy/mdy/dmmmy, Option<String> where None clears to the system default; atomic-writes vault.prefs with no native side-effect)."
commands.allow = ["set_date_format"]

[[permission]]
identifier = "allow-set-time-format"
description = "Allow invoking prefs:set_time_format (Slot::Unlocked-gated setter for the time_format display preference: system/24h/12h, Option<String> where None clears to the system default; atomic-writes vault.prefs with no native side-effect)."
commands.allow = ["set_time_format"]

[[permission]]
identifier = "allow-set-timezone"
description = "Allow invoking prefs:set_timezone (Slot::Unlocked-gated setter for the timezone DISPLAY override: an IANA zone identifier, Option<String> where None clears to the host's own zone; atomic-writes vault.prefs with no native side-effect and never writes a zone into note bytes)."
commands.allow = ["set_timezone"]

