description = "Allow invoking prefs:set_editor_focus_typewriter (Slot::Unlocked-gated setter for the editor_focus_typewriter toggle — the focus-mode typewriter-scrolling option; atomic-writes vault.prefs with no native side-effect; the default focus policy is applied host-side at read time)."
commands.allow = ["set_editor_focus_typewriter"]

[[permission]]
identifier = "allow-set-item-colors"
description = "Allow invoking prefs:set_item_colors (Slot::Unlocked-gated setter for the item_colors map — per-item color labels keyed by note UUID or canonical folder path; atomic-writes vault.prefs with no native side-effect)."
commands.allow = ["set_item_colors"]

[[permission]]
identifier = "allow-set-folder-icons"
description = "Allow invoking prefs:set_folder_icons (Slot::Unlocked-gated setter for the folder_icons map — per-folder custom sidebar icons keyed by canonical folder path; atomic-writes vault.prefs with no native side-effect)."
commands.allow = ["set_folder_icons"]

# MYND-548 device naming: a write setter for ONE device_names entry, unlock-gated
# by construction (the write needs prefs_key). There is no clear path by design:
# device_names merges per-key by UNION (sync-protocol.md §10.2), so a deletion
# would not propagate — it would resurrect from the first peer that still holds it.
[[permission]]
identifier = "allow-set-device-name"
description = "Allow invoking prefs:set_device_name (Slot::Unlocked-gated setter for one device_names entry — the human-readable label the device list shows for a device_id, keyed by its hex; a blank name is refused so no row renders nameless; atomic-writes vault.prefs with no native side-effect)."
commands.allow = ["set_device_name"]

# MYND-548: the read half — the platform token the enrollment forms seed their
# suggested device name from. Deliberately NOT unlock-gated and vault-free: it
# returns std::env::consts::OS, and the join flow needs it while bootstrapping a
# vault that is not unlocked yet. Reads no vault state and writes nothing.
[[permission]]
identifier = "allow-device-platform"
description = "Allow invoking prefs:device_platform (returns the compile-time std::env::consts::OS token — macos/windows/linux/ios/android — as the single default-device-name heuristic the enrollment forms seed from; touches no vault state and writes nothing)."
commands.allow = ["device_platform"]

# MYND-205 in-app vault switcher: a write setter for the per-vault label, so it
# inherits the same main-window-only invariant as the other allow-set-*
# permissions — v0.2 multi-window MUST NOT grant this to any non-main window.
# Unlock-gated by construction (writing the label needs prefs_key, which only
# exists for the active/sole-Unlocked vault); atomic-writes vault.prefs with no
# native side-effect, then refreshes the per-session RAM label cache.
[[permission]]
identifier = "allow-vault-set-label"
description = "Allow invoking prefs:vault_set_label (Slot::Unlocked-gated setter for the per-vault label field — the in-app vault switcher's human-readable name; Option<String> where None clears it; atomic-writes vault.prefs with no native side-effect, then refreshes the per-session RAM label cache so vault_list reflects the rename immediately)."
commands.allow = ["vault_set_label"]

# vault-icons: a write setter for the per-vault icon glyph name — the switcher's
# decorative glyph shown beside the vault name. Inherits the same
# main-window-only invariant as the other allow-set-* permissions — v0.2
# multi-window MUST NOT grant this to any non-main window. Unlock-gated by
# construction (writing the icon needs prefs_key, which only exists for the
# active/sole-Unlocked vault); atomic-writes vault.prefs with no native
# side-effect, then refreshes the per-session RAM icon cache.
[[permission]]
identifier = "allow-vault-set-icon"
description = "Allow invoking prefs:vault_set_icon (Slot::Unlocked-gated setter for the per-vault icon field — the in-app vault switcher's decorative glyph name; Option<String> where None clears it to the neutral wordmark; atomic-writes vault.prefs with no native side-effect, then refreshes the per-session RAM icon cache so vault_list reflects the change immediately)."
commands.allow = ["vault_set_icon"]

# MYND-267 spell-checker: two write setters for the spell-check prefs
# (spell_enabled toggle + spell_languages set). Both inherit the same
# main-window-only invariant as the other allow-set-* permissions — v0.2
# multi-window MUST NOT grant these to any non-main window. Both atomic-write
# vault.prefs with no native side-effect; non-load-bearing (no clamp).
[[permission]]
identifier = "allow-set-spell-enabled"
description = "Allow invoking prefs:set_spell_enabled (Slot::Unlocked-gated setter for the spell_enabled toggle; atomic-writes vault.prefs with no native side-effect; the default-ON policy is applied host-side at read time)."
commands.allow = ["set_spell_enabled"]

[[permission]]
identifier = "allow-set-spell-languages"
description = "Allow invoking prefs:set_spell_languages (Slot::Unlocked-gated setter for the spell_languages set — the active spell-check language tags, SYNC-11 union; codec NFC-sorts+dedupes; atomic-writes vault.prefs with no native side-effect)."
commands.allow = ["set_spell_languages"]

# sidebar-note-timestamps: a write setter for the show_note_timestamps toggle —
# the per-note "last edited" date under each sidebar note row. Inherits the same
# main-window-only invariant as the other allow-set-* permissions — v0.2
# multi-window MUST NOT grant this to any non-main window. Atomic-writes
# vault.prefs with no native side-effect; non-load-bearing (no clamp). The field
# is a plain bool defaulting true; the codec omits it on disk when true.
[[permission]]
identifier = "allow-set-show-note-timestamps"
description = "Allow invoking prefs:set_show_note_timestamps (Slot::Unlocked-gated setter for the show_note_timestamps bool — show/hide the per-note last-edited date in the sidebar; default true is omitted on disk; atomic-writes vault.prefs with no native side-effect)."
commands.allow = ["set_show_note_timestamps"]

# MYND-273 Saved Views: save/edit (upsert-by-id) of one saved-view definition.
# Inherits the same main-window-only invariant as the other allow-set-*
# permissions — v0.2 multi-window MUST NOT grant this to any non-main window
# (a view's name/filter/property is AS3-Sensitive). Atomic-writes vault.prefs
# with no native side-effect; the 64 KiB MYP1 cap fails the encode (no write)
# before touching disk; non-load-bearing (no clamp).
# MYND-304 rebindable hotkeys: a write setter for one command's keymap override.
# Inherits the same main-window-only invariant as the other allow-set-*
# permissions — v0.2 multi-window MUST NOT grant this to any non-main window.
# Atomic-writes vault.prefs with no native side-effect; non-load-bearing (no clamp).
[[permission]]
identifier = "allow-set-keymap-binding"
description = "Allow invoking prefs:set_keymap_binding (Slot::Unlocked-gated setter for ONE command's keymap override; Option<Vec<String>> where Some(non-empty)=override, Some(empty)=explicit-unbind ([]), None=remove (revert to default); codec NFC-sorts+dedupes each chord set; atomic-writes vault.prefs with no native side-effect; logs set/remove + chord count only, never the command id or chords)."
commands.allow = ["set_keymap_binding"]

[[permission]]
identifier = "allow-upsert-saved-view"
description = "Allow invoking prefs:upsert_saved_view (Slot::Unlocked-gated save/edit of one SavedView — replaces by id else appends; atomic-writes vault.prefs with no native side-effect; over the 64 KiB MYP1 cap fails PrefsEncodeFailed before any write, leaving on-disk prefs intact; logs view count only, never a name/filter/property)."
commands.allow = ["upsert_saved_view"]

[[permission]]
identifier = "allow-delete-saved-view"
description = "Allow invoking prefs:delete_saved_view (Slot::Unlocked-gated delete of one SavedView by id — removes it from saved_views and prunes the id from view_order; atomic-writes vault.prefs with no native side-effect; deleting an absent id is an idempotent no-op; logs view count only)."
commands.allow = ["delete_saved_view"]

[[permission]]
identifier = "allow-set-view-order"
description = "Allow invoking prefs:set_view_order (Slot::Unlocked-gated setter for the view_order sequence — the saved-view display order; atomic-writes vault.prefs with no native side-effect, preserving element order verbatim; no codec GC of stale ids)."
commands.allow = ["set_view_order"]

[[permission]]
identifier = "allow-set-right-panel-active-tab"
description = "Allow invoking prefs:set_right_panel_active_tab (Slot::Unlocked-gated setter for the right_panel_active_tab pointer — the right-sidebar tab the editor restores, or None to clear to the host default; atomic-writes vault.prefs with no native side-effect; non-load-bearing, the client owns tab-id interpretation + unknown→default fallback)."
commands.allow = ["set_right_panel_active_tab"]

[[permission]]
identifier = "allow-set-right-panel-hidden-tabs"
description = "Allow invoking prefs:set_right_panel_hidden_tabs (Slot::Unlocked-gated setter for the right_panel_hidden_tabs set — the right-sidebar tabs hidden via the panel's right-click menu; atomic-writes vault.prefs with no native side-effect; codec canonicalizes sorted + deduped on encode; no codec GC of unknown ids)."
commands.allow = ["set_right_panel_hidden_tabs"]

[[permission]]
identifier = "allow-set-right-panel-tab-order"
description = "Allow invoking prefs:set_right_panel_tab_order (Slot::Unlocked-gated setter for the right_panel_tab_order sequence — the right-sidebar tab display order; atomic-writes vault.prefs with no native side-effect, preserving element order verbatim; no codec GC of unknown ids)."
commands.allow = ["set_right_panel_tab_order"]

[[permission]]
identifier = "allow-set-editor-toolbar-order"
description = "Allow invoking prefs:set_editor_toolbar_order (Slot::Unlocked-gated setter for the editor_toolbar_order sequence — the editor format-bar action display order, MYND-555; atomic-writes vault.prefs with no native side-effect, preserving element order verbatim; no codec GC of unknown ids. DEVICE-LOCAL in the sync merge policy, so a phone layout never propagates to a desktop)."
commands.allow = ["set_editor_toolbar_order"]

[[permission]]
identifier = "allow-set-editor-toolbar-hidden"
description = "Allow invoking prefs:set_editor_toolbar_hidden (Slot::Unlocked-gated setter for the editor_toolbar_hidden set — the editor format-bar actions the user hid, MYND-555; atomic-writes vault.prefs with no native side-effect; codec canonicalizes sorted + deduped on encode; no codec GC of unknown ids. DEVICE-LOCAL, like its order twin)."
commands.allow = ["set_editor_toolbar_hidden"]

[[permission]]
identifier = "allow-set-reminders-enabled"
description = "Allow invoking prefs:set_reminders_enabled (Slot::Unlocked-gated setter for whether THIS DEVICE shows task reminders, MYND-618/619). A plain bool defaulting true, omitted from the canonical encoding at its default so an untouched vault stays byte-identical. Classified DEVICE-LOCAL — whether a given phone should be interrupted is a property of that phone, so it must not sync. Non-load-bearing: a tampered value can at worst silence or enable a notification. Main-window-only, same invariant as every other prefs setter."
commands.allow = ["set_reminders_enabled"]

[[permission]]
identifier = "allow-set-reminder-horizon-days"
description = "Allow invoking prefs:set_reminder_horizon_days (Slot::Unlocked-gated setter for how many days ahead this device registers reminders with the OS, MYND-618/619; None falls back to the client's built-in horizon). Optional and omitted when unset, so an untouched vault stays byte-identical. DEVICE-LOCAL for the same reason as reminders_enabled. The horizon is a PRIVACY bound before a resource one — pending reminder times leave the AEAD envelope and sit in OS-owned plaintext (threat-model.md §7), so a shorter horizon exposes less. Stored verbatim with no clamp; clamping here would silently disagree with what the settings UI showed."
commands.allow = ["set_reminder_horizon_days"]

[[permission]]
identifier = "allow-set-transcription-enabled"
description = "Allow invoking prefs:set_transcription_enabled (Slot::Unlocked-gated setter for whether on-device voice-to-text is available, MYND-563/592). A plain bool defaulting true (opt-OUT), omitted from the canonical encoding at its default so an untouched vault stays byte-identical. It is a SEPARATE switch from the AI-beta ai_enabled opt-in — transcription ships a bundled model and is a product feature, not part of the AI beta. Non-load-bearing: the transcribe command re-reads this host-side before any decrypt, so a tampered value can at worst enable/disable a feature, never bypass the gate. Main-window-only, same invariant as every other prefs setter."
commands.allow = ["set_transcription_enabled"]

# ---- AI (myne-md/myne#456) --------------------------------------------------

[[permission]]
identifier = "allow-set-ai-enabled"
description = "Allow invoking prefs:set_ai_enabled (Slot::Unlocked-gated setter for the DEVICE-LOCAL AI beta opt-in; since myne-md/myne#456 removed developer_mode from the request-time gate this is one of only two device-local controls on the remote path, the other being the consent below)."
commands.allow = ["set_ai_enabled"]

[[permission]]
identifier = "allow-set-ai-provider"
description = "Allow invoking prefs:set_ai_provider (Slot::Unlocked-gated setter naming the remote provider; clearing it also clears the consent and the key host-side, because a key for a provider nobody selected is a credential with no owner). A value outside the host's known set is refused rather than stored."
commands.allow = ["set_ai_provider"]

[[permission]]
identifier = "allow-set-ai-provider-consent"
description = "Allow invoking prefs:set_ai_provider_consent (Slot::Unlocked-gated setter recording WHICH provider the consent was given for; DEVICE-LOCAL since myne-md/myne#456, so an approval made on a laptop does not arrive here by sync). This is the persistence, not the enforcement: the host re-reads it before every remote request."
commands.allow = ["set_ai_provider_consent"]

[[permission]]
identifier = "allow-set-ai-provider-key"
description = "Allow invoking prefs:set_ai_provider_key (Slot::Unlocked-gated setter for the provider API key, or null to revoke). WRITE-ONLY by construction: there is no command that returns the key and the host marks the field serde-skip, so it never crosses into page context."
commands.allow = ["set_ai_provider_key"]

[[permission]]
identifier = "allow-set-ai-provider-model"
description = "Allow invoking prefs:set_ai_provider_model (Slot::Unlocked-gated setter choosing which of the provider's models answers). No default and no fallback: the value comes from the list the provider itself reports."
commands.allow = ["set_ai_provider_model"]

[[permission]]
identifier = "allow-ai-provider-has-key"
description = "Allow invoking prefs:ai_provider_has_key (Slot::Unlocked-gated READ answering WHETHER a key is stored, never what). It exists so the key can stay serde-skipped: the UI decides between Add key and Replace key from a boolean."
commands.allow = ["ai_provider_has_key"]

[[permission]]
identifier = "allow-set-calendar-setting"
description = "Allow invoking prefs:set_calendar_setting (Slot::Unlocked-gated setter for one calendar_settings entry: the all-day reminder anchor day_reminder_anchor, or a colours.<name> design-token name for a calendar; Some sets it and None removes the key, which the Phase 2 merge represents as a stamped absence; read-modify-write under the write mutex, disk-first, no native side-effect; the three host-side refusals are a key nothing reads, an anchor that is not HH:MM wall clock, and a colour that is not a token name, so a hex literal is refused rather than stored and ignored; the calendar name is user text and is never logged; class DeviceLocal per sync-protocol.md §10.2)."
commands.allow = ["set_calendar_setting"]
