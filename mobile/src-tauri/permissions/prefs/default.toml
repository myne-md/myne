[[permission]]
identifier = "allow-set-ribbon-items"
description = "Allow invoking prefs:set_ribbon_items (Slot::Unlocked-gated setter for the ribbon_items sequence: the left ribbon's pinned command ids; writing marks the rail configured so an emptied list stays empty; atomic-writes vault.prefs with no native side-effect)."
commands.allow = ["set_ribbon_items"]

[[permission]]
identifier = "allow-set-ribbon-visible"
description = "Allow invoking prefs:set_ribbon_visible (Slot::Unlocked-gated setter for the ribbon_visible flag: whether this device shows the left ribbon; default true, omitted unless false; atomic-writes vault.prefs with no native side-effect)."
