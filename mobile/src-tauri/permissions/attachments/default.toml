# Permissions for the mobile `attachments` Tauri plugin (MYND-169).
# Picked up under the `attachments:` ACL namespace because `build.rs` declares
# this as an `InlinedPlugin`. Referenced by `capabilities/default.json` as
# `attachments:default`.
#
# The plugin core is shared from `myne-core`; mobile registers the CRUD subset
# that works without a native microphone or the desktop text extractor — NO
# `voice_record_*`, and no PDF/DOCX/text extraction. It DOES register the
# MYE1 read-back (myne-md/myne#926): the mobile import OCRs an image into the
# cache (MYND-441), so the cache can be non-empty on a phone and the surface that
# shows it is the photo-to-note sheet.
#
# Every command here is `Slot::Unlocked`-gated and consumes the `VaultRuntimeState`
# singleton registered by `vault-unlock::init`; the reference graph
# (`AttachmentRefsState`) is owned in `lib.rs` setup.
#
# Main-window-only invariant: import + delete + rename + clean write vault
# state, export decrypts, and the catalog / unused / reconcile reads decrypt
# vault metadata, so all are privileged. v0.2 multi-window MUST NOT grant any
# of these to a non-main window. The `attachment://` URI scheme is NOT a
# command — it is registered on the Builder in `lib.rs` and gated inside its own
# handler (unlock + main-window-label), so it has no ACL entry here.

"$schema" = "../../gen/schemas/mobile-schema.json"

[default]
description = "Default permission set for the mobile attachments plugin: import + catalog list + delete + rename + export + unused-list + clean-unused + reconcile (apply / remove / referencing) + the MYE1 extracted-text read-back."
permissions = [
  "allow-attachment-import",
  "allow-attachment-extract-ephemeral",
  "allow-catalog-list",
  "allow-attachment-delete",
  "allow-attachment-rename",
  "allow-attachment-set-folder",
  "allow-attachment-export",
  "allow-attachment-unused-list",
  "allow-attachment-clean-unused",
  "allow-attachment-refs-apply",
  "allow-attachment-refs-remove",
  "allow-attachment-refs-referencing",
  "allow-attachment-read-extracted-text",
]

[[permission]]
identifier = "allow-attachment-extract-ephemeral"
description = "Allow invoking attachments:attachment_extract_ephemeral — the text of a picked or photographed file, returned without an attachment, a catalog row, a text cache row or a sync entry. No vault state and no key, so it is callable while the vault is locked. Images are read by the shared on-device OCR; text-like files as UTF-8; PDF and DOCX have no extractor on this host and answer `unsupported`."
commands.allow = ["attachment_extract_ephemeral"]

[[permission]]
identifier = "allow-attachment-import"
description = "Allow invoking attachments:attachment_import (Slot::Unlocked-gated import of inline bytes or a path; sniffs + validates the type against the PNG/JPEG/GIF/WebP/SVG/PDF allowlist, enforces the 64 MiB cap, computes the content-addressed attachment-id, dedups on id-existence, else encrypts the MYA1 blob + upserts the MYC1 catalog; returns the id + metadata. On mobile an IMAGE is OCR'd eagerly into the MYE1 cache unless the device-local `attachment_ocr_enabled` pref is off (MYND-441); PDF/DOCX/text extraction stays desktop-only)."
commands.allow = ["attachment_import"]

[[permission]]
identifier = "allow-catalog-list"
description = "Allow invoking attachments:catalog_list (Slot::Unlocked-gated read of the full vault.attachments catalog metadata for the library UI; fall-back-to-empty on absence / AEAD-fail / parse-fail per protocol.md § 9.10.4)."
commands.allow = ["catalog_list"]

[[permission]]
identifier = "allow-attachment-delete"
description = "Allow invoking attachments:attachment_delete (Slot::Unlocked-gated explicit removal of one attachment — unlinks the blob + removes the catalog entry; idempotent on an absent id; NO auto-GC, the reference graph is the UI's concern)."
commands.allow = ["attachment_delete"]

[[permission]]
identifier = "allow-attachment-rename"
description = "Allow invoking attachments:attachment_rename (Slot::Unlocked-gated free-form rename of one attachment's catalog display filename; duplicates allowed since the content-addressed id is the key; only the MYC1 catalog entry's filename changes — the blob + id + on-disk filename are untouched)."
commands.allow = ["attachment_rename"]

[[permission]]
identifier = "allow-attachment-export"
description = "Allow invoking attachments:attachment_export (Slot::Unlocked-gated export of one attachment's DECRYPTED bytes to a user-chosen destination path; the frontend opens the native Save dialog and passes the path + overwrite consent; the plaintext is decrypted in Rust RAM and written via atomic_write_unclobbered, never crossing back into the WebView. TB3 user-initiated-egress exception. Type-agnostic; MYND-173)."
commands.allow = ["attachment_export"]

[[permission]]
identifier = "allow-attachment-unused-list"
description = "Allow invoking attachments:attachment_unused_list (Slot::Unlocked-gated read of the unused-attachment set behind the 'Clean unused attachments' review dialog — catalog entries referenced by zero live notes, computed authoritatively by decrypting + scanning every note for canonical ![[att:<id>]] embeds; fail-closed on an unreadable note; read-only, no mutation; MYND-171)."
commands.allow = ["attachment_unused_list"]

[[permission]]
identifier = "allow-attachment-clean-unused"
description = "Allow invoking attachments:attachment_clean_unused (Slot::Unlocked-gated batched cryptographic erase of confirmed unused attachments — re-verifies each id is still referenced by zero notes via the authoritative fail-closed scan, drops survivors from the MYC1 catalog in one atomic rewrite catalog-first, then unlinks their MYA1 blobs; a re-referenced or already-gone id is skipped; returns deleted/skipped/bytes-reclaimed counts; MYND-171)."
commands.allow = ["attachment_clean_unused"]

[[permission]]
identifier = "allow-attachment-refs-apply"
description = "Allow invoking attachments:attachment_refs_apply (Slot::Unlocked-gated replace-on-apply of a note's referenced attachment-ids; ids arrive already extracted TS-side via the shared extractAttachmentIds tokenizer — never parses markdown; SYNC-6 reconcile)."
commands.allow = ["attachment_refs_apply"]

[[permission]]
identifier = "allow-attachment-refs-remove"
description = "Allow invoking attachments:attachment_refs_remove (Slot::Unlocked-gated removal of a hard-deleted note from the reference graph; trash does NOT route here — trashed notes stay in the graph, filtered TS-side via the live id-set)."
commands.allow = ["attachment_refs_remove"]

[[permission]]
identifier = "allow-attachment-refs-referencing"
description = "Allow invoking attachments:attachment_refs_referencing (Slot::Unlocked-gated query of the note-ids referencing one attachment-id — the library's 'used in N notes' count + the delete-warning's note list; SYNC-6 amended exposes ids, not just a count)."
commands.allow = ["attachment_refs_referencing"]

[[permission]]
identifier = "allow-attachment-read-extracted-text"
description = "Allow invoking attachments:attachment_read_extracted_text (Slot::Unlocked-gated read-back of one attachment's cached MYE1 extracted text, which on mobile is the image OCR the import wrote (protocol.md § 9.15); decrypts the device-local cache blob in Rust and crosses IPC as plaintext of note-body class, rendered as inert editable text in the photo-to-note draft sheet, returning null when no usable cache entry exists. No engine and no pref gate: reading needs neither. myne-md/myne#926)."
commands.allow = ["attachment_read_extracted_text"]

[[permission]]
identifier = "allow-attachment-set-folder"
description = "Allow invoking attachments:attachment_set_folders (Slot::Unlocked-gated batch placement of attachments into the vault's own note folders, myne-md/myne#1075). One command serves the library's multi-select move and the folder-rename re-root, because they are the same write; validation is all-or-nothing and an assignment that changes nothing is skipped rather than bumping a version."
commands.allow = ["attachment_set_folders"]
