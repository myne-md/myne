# Permissions for the in-app `account` Tauri plugin, mobile (myne-md/myne#684).
# Mirror of the desktop `src-tauri/permissions/account/default.toml`, down to
# the identifier and what it is allowed to reach. Picked up under the
# `account:` ACL namespace only because `build.rs` declares this as an
# `InlinedPlugin`. Capability files reference this as `account:default`.
#
# ONE command since myne-md/myne#937, and it is READ-ONLY: `account_split` was
# the only code path that could create a second account, so it went with the
# move/split pair. The command is reachable PRE-UNLOCK, deliberately: the surface
# it governs is the vault picker, which renders before any vault is open. It
# reaches no vault content: the only values crossing are hex account ids and
# vault ids. Adding a command here without a matching entry in
# `src-tauri/src/plugins/account/mod.rs`'s `generate_handler!` ships it dead
# (root AGENTS.md: an ACL entry does not wire a command, and nothing checks that
# it does).
#
# On Android `myne_core::vault_label::key::platform_keychain` has no backend, so
# the record holds nothing and `account_list` answers an empty list: vaults show
# standalone, never an error, never plaintext.

"$schema" = "../../gen/schemas/mobile-schema.json"

[default]
description = "Default permission set for the account plugin: read the device-local account grouping. Read-only: the move/split mutations were removed with the single-account grouping (myne-md/myne#937)."
permissions = [
  "allow-account-list",
]

[[permission]]
identifier = "allow-account-list"
description = "Allow invoking account:account_list (read the device-local account grouping from app_config_dir/account.json; absent means no grouping, a damaged file rebuilds from the disk-scan). A list of accounts out; no vault content, no keychain write."
commands.allow = ["account_list"]
