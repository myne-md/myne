# Permissions for the mobile `captures` Tauri plugin (Apple Watch voice quick-capture, §9.18).
# Picked up under the `captures:` ACL namespace because `build.rs` declares this
# as an `InlinedPlugin`. Referenced by `capabilities/default.json` as
# `captures:default`.
#
# The queue commands are device-key based (no vault key); `seal_staged` runs
# while the vault is locked, `take_pending` + `ack` drain the queue into notes on
# unlock. Off Apple targets the device key is unavailable and the commands no-op.
# The watch meeting lane (myne-md/myne#812) splits the same way:
# `seal_meeting_chunk` is device-key based and runs while LOCKED (it seals an
# arrived audio chunk under the device-local key and records it in the
# pending-meeting manifest), while `drain_pending_meetings` and
# `ack_meeting_session` need the UNLOCKED vault (they import the chunks into the
# vault library, then delete the device-local group once the note exists).
# Adding a command to `build.rs` without a matching entry here is a security bug.

"$schema" = "../../gen/schemas/mobile-schema.json"

[default]
description = "Default permission set for the mobile captures plugin (seal/take/ack the pending-capture queue; seal arrived watch meeting audio)."
permissions = [
    "allow-seal-staged",
    "allow-take-pending",
    "allow-ack",
    "allow-seal-meeting-chunk",
    "allow-drain-pending-meetings",
    "allow-ack-meeting-session",
]

[[permission]]
identifier = "allow-seal-staged"
description = "Allow invoking captures:seal_staged (encrypt staged watch-dictated captures into the device-local queue; runs while locked)."
commands.allow = ["seal_staged"]

[[permission]]
identifier = "allow-take-pending"
description = "Allow invoking captures:take_pending (decrypt pending captures for the WebView to turn into notes on unlock)."
commands.allow = ["take_pending"]

[[permission]]
identifier = "allow-ack"
description = "Allow invoking captures:ack (delete a drained capture once its note has been created)."
commands.allow = ["ack"]

[[permission]]
identifier = "allow-seal-meeting-chunk"
description = "Allow invoking captures:seal_meeting_chunk (seal one arrived watch meeting-audio chunk under the device-local key and record it in the pending-meeting manifest; runs while locked)."
commands.allow = ["seal_meeting_chunk"]

[[permission]]
identifier = "allow-drain-pending-meetings"
description = "Allow invoking captures:drain_pending_meetings (decrypt each sealed watch meeting-audio chunk and import it into the vault library as an attachment; requires the unlocked vault)."
commands.allow = ["drain_pending_meetings"]

[[permission]]
identifier = "allow-ack-meeting-session"
description = "Allow invoking captures:ack_meeting_session (delete a drained meeting session's sealed entries + manifest record once its note exists)."
commands.allow = ["ack_meeting_session"]
