# Lefthook config — myne-mobile.
# Install once per clone:  brew install lefthook && lefthook install
# Skip ad-hoc:             LEFTHOOK=0 git commit ...   (or  git commit --no-verify)
#
# Mirrors the main `myne` repo's hook discipline, adapted for the mobile layout:
# the Cargo workspace lives at `src-tauri/` (mobile has no root Cargo.toml), so
# Rust hooks target `src-tauri/Cargo.toml`. Fast hygiene on pre-commit; the full
# build/lint/test battery on pre-push.

pre-commit:
  parallel: true
  commands:

    rustfmt:
      glob: "*.rs"
      run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

    tsc:
      glob: "*.{ts,tsx}"
      run: pnpm exec tsc --noEmit

    whitespace:
      run: git diff --cached --check

    eof-newline:
      run: |
        fail=0
        for f in {staged_files}; do
          [ -f "$f" ] || continue
          if file --mime "$f" | grep -q 'charset=binary'; then continue; fi
          if [ -n "$(tail -c1 "$f")" ]; then
            echo "missing EOF newline: $f"
            fail=1
          fi
        done
        exit $fail

    secret-scan:
      run: |
        fail=0
        for f in {staged_files}; do
          [ -f "$f" ] || continue
          if file --mime "$f" | grep -q 'charset=binary'; then continue; fi
          if grep -nE 'BEGIN [A-Z ]*PRIVATE KEY|AKIA[A-Z0-9]{16}|aws_secret_access_key[[:space:]]*=' "$f" >/dev/null; then
            echo "secret-like pattern in: $f"
            grep -nE 'BEGIN [A-Z ]*PRIVATE KEY|AKIA[A-Z0-9]{16}|aws_secret_access_key[[:space:]]*=' "$f"
            fail=1
          fi
        done
        exit $fail

# Full validation battery — serial, runs before push.
pre-push:
  piped: true
  commands:
    clippy:
      run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
    cargo-test:
      run: cargo test --manifest-path src-tauri/Cargo.toml --no-fail-fast
    pnpm-build:
      run: pnpm build
    vitest:
      # Frontend unit tests (Vitest). Only `pnpm test` — NOT `test:flow`
      # (Playwright starts a webServer; too heavy/flaky for a push hook).
      run: pnpm test

# Reject accidental AI co-author / attribution trailers in commit messages
# (project policy). Lefthook passes the commit-message file path as {1}.
commit-msg:
  commands:
    no-ai-coauthor:
      run: |
        if grep -qiE 'Co-Authored-By:.*(Claude|Anthropic)|Generated with .*Claude|🤖 Generated' "{1}"; then
          echo "commit message carries an AI co-author/attribution trailer — remove it (project policy)."
          exit 1
        fi
