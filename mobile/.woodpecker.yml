# Woodpecker CI — myne-mobile (Phase-3 mobile client).
# Mirrors the main `myne` repo's self-hosted Woodpecker pipeline, adapted for the
# mobile layout:
#   * The Cargo workspace is at `src-tauri/` (mobile has no root Cargo.toml).
#   * The audited `protocol` crate is REUSED from the main repo via the nested
#     path dep `../../protocol`. Locally that resolves because myne-mobile is
#     cloned inside the main `myne` checkout; in CI (standalone checkout) the
#     `provision-protocol` snippet clones the main repo and symlinks it into
#     place — the same companion-repo-clone idiom the desktop `sync-sim` step
#     uses (token-gated Forgejo clone).
#   * Native iOS/Android builds need Xcode / the Android SDK+NDK and CANNOT run
#     on the Linux runner — they belong to a separate mac/Android release matrix
#     (documented, not gated here), exactly as the desktop signed-bundle release
#     pipeline is separate from this verification CI.

when:
  - event: [push, pull_request, manual]
    branch: [develop, main]

steps:
  # ── Rust style (no compile) ───────────────────────────────────────────────
  cargo-fmt:
    image: rust:1.96.0-slim
    commands:
      - rustup component add rustfmt
      - cd src-tauri && cargo fmt --all -- --check

  # ── Rust lint + unit tests (mirrored vault/notes/prefs plugins) ───────────
  # Compiling the mobile Tauri lib for the Linux host exercises the platform-
  # agnostic Rust logic; it needs the Tauri Linux WebView sysdeps + the protocol
  # crate provisioned adjacently.
  cargo-checks:
    image: rust:1.96.0-slim
    environment:
      MYNE_REPO_TOKEN:
        from_secret: myne_repo_token
    commands:
      - ulimit -n $(ulimit -Hn) 2>/dev/null || true
      - apt-get update && apt-get install -y --no-install-recommends
        git ca-certificates pkg-config libssl-dev
        libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      # provision-protocol+core: make ../../protocol AND ../../core (relative to
      # src-tauri) resolve. Mobile depends on `myne-core` directly, and core in
      # turn depends on `../protocol`; both crates live in the main `myne` repo.
      # One clone of the main repo backs both symlinks. The `core` symlink points
      # INTO the cloned tree (myne-main/core) so core's own `../protocol`
      # path-dep resolves to myne-main/protocol without a second checkout.
      - |
        PARENT="$(cd .. && pwd)"
        if [ ! -e "$PARENT/protocol" ] || [ ! -e "$PARENT/core" ]; then
          if [ ! -e "$PARENT/myne-main" ]; then
            if [ -n "$MYNE_REPO_TOKEN" ]; then
              git clone --depth 1 "https://oauth2:$MYNE_REPO_TOKEN@github.com/myne-md/myne.git" "$PARENT/myne-main"
            else
              git clone --depth 1 "https://github.com/myne-md/myne.git" "$PARENT/myne-main"
            fi
          fi
          ln -sfn "$PARENT/myne-main/protocol" "$PARENT/protocol"
          ln -sfn "$PARENT/myne-main/core" "$PARENT/core"
        fi
      - rustup component add clippy
      - cd src-tauri && cargo clippy --all-targets -- -D warnings
      - cargo test --no-fail-fast

  # ── Cross-implementation vector conformance (protocol crate) ──────────────
  # Mobile links the SAME audited `protocol/` crate as desktop, so its blob/
  # crypto path is byte-validated by `protocol/tests/vectors.rs` against the
  # `myne-test-vectors` companion (28 categories: MY01…MYR1 blobs, KDF, AEAD,
  # HKDF subkey roles, SCRAM, vault-head, manifest, account-number, BIP-39…).
  # A passing run here == mobile's crypto is cross-client conformant.
  #
  # DISABLED (mirrors the main repo's step) while `myne-test-vectors` is private:
  # the runner SKIPS-with-message when the companion is absent, so leaving this
  # off does not fail CI — it just doesn't gate. Enable once the vectors repo is
  # reachable (public, or a `vectors_token` secret):
  #
  # protocol-vectors:
  #   image: rust:1.96.0-slim
  #   environment:
  #     VECTORS_TOKEN: { from_secret: vectors_token }
  #   commands:
  #     - apt-get update && apt-get install -y --no-install-recommends git ca-certificates
  #     - PARENT="$(cd .. && pwd)"
  #     - '[ -e "$PARENT/protocol" ] || { git clone --depth 1 https://github.com/myne-md/myne.git "$PARENT/myne-main" && ln -sfn "$PARENT/myne-main/protocol" "$PARENT/protocol" && ln -sfn "$PARENT/myne-main/core" "$PARENT/core"; }'
  #     # vectors.rs locates the companion at <protocol>/../myne-test-vectors:
  #     - git clone --depth 1 "https://oauth2:$VECTORS_TOKEN@github.com/myne-md/myne-test-vectors.git" "$PARENT/myne-test-vectors"
  #     - cd "$PARENT/protocol" && cargo test -p protocol --test vectors

  # ── Rust supply-chain audit ───────────────────────────────────────────────
  cargo-deny:
    image: rust:1.96.0-slim
    commands:
      - apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - cargo install --locked cargo-deny
      - cd src-tauri && cargo deny check

  # ── Frontend build (tsc typecheck + vite bundle) ──────────────────────────
  pnpm-build:
    image: node:25
    commands:
      - npm install -g pnpm@11.8.0
      - pnpm install --frozen-lockfile
      - pnpm build

  # ── Frontend unit tests (TS↔Rust mirrors, dialect, etc.) ──────────────────
  # Serialized after pnpm-build so the two pnpm-install steps stay linear (the
  # desktop pipeline does the same to avoid pnpm lockdir ENOENT races).
  vitest:
    image: node:25
    depends_on: [pnpm-build]
    commands:
      - npm install -g pnpm@11.8.0
      - pnpm install --frozen-lockfile
      - pnpm test

  # ── Sync UI flow-logic tier (MYND-462 T3) — NOT end-to-end ────────────────
  # Playwright drives headless Chromium against the Vite DEV SERVER with a MOCK
  # Tauri IPC (`tests/flow-logic/mock-ipc.ts`) — it exercises the sync UI's flow
  # machine (enroll transitions, status rendering, conflict-sheet wiring) via the
  # `data-testid` contract. There is NO device, NO Rust backend, NO real transport
  # here, so this tier is deliberately labeled "flow-logic" and MUST NEVER be
  # called end-to-end: device-level UI testing is the SYNC-44 exemption (MYND-467).
  flow-logic:
    image: mcr.microsoft.com/playwright:v1.61.1-noble
    depends_on: [vitest]
    commands:
      - npm install -g pnpm@11.8.0
      - pnpm install --frozen-lockfile
      # The Playwright image ships the browsers; `pnpm dev` is started by the
      # config's webServer (reuseExistingServer:true → starts one in CI).
      - pnpm run test:flow

  # Failure notification via Pushover. The token + group come ONLY from CI
  # secrets, never committed (public repo). A missing secret makes the step skip
  # silently; failure:ignore keeps it from ever failing the pipeline.
  notify-failure:
    image: alpine:3.21
    depends_on:
      - name: cargo-fmt
        optional: true
      - name: cargo-checks
        optional: true
      - name: cargo-deny
        optional: true
      - name: pnpm-build
        optional: true
      - name: vitest
        optional: true
      - name: flow-logic
        optional: true
    environment:
      PUSHOVER_TOKEN:
        from_secret: pushover_token
      PUSHOVER_GROUP:
        from_secret: pushover_group
    commands:
      - apk add --no-cache curl
      - |
        if [ -z "$PUSHOVER_TOKEN" ]; then echo "pushover secret absent; skipping"; exit 0; fi
        curl -fsS -m 15 \
          --data-urlencode "token=$PUSHOVER_TOKEN" \
          --data-urlencode "user=$PUSHOVER_GROUP" \
          --data-urlencode "title=❌ $CI_REPO_NAME failed · $CI_COMMIT_BRANCH" \
          --data-urlencode "message=$CI_COMMIT_AUTHOR · $CI_COMMIT_MESSAGE" \
          --data-urlencode "url=$CI_PIPELINE_URL" \
          https://api.pushover.net/1/messages.json
    when:
      - event: [push, manual]
        status: failure
    failure: ignore

# Native build matrix (NOT run here — needs Xcode / Android SDK+NDK):
#   iOS:     pnpm tauri ios build      (mac runner, signing identity)
#   Android: pnpm tauri android build  (JDK 17 + Android SDK/NDK runner)
# See myne-ops for the reproducible mobile-build recipe (Phase-3 release track).
