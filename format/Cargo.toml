# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "myne-format"
version = "0.1.0"
description = "Myne: the on-disk format crate: NC05 read path, MYB1 backup container, the VaultIo seam, and the export-naming vocabulary"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/myne-md/myne"
publish = false

# Native-only by design: consumed by the desktop client and the `myne-decrypt`
# CLI. It carries the on-disk format with no TLS stack and no ML runtime, so the
# decrypter's `cargo tree` stays auditable. There is no `std::fs` purity here:
# the export walk uses `std::fs` directly (its own module doc says so) and the
# MYB1 container parser is a seek-based reader taking `&mut (dyn Read + Seek)`.
# Both are `#[cfg(not(target_arch = "wasm32"))]`; `VaultIo` is carried for the
# clients' host-side implementations, not for the walk.
[dependencies]
protocol = { path = "../protocol" }
# The Automerge CRDT (myne-md/myne#417): the NC05 note-type's single-`Text`
# bridge. Decode-only here: the encode half stays in `myne-core`, which needs
# `HostCtx` + the sync `crdt_doc` seam. Merges already-decrypted content; NOT
# crypto (its `sha2` is content-addressed change hashing, not key material).
automerge = "0.10"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
# `#[async_trait]` for the `VaultIo` seam. The trait MUST be `dyn`-compatible
# (core holds `&dyn VaultIo`), and Rust 1.96's native async-fn-in-trait is not.
async-trait = "0.1"
# NFC + case folding for the export-dedup collision oracle (export_naming).
unicode-normalization = { version = "0.1.25", default-features = false }
# SHA-256 for the MYB1 backup-container member hashes (unkeyed: corruption
# detection only, never tamper resistance (see §9.11.4).
sha2 = { version = "0.10", default-features = false }
# `Zeroizing` for the decoded note plaintext (decode_note_any returns
# `Zeroizing<Vec<u8>>`).
zeroize = { version = "1.8", features = ["alloc"] }
# UUIDv7 note-id parsing for the export walk's note enumeration (the walk
# reads `notes/<uuid>.myn` and binds the UUID into the note AAD). Already in
# the shared lock via `myne-core`; a transitive->direct promotion.
uuid = { version = "1", features = ["v4", "v7"] }
# The export walk emits stage-tagged tracing records (counts only, no paths,
# no ids: the DENY-list discipline). Same facade `protocol` already uses.
tracing = "0.1"

# Windows durability primitive for `atomic_write`'s `MoveFileExW` arm.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
# The `io_failure_kind` and `export_naming` tests assert JSON serialization and
# read the published embed-layout vectors.
serde_json = "1"
