# Woodpecker CI — DIAGNOSTIC MINIMAL VERSION
# Original config preserved at commit ddb9085; restore via:
#   git show ddb9085:.woodpecker.yml > .woodpecker.yml
#
# Purpose: prove Woodpecker can reach the repo, trigger on push, clone, and run a single step.
# If THIS pipeline also shows "step canceled" → repo not activated, webhook missing, or runner unavailable.
# If THIS works → the original 6-step pipeline has a syntax/depends_on/image issue, debug from there.

when:
  - event: push

steps:
  hello:
    image: alpine
    commands:
      - echo "✓ Woodpecker reachable; runner online; alpine pull OK"
      - echo "Branch: $CI_COMMIT_BRANCH"
      - echo "Commit: $CI_COMMIT_SHA"
      - echo "--- Repo files (clone OK?): ---"
      - ls -la
      - echo "--- .woodpecker.yml head: ---"
      - head -10 .woodpecker.yml
