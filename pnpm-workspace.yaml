packages:
  # Shared frontend source packages (consumed as source by desktop `src/` and
  # mobile `myne-mobile/src/`) — the JS analog of the shared `core`/`protocol`
  # Rust crates. Phase A editor/dialect extraction.
  - dialect
  - editor
  # Shared load-bearing user-facing copy (SYNC-42) — privacy-property strings
  # kept byte-identical across the desktop + mobile clients by construction.
  - copy
allowBuilds:
  # @swc/core is pulled in by the dev-only i18next-cli (string extraction). Its
  # prebuilt binary loads without a local build step (extraction runs fine), so
  # decline the build — consistent with esbuild, keeps builds reproducible.
  '@swc/core': false
  esbuild: false
