packages:
  # The mobile client. Unlike `web/` — a pure Vite target with no package.json
  # of its own — this is a second Tauri APPLICATION: it owns a tauri.conf.json,
  # its own CLI invocations (`tauri ios dev`, `tauri android build`) and an icon
  # sync hook, and Tauri runs `beforeDevCommand` with `mobile/` as the cwd. So it
  # keeps its package.json and joins as a workspace MEMBER, which is what buys
  # the thing the split never could: one lockfile, one node_modules, and no way
  # for a shared dependency to be pinned differently here than in `src/`.
  - mobile
  # Shared frontend source packages (consumed as source by desktop `src/` and
  # `mobile/src/`) — the JS analog of the shared `core`/`protocol` Rust crates.
  # Phase A editor/dialect extraction.
  - dialect
  - editor
  # Shared load-bearing user-facing copy (SYNC-42) — privacy-property strings
  # kept byte-identical across the desktop + mobile clients by construction.
  - copy
  # The cross-client DECISION layer (myne-md/myne#242), the questions both
  # clients answer, where a divergence is a bug by definition. Holds the
  # TypeScript mirrors of the Rust error enums that live in `core/`/`protocol/`,
  # and the token layer a custom theme can set. Narrow on purpose: a module
  # belongs here only if it touches no host at all, which is what keeps it
  # `seam: null` in `scripts/check-platform-seam.mjs`.
  - client-core
  # Shared ornament layer (myne#394) — the stylesheet a custom theme's ornament
  # selections resolve against, plus the role helper components declare through.
  - ornaments
  # Theme-preview snapshot (myne#394) — the real editor's DOM + stylesheet,
  # captured from the running app, so a theme preview is Myne rather than a
  # hand-written imitation of it. Consumed by the website builder and the
  # myne-themes gallery renderer.
  - preview
allowBuilds:
  # @swc/core is pulled in by the dev-only i18next-cli (string extraction). Its
  # prebuilt binary loads without a local build step (extraction runs fine), so
  # decline the build — consistent with esbuild, keeps builds reproducible.
  '@swc/core': false
  esbuild: false
minimumReleaseAgeExclude:
  - '@tauri-apps/api@2.12.1'
  - '@tauri-apps/cli-darwin-arm64@2.12.1'
  - '@tauri-apps/cli-darwin-x64@2.12.1'
  - '@tauri-apps/cli-linux-arm-gnueabihf@2.12.1'
  - '@tauri-apps/cli-linux-arm64-gnu@2.12.1'
  - '@tauri-apps/cli-linux-arm64-musl@2.12.1'
  - '@tauri-apps/cli-linux-riscv64-gnu@2.12.1'
  - '@tauri-apps/cli-linux-x64-gnu@2.12.1'
  - '@tauri-apps/cli-linux-x64-musl@2.12.1'
  - '@tauri-apps/cli-win32-arm64-msvc@2.12.1'
  - '@tauri-apps/cli-win32-ia32-msvc@2.12.1'
  - '@tauri-apps/cli-win32-x64-msvc@2.12.1'
  - '@tauri-apps/cli@2.12.1'
