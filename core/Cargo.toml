# SPDX-License-Identifier: AGPL-3.0
[package]
name = "myne-core"
version = "0.1.0"
description = "Myne — shared backend logic (vault/notes/prefs plugin cores) for the desktop and mobile clients"
edition = "2021"
license = "AGPL-3.0"
repository = "https://github.com/myne-md/myne"
publish = false

# std-bound (Tauri/tokio/fs) — unlike the no_std `protocol` crate, this shared
# crate carries the host-coupled plugin cores. Remaining desktop-only couplings
# (search, spell, clipper, pdf, workspace) attach through
# `hooks::VaultLifecycleHooks` rather than living here. The `sync` engine was
# extracted into this crate (decisions.md 2026-07-07).
[dependencies]
protocol = { path = "../protocol" }
# The single source-of-truth custom-theme value-shape allowlist (MYND-508),
# shared with the desktop client + the myne-themes marketplace CI. The
# `themes` core plugin (MYND-486) validates every imported palette through
# `theme_validator::validate_theme` before sealing it into the MYT1
# `vault.themes` blob — no reimplementation of the security-load-bearing
# injection guard (threat-model §149).
theme-validator = { path = "../theme-validator" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync"] }
zeroize = { version = "1.8", features = ["alloc", "derive"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v7"] }
sha2 = { version = "0.10", default-features = false }
unicode-normalization = { version = "0.1.25", default-features = false }
# Vault-id / wrap-key CSPRNG bytes in the vault-creation core. Same version the
# desktop crate already pins (resolved from the shared workspace lock).
getrandom = "0.2"
# Compact binary serialization for the vault-indices (MYI1) snapshot payload
# (`plugins::vault_indices::persist`). Same pin the desktop crate uses for the
# search-index blob (varint, no field names); pure-Rust, `no_std`+`alloc`.
postcard = { version = "1", default-features = false, features = ["alloc"] }
# Snowball stemmers for the full-text search index (MYS1, `search`). The same
# crate tantivy uses internally; pure-Rust, EN/TR/DE among 18 languages. Moved
# here with the search engine (was desktop-only); same pin as the shared lock.
rust-stemmers = "1"
# Per-note language detection for the full-text search index (MYS1, `search`).
# Pure-Rust trigram model; the index detects each note's language and
# single-stems it while the query stays multi-stemmed. Moved here with the
# search engine (was desktop-only); same pin as the shared lock.
whatlang = "0.18"
# Phase 2 sync transport (extracted from the desktop crate with the sync engine,
# decisions.md 2026-07-07). base64 = the SCRAM/enroll wire encoding; the
# raw-rustls connection layer that SCRAM auth + sync push/pull share — one TLS
# path with cert-pinning (A4) and keying-material export (tls-exporter, SCRAM
# channel binding, SYNC-3). Unconditional (SYNC-33): every core consumer wanting
# sync wants the transport; desktop + mobile inherit these via the `myne-core`
# path dep. The `ring` provider is chosen over the default `aws-lc-rs` for a more
# reproducible build (no C/CMake toolchain → cross-compiles for iOS/Android).
# NOTE: the cert-pin verifier + tls-exporter wiring is R3-gated — a
# primitive-level security review + live interop test are still owed before
# production trust. Recorded in `docs/dependency-policy.md`. Apache-2.0/ISC/MIT.
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"

# Windows durability primitive: `MoveFileExW(MOVEFILE_WRITE_THROUGH)` backs the
# Windows arm of `atomic_write::finalize_atomic` (moved here from the desktop
# crate with the plugin cores). Only `Win32_Storage_FileSystem` is needed — the
# desktop crate's extra features (KeyboardAndMouse / SystemInformation) stay
# desktop-side with `auto_lock`. Same `0.60` pin already locked in the shared
# workspace lock (zero dependency-tree expansion).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Storage_FileSystem"] }

# `security-framework` (+ its `-sys` for the access-control flag constant) backs
# the MYND-329 Apple biometric quick-unlock provider (`plugins/quick_unlock/apple.rs`):
# a Keychain item gated by `kSecAccessControlBiometryCurrentSet` (gated read =
# the biometric prompt; the OWASP/Teleport "gate the resource, not a boolean"
# lesson). Moved here from the desktop crate — same pins, now shared with the
# mobile client for iOS Face ID / Touch ID (decisions.md 2026-06-17 original
# dep decision; 2026-07-12 macOS→macOS+iOS generalization). The provider's FFI
# is hardware-gated and pending biometric-device + primitive-level review
# before it is trusted.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
security-framework = "3"
security-framework-sys = "2"

[features]
# Gates the cross-plugin test fixtures (`test_support`) so the desktop/mobile
# clients can pull them in as a dev-dependency (`features = ["test-support"]`)
# while production builds never compile them. The crate's own unit tests reach
# the module via `#[cfg(any(test, feature = "test-support"))]`.
test-support = []

[dev-dependencies]
tracing-test = "0.2"
