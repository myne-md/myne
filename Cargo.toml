[workspace]
# `web/wasm` is the Phase 3 web client's wasm entry surface (task 11). It joins
# THIS workspace rather than forming its own so the tree keeps a single
# `Cargo.lock` — the TB9 audit anchor, and a constraint enforced three separate
# ways (lefthook `cargo-lock-singleton`, `scripts/hooks-parity-check.sh`,
# `src-tauri/scripts/ai-no-network-check.sh`). Its host build compiles the pure
# router/classification logic and its unit tests; the JS boundary and the CSPRNG
# registration are `cfg(target_arch = "wasm32")`. See `web/wasm/Cargo.toml`.
#
# `cli` (cli-thin-client MYND-490, task 4) is the `myne` sidecar binary: it
# does NOT depend on `myne-desktop` or `myne-core` — it talks to the running
# desktop only over the local command socket's JSON wire contract (its own
# copy of the framing/wire types, deliberately not shared — see
# `src-tauri/src/cli_bridge/dispatch.rs`'s doc comment). It joins this
# workspace purely for the single shared `Cargo.lock` (TB9).
#
# `tor-sidecar` (desktop Tor routing, MYND-650) is the `myne-tor` binary: arti
# run as a standalone loopback SOCKS5 proxy. Like `cli`, it joins the workspace
# for the shared `Cargo.lock` — but here that is the whole reproducible-build
# argument for bundling a Tor client at all. Critically, NOTHING depends on it:
# it is spawned as a subprocess, never linked, so arti stays outside
# `myne-desktop`'s `cargo tree -e normal` closure and the no-egress gate keeps
# scanning a tree with no networked crate in it.
#
# `mobile/src-tauri` (+ its five Tauri plugins) is the Phase 3 mobile client,
# moved in-repo from the `myne-mobile` companion. It joins here for the reason
# the split could never deliver: it path-depends on `protocol` and `core` and
# aliases ~25 TS specifiers into `src/`, `editor/`, `dialect/` and `ornaments/`,
# so it never built outside a `myne` checkout — while resolving its own second
# `Cargo.lock`, in which 62 of 572 shared crates had drifted from this one
# (`bip39 -> bitcoin_hashes` among them). One lock is what makes TB9's audit
# anchor describe the artefact mobile actually ships. The five plugins are listed
# explicitly rather than left to cargo's automatic path-dependency membership,
# because this list is the documented source of truth (CLAUDE.md).
members = ["src-tauri", "protocol", "core", "e2e/fixture-gen", "theme-validator", "web/wasm", "web/bench/wasm", "cli", "tor-sidecar", "mobile/src-tauri", "mobile/src-tauri/tauri-plugin-screen-guard", "mobile/src-tauri/tauri-plugin-share-intent", "mobile/src-tauri/tauri-plugin-qr-scan", "mobile/src-tauri/tauri-plugin-reminders", "mobile/src-tauri/tauri-plugin-sensitive-clipboard"]
resolver = "2"

# Optimize the on-device AI math crates even in DEV builds. Candle + its `gemm`
# matmul backend are catastrophically slow when compiled unoptimized — a single
# MiniLM embed runs ~2s in a debug build vs ~tens of ms optimized — which would
# make `pnpm tauri dev` feel frozen (the embed-on-unlock walk hogs the CPU for
# minutes and starves interactive inference). Since `local-inference` is now in
# `default` (decisions.md 2026-07-02) these crates compile in every dev build, so
# this override always applies — but it is still a `profile.dev` override only,
# leaving the reproducible RELEASE build unchanged. A `--no-default-features`
# build drops candle entirely and never hits this. Workspace/app crates stay at
# dev opt-level for fast incremental rebuilds + debuggability.
[profile.dev.package.candle-core]
opt-level = 3
[profile.dev.package.candle-nn]
opt-level = 3
[profile.dev.package.candle-transformers]
opt-level = 3
[profile.dev.package.gemm]
opt-level = 3
[profile.dev.package.half]
opt-level = 3

# Same reasoning for the OCR runtime (MYND-441): `rten` and its matmul/SIMD
# kernels are unusable unoptimized — the fixture-image test alone takes seconds
# in a plain debug build, and the background extraction queue would peg a core
# for the whole of `pnpm tauri dev`. Unlike candle these are NOT feature-gated:
# OCR ships in every build (it is search correctness, not an AI feature), so this
# override always applies. `profile.dev` only — the reproducible RELEASE build is
# unchanged.
[profile.dev.package.rten]
opt-level = 3
[profile.dev.package.rten-gemm]
opt-level = 3
[profile.dev.package.rten-simd]
opt-level = 3
[profile.dev.package.rten-vecmath]
opt-level = 3
[profile.dev.package.rten-tensor]
opt-level = 3

# The crypto-hot leaf crates, moved here verbatim from `mobile/src-tauri`'s own
# manifest when the mobile client came in-repo. They MUST live at the workspace
# root: cargo silently ignores a `[profile]` table in a non-root member, so
# leaving them where they were would have turned them off with no warning and no
# build failure — and the thing they buy is that an unoptimized Argon2id at
# m=256 MiB does not turn an on-device debug unlock into minutes (observed on the
# iOS simulator). Desktop dev builds now get the same treatment, which is a
# straight improvement; `profile.dev` only, so the reproducible RELEASE build is
# unchanged on every client.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

# The remaining gemm variants mobile's candle transcription path (MYND-563)
# pinned; `gemm` and `half` are already covered above.
[profile.dev.package."gemm-f16"]
opt-level = 3
[profile.dev.package."gemm-f32"]
opt-level = 3
[profile.dev.package."gemm-common"]
opt-level = 3

# Same override for the `test` profile (it does NOT inherit `profile.dev`'s
# per-package settings), so the `#[ignore]`d real-model smoke tests in
# `engine_candle.rs` run with optimized candle instead of a ~50×-slower debug
# build.
[profile.test.package.candle-core]
opt-level = 3
[profile.test.package.candle-nn]
opt-level = 3
[profile.test.package.candle-transformers]
opt-level = 3
[profile.test.package.gemm]
opt-level = 3
[profile.test.package.half]
opt-level = 3
[profile.test.package.rten]
opt-level = 3
[profile.test.package.rten-gemm]
opt-level = 3
[profile.test.package.rten-simd]
opt-level = 3
[profile.test.package.rten-vecmath]
opt-level = 3
[profile.test.package.rten-tensor]
opt-level = 3
